<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Venue Event</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: the existing Event Planner product, no new styling
   IDEA: mockup #9, venue_create_event_1..4: a 4-step wizard that really steps through
   COLOUR and TYPE: DESIGN_GUIDE.md tokens, Inter
   LAYOUT: one responsive page: sidebar at 1024px+, drawer below, phone layout with bottom action bar below 768px */
:root{color-scheme:light;--bg:#F6F7FB;--sf:#fff;--sfm:#F8F9FC;--bd:#E5E8F0;--bds:#CFD4E2;--tx:#0F1433;--mu:#5B6480;--sb:#626B85;--pr:#4F46E5;--prh:#4338CA;--prs:#EEF0FF;--prb:#C9CDFB;--nv1:#0F1535;--nv2:#151C47;--nvr:#1B2350;--nvb:#262E5C;--nvt:#F1F3FB;--nvm:#B4BBD6;--sh:0 1px 2px rgb(15 20 51/6%);--shm:0 8px 24px rgb(15 20 51/12%);--shb:0 -4px 16px rgb(15 20 51/8%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
ul{list-style:none}a{text-decoration:none;color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.i{flex:none;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--pr);color:#fff}.btn.pri:hover{background:var(--prh)}
.btn.sec{background:#fff;color:var(--pr);border:1px solid var(--prb)}.btn.sec:hover{border-color:var(--pr)}
.btn.soft{background:var(--prs);color:var(--pr)}
.btn.ghost{color:var(--mu)}.btn.ghost:hover{background:var(--sfm)}
.btn.sm{height:36px;padding:0 14px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.success{color:#15803D;background:#E6F7EC;border-color:#BDE5CB}
.warning{color:#B45309;background:#FFF4E3;border-color:#F8D8A4}
.info{color:#4338CA;background:#EEF0FF;border-color:#C9CDFB}
.neutral{color:#475069;background:#ECEFF5;border-color:#D9DEEA}
/* shell (same as the other venue screens) */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30;background:linear-gradient(180deg,var(--nv1),var(--nv2));color:var(--nvt);display:flex;flex-direction:column;padding:16px}
.dh{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;padding:4px 8px 0}
.logo .mk{width:32px;height:32px;border-radius:8px;background:var(--pr);display:grid;place-items:center;color:#fff}
.xb{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--nvb);place-items:center;color:var(--nvt)}
.ws{position:relative;margin-top:20px}
.wsbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--nvr);border:1px solid var(--nvb);text-align:start;color:var(--nvt)}
.wsbtn.open{border-color:var(--nvm)}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.tile.v{background:linear-gradient(135deg,#6366F1,#4F46E5)}
.tile.p{background:var(--prs);color:var(--pr)}
.wsbtn .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}
.wsbtn .sub{font-size:12px;color:var(--nvm)}
.wsbtn .grow{flex:1}
.wsbtn .i:last-child{color:var(--nvm)}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--nvm)}
.nav a.on{background:var(--nvr);color:var(--nvt);font-weight:600}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.lang{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--nvb);background:var(--nvr);font-size:14px}
.lang span{flex:1}
.out{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;font-size:14px;color:var(--nvm)}
.menu{position:absolute;left:0;top:calc(100% + 8px);width:100%;min-width:216px;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:5}
.menu h4{font-size:12px;font-weight:500;color:var(--mu);padding:8px 12px 4px}
.mi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;width:100%;text-align:start}
.mi.sel{background:var(--prs)}
.mi .tx{flex:1}.mi .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}.mi .sub{font-size:12px;color:var(--mu)}
.mi .ck{color:var(--pr)}
.mi:hover{background:var(--sfm)}.mi.sel:hover{background:var(--prs)}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 32px;position:sticky;top:0;z-index:20}
.ibtn{width:44px;height:44px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--tx)}
.top .mk{display:none;width:40px;height:40px;border-radius:10px;background:var(--pr);place-items:center;color:#fff}
.top .sp{flex:1}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--mu)}
.bell em{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:#C81E1E;color:#fff;font-size:11px;font-weight:600;font-style:normal;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.av{width:40px;height:40px;border-radius:50%;background:var(--prs);color:var(--pr);font-size:14px;font-weight:600;display:grid;place-items:center;flex:none}
.who{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}.who .i{color:var(--mu)}
.content{padding:24px 32px 40px;width:100%;max-width:1344px}
.hidden{display:none!important}
.toast{position:fixed;right:24px;bottom:24px;background:var(--tx);color:#fff;font-size:14px;padding:12px 16px;border-radius:10px;box-shadow:var(--shm);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:80;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:none}
.app.withmock .toast{bottom:80px}
/* mockup state switcher (not part of the product) */
.mock{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:70;display:flex;align-items:center;gap:8px;background:#fff;border:1px dashed var(--bds);border-radius:14px;box-shadow:var(--shm);padding:6px 6px 6px 14px;font-size:12px;color:var(--mu)}
.mock .seg{display:flex;gap:4px}.mock .seg button{height:32px;padding:0 10px;border-radius:10px;font-size:12px;font-weight:500;color:var(--mu)}
.mock .seg button.on{background:var(--pr);color:#fff;font-weight:600}
.mock .seg button{white-space:nowrap}
.mock .hx{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--mu)}

/* ===== page header ===== */
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mu);margin-bottom:16px}
.crumb a{display:inline-flex;align-items:center;gap:6px;color:var(--pr);font-weight:600}
.crumb .i{color:var(--sb)}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.ph h1{font-size:32px;line-height:1.2;font-weight:700}
.ph p{color:var(--mu);margin-top:4px}

/* ===== step indicator ===== */
.stepper{margin-top:24px;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px 24px}
.stepper ol{display:flex;align-items:flex-start;list-style:none}
.stepper li{flex:1;display:flex;align-items:flex-start;min-width:0}
.stepper li:last-child{flex:none}
.sbtn{display:flex;align-items:center;gap:12px;text-align:start;border-radius:10px;padding:2px;min-width:0}
.sbtn[disabled]{cursor:default}
.dot{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid var(--bds);background:#fff;color:var(--mu)}
.cur .dot{border-color:var(--pr);background:var(--pr);color:#fff;box-shadow:0 0 0 4px var(--prs)}
.done .dot{border-color:var(--pr);background:var(--prs);color:var(--pr)}
.sl{display:flex;flex-direction:column;min-width:0}
.sl b{font-size:14px;font-weight:600;line-height:1.3;color:var(--mu);white-space:nowrap}
.sl small{font-size:12px;color:var(--sb);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.cur .sl b,.done .sl b{color:var(--tx)}
.done .sbtn:hover .sl b{color:var(--pr)}
.line{flex:1;height:2px;background:var(--bd);margin:17px 16px 0;border-radius:2px;min-width:24px}
.line.on{background:var(--pr)}
.scount{display:none}

/* ===== step card ===== */
.card{margin-top:24px;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
.chd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 24px;border-bottom:1px solid var(--bd)}
.chd h2{font-size:18px;font-weight:600;line-height:1.3}
.chd p{font-size:14px;color:var(--mu);margin-top:4px}
.cbody{padding:24px}
.cfoot{display:flex;align-items:center;gap:12px;padding:16px 24px;border-top:1px solid var(--bd)}
.cfoot .sp{flex:1}
.cfoot .hint{font-size:14px;color:var(--mu)}
.pbar{display:none}

/* selected context chip (top of steps 2-3) */
.ctx{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--sfm);border:1px solid var(--bd);border-radius:10px;margin-bottom:20px;font-size:14px}
.ctx .mini{width:40px;height:32px;border-radius:6px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.ctx .mini svg.ph{position:absolute;inset:0;width:100%;height:100%}
.ctx .grow{flex:1;min-width:0}.ctx b{font-weight:600}.ctx .m{color:var(--mu)}
.ctx a{color:var(--pr);font-weight:600;white-space:nowrap}

/* option cards: spaces and layouts */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.oc{position:relative;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);display:flex;flex-direction:column;text-align:start;min-width:0;transition:border-color .15s,box-shadow .15s}
button.oc:hover{border-color:var(--bds)}
.oc.sel{border-color:var(--pr);box-shadow:0 0 0 1px var(--pr),var(--sh)}
.oc.off{background:var(--sfm);box-shadow:none;cursor:default}
.cov{height:132px;border-radius:13px 13px 0 0;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:700;letter-spacing:1px}
.cov svg.ph,.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.oc.off .cov{filter:grayscale(1);opacity:.55}
.radio{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--bds);display:grid;place-items:center;color:#fff;z-index:2}
.oc.sel .radio{background:var(--pr);border-color:var(--pr)}
.cov .badge,.th .badge{position:absolute;top:12px;left:12px;z-index:2}
.ob{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.ob h3{font-size:18px;font-weight:600;line-height:1.3}
.ob .ad{font-size:14px;color:var(--mu);display:flex;gap:8px;align-items:flex-start;margin-top:4px}
.ob .ad .i{color:var(--sb);margin-top:2px}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--sfm);border:1px solid var(--bd);border-radius:10px}
.figs div{padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;min-width:0}
.figs div+div{border-left:1px solid var(--bd)}
.figs b{font-size:16px;font-weight:700;line-height:1.3}
.figs span{font-size:12px;color:var(--sb)}
.figs .over b{color:#B45309}
.ob .up{font-size:14px;color:var(--mu);display:flex;gap:8px;align-items:center}
.ob .up .i{color:var(--sb)}
.ob .why{font-size:14px;color:var(--mu)}
.ob .why a{color:var(--pr);font-weight:600}
.th{height:168px;border-radius:13px 13px 0 0;overflow:hidden;position:relative;background:var(--sfm);border-bottom:1px solid var(--bd)}
.th svg{display:block;width:100%;height:100%}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:14px;background:#FFF4E3;border:1px solid #F8D8A4;border-radius:10px;padding:10px 12px}
.warn .i{color:#B45309;margin-top:2px}
.warn b{color:#B45309;font-weight:600;display:block}
.warn span span{color:#475069}
.foot-note{margin-top:20px;font-size:14px;color:var(--mu);display:flex;gap:8px;align-items:center}
.foot-note .i{color:var(--sb)}
.foot-note a{color:var(--pr);font-weight:600}

/* notices */
.notice{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border:1px solid;border-radius:14px}
.notice>.i{margin-top:2px}
.notice .grow{flex:1;min-width:0}
.notice b{display:block;font-weight:600;font-size:16px}
.notice p{font-size:14px;color:#475069;margin-top:2px}
.notice.warning b,.notice.warning>.i{color:#B45309}
.notice.info b,.notice.info>.i{color:#4338CA}
.notice.danger{color:#C81E1E;background:#FDECEC;border-color:#F6C4C4}

/* form */
.form{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}
.fcol{display:flex;flex-direction:column;gap:20px}
.lb{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-bottom:8px;line-height:1.4}
.lb .req{color:#C81E1E;margin-left:-4px}
.lb .cc{margin-left:auto;font-size:12px;font-weight:400;color:var(--sb)}
.lb .opt{font-weight:400;color:var(--mu)}
.inp{display:block;height:44px;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff;padding:0 16px;font:inherit;font-size:14px;color:var(--tx)}
.inp::placeholder{color:var(--sb)}
.inp:hover{border-color:var(--bds)}
.inp:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.help{font-size:12px;color:var(--mu);margin-top:8px;line-height:1.5}
.f.err .inp,.f.err .sel{border-color:#C81E1E}
.f.err .help{color:#C81E1E}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.icn{position:relative}.icn .inp{padding-left:44px}.icn>.i{position:absolute;left:14px;top:13px;color:var(--sb);pointer-events:none}
.dd{position:relative}
.sel{height:44px;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:14px;text-align:start}
.sel:hover{border-color:var(--bds)}
.sel[aria-expanded=true]{border-color:var(--pr)}
.sel .i{color:var(--sb)}.sel .v{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sel .ph0{flex:1;color:var(--sb)}
.pop{position:absolute;left:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:12px;z-index:15}
/* calendar */
.cal{width:320px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh b{font-size:14px;font-weight:600}
.calh button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mu)}
.calh button:hover{background:var(--sfm)}
.calh button:disabled{opacity:.35;cursor:not-allowed}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calg .wd{font-size:12px;color:var(--sb);padding:4px 0}
.calg button{height:40px;border-radius:10px;font-size:14px;position:relative}
.calg button:hover:not(:disabled){background:var(--sfm)}
.calg button:disabled{color:#B4BBD6;cursor:not-allowed}
.calg button.today{font-weight:700;color:var(--pr)}
.calg button.pick{background:var(--pr);color:#fff;font-weight:600}
.calg button.bk::after{content:'';position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#B45309}
.calg button.pick.bk::after{background:#fff}
.cleg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
.cleg i{width:6px;height:6px;border-radius:50%;background:#B45309;flex:none}
/* time list */
.tl{width:100%;max-height:248px;overflow-y:auto;padding:8px}
.tl button{display:flex;align-items:center;width:100%;height:40px;padding:0 12px;border-radius:10px;font-size:14px;text-align:start}
.tl button span{flex:1}
.tl button:hover{background:var(--sfm)}
.tl button.on{background:var(--prs);color:var(--pr);font-weight:600}
/* cover */
.covf{border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.cpv{height:176px;position:relative;display:grid;place-items:center;color:#fff;font-size:36px;font-weight:700;letter-spacing:1px;overflow:hidden}
.cpv img,.cpv svg.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cpv .badge{position:absolute;top:12px;left:12px}
.cpb{padding:16px;display:flex;flex-direction:column;gap:12px}
.cpb .pb{display:flex;gap:8px;flex-wrap:wrap}
.cpb .help{margin-top:0}
.swatch{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu)}
.swatch button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--bd)}
.swatch button.on{box-shadow:0 0 0 2px var(--pr)}
.sameday{margin-top:4px}

/* review */
.rv{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.rbox{border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.rhd{display:flex;gap:16px;align-items:center;padding:16px 20px;background:var(--sfm);border-bottom:1px solid var(--bd)}
.rhd .rc{width:88px;height:64px;border-radius:10px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700}
.rhd .rc img,.rhd .rc svg.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rhd .grow{flex:1;min-width:0}
.rhd h3{font-size:18px;font-weight:600;line-height:1.3}
.rhd p{font-size:14px;color:var(--mu)}
dl.dl{display:grid;grid-template-columns:180px minmax(0,1fr) auto}
dl.dl>div{display:contents}
dl.dl dt,dl.dl dd{padding:14px 20px;border-bottom:1px solid var(--bd);font-size:14px}
dl.dl>div:last-child dt,dl.dl>div:last-child dd{border-bottom:0}
dl.dl dt{color:var(--mu);font-weight:500;display:flex;gap:8px;align-items:center}
dl.dl dt .i{color:var(--sb)}
dl.dl dd{font-weight:500}
dl.dl dd small{display:block;font-size:12px;color:var(--mu);font-weight:400}
dl.dl dd.ed{text-align:end;padding-left:0}
dl.dl dd.ed button{color:var(--pr);font-weight:600;font-size:14px;padding:2px 4px;border-radius:6px}
.rfigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px}
.kpi .grow{flex:1;min-width:0}
.kpi .l{font-size:14px;color:var(--mu)}
.kpi b{display:block;font-size:24px;font-weight:700;line-height:1.3}
.kpi small{font-size:12px;color:var(--sb)}
.kic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--prs);color:var(--pr)}
.kic.a{background:#FFF4E3;color:#B45309}
.kpi.over b{color:#B45309}
.rwarn{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.side2{display:flex;flex-direction:column;gap:16px}
.clientc{border:1px solid var(--bd);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.clientc h3{font-size:18px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:8px}
.clientc h3 .badge{font-weight:600}
.clientc>p{font-size:14px;color:var(--mu)}

const grid=(cols,rows,x0,x1,y0,y1,fn)=>{let s='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const x=cols===1?(x0+x1)/2:x0+(x1-x0)*c/(cols-1),y=rows===1?(y0+y1)/2:y0+(y1-y0)*r/(rows-1);s+=fn(x,y,r,c)}return s};
function thumb(l){const g='g'+l.id;let t='';
 if(l.k==='rounds')t=l.t>=40?grid(8,5,62,258,62,142,(x,y)=>rnd(x,y,5,10)):grid(l.t>=28?7:6,4,70,250,66,140,(x,y)=>rnd(x,y,5.5,10));
 else if(l.k==='long')t=l.t>=24?grid(4,6,74,246,60,144,(x,y)=>lng(x,y,36,5)):grid(3,l.t>=14?5:4,90,230,64,140,(x,y)=>lng(x,y,44,6));
 else if(l.k==='mixed')t=grid(8,6,62,258,58,146,(x,y,r)=>r%2?sq(x,y):rnd(x,y,4.6,8));
 else t=grid(4,3,90,230,70,136,(x,y)=>rnd(x,y,6,10));
 return `<svg viewBox="0 0 320 168" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Floor plan preview of ${esc(l.n)}"><defs><pattern id="${g}" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#E5E8F0" stroke-width=".6"/></pattern></defs>
 <rect width="320" height="168" fill="#F8F9FC"/><rect x="24" y="10" width="272" height="150" rx="3" fill="#fff"/><rect x="24" y="10" width="272" height="150" rx="3" fill="url(#${g})" stroke="#CFD4E2" stroke-width="1.2"/>
 <rect x="118" y="16" width="84" height="22" rx="2" fill="#EEF0FF" stroke="#C9CDFB"/><text x="160" y="30" font-size="8" font-family="Inter,sans-serif" fill="#4338CA" text-anchor="middle" font-weight="600">Stage</text>
 <rect x="30" y="66" width="12" height="60" rx="2" fill="#EEF0FF" stroke="#C9CDFB"/><rect x="278" y="66" width="12" height="60" rx="2" fill="#E6F7EC" stroke="#BDE5CB"/>
 <rect x="150" y="155" width="20" height="5" rx="1" fill="#FFF4E3" stroke="#F8D8A4"/>${t}</svg>`}

  <p class="scount">${S.done?'All steps done':`Step ${S.step} of 4 · ${STEPS[S.step-1][1]}`}</p></nav>`}

function calendar(){const s=SPC(),m=S.calM;const y=m.getFullYear(),mo=m.getMonth();

  cells+=`<button type="button" data-day="${k}" class="${k===S.date?'pick':''}${bk?' bk':''}${k===iso(TODAY)?' today':''}" ${past?'disabled':''} aria-label="${fmtL(k)}${bk?', another event in this space':''}" ${k===S.date?'aria-pressed="true"':''}>${d}</button>`}

 <div class="side2">

 const body=S.done?done():[step1,step2,step3,step4][S.step-1]();
 $('page').innerHTML=`<nav class="crumb" aria-label="Breadcrumb"><a href="#" data-soon="events">${I('back',16)}My Events</a>${I('right',14)}<span aria-current="page">Create Event</span></nav>
 <div class="ph"><div><h1>Create Event</h1><p>Set up an event in one of your spaces, then share it with your client.</p></div></div>
 ${S.from&&!S.done?`<div class="notice info" style="margin-top:20px">${I('info',20)}<div class="grow"><b>Started from ${esc(S.from)}</b><p>The space and layout are already chosen. Use Back or the steps above to change them.</p></div></div>`:''}
 ${stepper()}${body}`;
 renderBar();
 $('app').classList.toggle('isdone',S.done);
 renderMock()}
const render=()=>{renderSide();renderMain()};

/* ---------- navigation and validation ---------- */
function validate(st){const e={};
 if(st===1&&!S.space)e.space=1;
 if(st===2&&!S.layout)e.layout=1;
 if(st===3){if(!S.name.trim())e.name=1;if(!S.date)e.date=1;if(!S.time)e.time=1}
 if(st===4&&S.email.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email.trim()))e.email=1;
 S.errs=e;return !Object.keys(e).length}
function go(n,focus=true){S.step=n;S.errs={};S.pop=null;S.done=false;S.mock='s'+n;renderMain();if(focus)focusTop();setHash('step'+n)}
const focusTop=()=>{const h=document.querySelector('.card h2');window.scrollTo({top:0});if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}};
function next(){if(!validate(S.step)){renderMain();const f=document.querySelector('.f.err .inp,.f.err .sel,.notice.danger');if(f&&f.focus)f.focus();return}go(S.step+1)}
function create(){if(!validate(4)){renderMain();$('f-email').focus();return}S.done=true;S.mock='done';renderMain();focusTop();setHash('done');toast('The event was created.')}
const setHash=h=>history.replaceState(null,'',h?'#'+h:location.pathname+location.search);

/* ---------- mockup state switcher ---------- */
const MOCKS=[['s1','<span class="dsk">Step </span>1'],['s2','<span class="dsk">Step </span>2'],['s3','<span class="dsk">Step </span>3'],['same','Same day'],['s4','<span class="dsk">Step </span>4'],['done','Created']];
function renderMock(){$('mseg').innerHTML=MOCKS.map(([k,l])=>`<button data-mock="${k}" class="${S.mock===k?'on':''}">${l}</button>`).join('')}
function sample(sameDayDate){S.ws='grand-garden-hall';S.space='main';S.layout=1;S.name="Maya & Daniel's Wedding";S.date=sameDayDate?'2026-12-17':'2027-01-14';S.time='19:00';S.calM=new Date(parse(S.date).getFullYear(),parse(S.date).getMonth(),1);S.email=S.email||'maya.cohen@example.com';S.from=null}
function applyMock(k,focus){S.pop=null;S.errs={};S.wsOpen=false;
 if(k==='s1'){S.space=null;S.layout=null;S.name='';S.date=null;S.time=null;S.email='';S.cover={kind:'gen',sw:'a',img:null};S.from=null;S.step=1;S.done=false}
 else if(k==='s2'){S.ws='grand-garden-hall';S.space='main';S.layout=null;S.from=null;S.step=2;S.done=false}
 else if(k==='s3'){sample(false);S.step=3;S.done=false}
 else if(k==='same'){sample(true);S.step=3;S.done=false}
 else if(k==='s4'){sample(true);S.step=4;S.done=false}
 else if(k==='done'){sample(true);S.step=4;S.done=true}
 else if(k==='from'){S.ws='grand-garden-hall';S.space='main';S.layout=1;S.from='Main Hall › Wedding Rounds';S.name='';S.date=null;S.time=null;S.step=3;S.done=false;k='s3'}
 S.mock=k;render();setHash(k==='s1'?'':k==='same'?'sameday':k==='done'?'done':'step'+S.step);if(focus)focusTop()}

/* ---------- events ---------- */
const app=$('app');
app.addEventListener('click',e=>{
 const t=e.target;
 if(t.closest('#wsb')){S.wsOpen=!S.wsOpen;renderSide();return}
 const ws=t.closest('[data-ws]');
 if(ws){const k=ws.dataset.ws;S.wsOpen=false;if(k==='personal'){renderSide();toast('Switches to your Personal events.');return}
  if(k!==S.ws){S.ws=k;S.space=null;S.layout=null;S.from=null;S.step=1;S.done=false;S.errs={};S.mock='s1';render();toast(`Switched to ${DATA[k].n}. Choose one of its spaces.`)}else renderSide();return}
 if(S.wsOpen&&!t.closest('#ws')){S.wsOpen=false;renderSide()}
 const mk=t.closest('[data-mock]');if(mk){applyMock(mk.dataset.mock,false);return}
 const soon=t.closest('[data-soon]');if(soon){e.preventDefault();const m={events:'Opens Venue → My Events (screen #2).',spaces:'Opens My Spaces (screen #3).',team:'Opens the Team page (screen #7).',settings:'Opens Venue Settings (screen #8).',addlayout:'Opens the layout editor for Rooftop Lounge (screen #6).',open:'Opens the new event\'s Dashboard.'}[soon.dataset.soon];toast(m||'Not part of this mockup.');return}
 const g=t.closest('[data-go]');if(g){e.preventDefault();go(+g.dataset.go);return}
 const sp=t.closest('[data-space]');if(sp){const id=sp.dataset.space;if(S.space!==id){S.space=id;S.layout=null;const s=SPC();if(s.lay.length===1)S.layout=s.lay[0].id}S.errs={};renderMain();const el=document.querySelector(`[data-space="${id}"]`);el&&el.focus();return}
 const ly=t.closest('[data-layout]');if(ly){S.layout=+ly.dataset.layout;S.errs={};renderMain();const el=document.querySelector(`[data-layout="${S.layout}"]`);el&&el.focus();return}
 if(t.closest('#f-date')){S.pop=S.pop==='cal'?null:'cal';if(!S.calM){const b=S.date?parse(S.date):new Date(TODAY.getFullYear(),TODAY.getMonth()+1,1);S.calM=new Date(b.getFullYear(),b.getMonth(),1)}renderMain();const p=document.querySelector('#calp .pick,#calp button:not(:disabled)[data-day]');p&&p.focus();return}
 if(t.closest('#f-time')){S.pop=S.pop==='time'?null:'time';renderMain();const p=document.querySelector('#tlp .on')||document.querySelector('#tlp [data-time="19:00"]');if(p){p.scrollIntoView({block:'center'});p.focus({preventScroll:true})}return}
 const cm=t.closest('[data-cal]');if(cm){S.calM=new Date(S.calM.getFullYear(),S.calM.getMonth()+(+cm.dataset.cal),1);renderMain();const b=document.querySelector(`[data-cal="${cm.dataset.cal}"]`);b&&!b.disabled?b.focus():document.querySelector('#calp [data-cal]:not(:disabled)')?.focus();return}
 const dy=t.closest('[data-day]');if(dy){S.date=dy.dataset.day;S.pop=null;delete S.errs.date;S.mock=sameDay().length?'same':'s3';renderMain();$('f-date').focus();return}
 const tm=t.closest('[data-time]');if(tm){S.time=tm.dataset.time;S.pop=null;delete S.errs.time;renderMain();$('f-time').focus();return}
 const sw=t.closest('[data-sw]');if(sw){S.cover.sw=sw.dataset.sw;renderMain();document.querySelector(`[data-sw="${sw.dataset.sw}"]`).focus();return}
 if(S.pop&&!t.closest('.pop')){S.pop=null;renderMain()}
 const a=t.closest('[data-a]');if(!a)return;
 const act=a.dataset.a;
 if(act==='next')next();
 else if(act==='back')go(S.step-1);
 else if(act==='cancel')toast('Leaves the wizard and returns to My Events. Nothing is saved.');
 else if(act==='create')create();
 else if(act==='upload')$('file').click();
 else if(act==='spacephoto'){S.cover={kind:'photo',sw:S.cover.sw,img:null};renderMain()}
 else if(act==='rmcover'){S.cover={kind:'gen',sw:S.cover.sw,img:null};renderMain()}
});
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){toast('That photo is larger than 5 MB. Choose a smaller one.');return}S.cover={kind:'img',sw:S.cover.sw,img:URL.createObjectURL(f)};e.target.value='';renderMain();toast('Cover photo added.')});
app.addEventListener('input',e=>{
 if(e.target.id==='f-name'){S.name=e.target.value;$('cc').textContent=`${S.name.length}/60`;if(S.errs.name&&S.name.trim()){delete S.errs.name;const f=e.target.closest('.f');f.classList.remove('err');e.target.removeAttribute('aria-invalid');$('h-name').textContent='Shown to the client, on the event card and on the public RSVP page.'}
  const pv=document.querySelector('.cpv');if(pv&&!S.cover.img&&S.cover.kind!=='photo')pv.textContent=initials(S.name||'New Event')||'EV'}
 if(e.target.id==='f-email'){S.email=e.target.value;const h=document.querySelector('.cfoot .hint');if(h)h.textContent=S.email.trim()?'An invitation will be emailed to the client':'No client invitation yet'}
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.inp')){e.preventDefault();S.step===4?create():next()}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
 if(S.pop){const w=S.pop==='cal'?'f-date':'f-time';S.pop=null;renderMain();$(w).focus();return}
 if(S.wsOpen){S.wsOpen=false;renderSide();$('wsb').focus();return}
 if(app.classList.contains('drawer'))setDrawer(false)});
const setDrawer=o=>{app.classList.toggle('drawer',o);if(o)$('close').focus();else $('burger').focus()};
$('burger').addEventListener('click',()=>setDrawer(true));$('close').addEventListener('click',()=>setDrawer(false));$('scrim').addEventListener('click',()=>setDrawer(false));
$('mhide').addEventListener('click',()=>{$('mock').classList.add('hidden');app.classList.remove('withmock')});

/* ---------- start: #step2 #step3 #sameday #step4 #done #from-layout ---------- */
const h=location.hash.slice(1);
applyMock({step2:'s2',step3:'s3',sameday:'same',step4:'s4',done:'done','from-layout':'from'}[h]||'s1',false);
}
</script>
</body></html>
