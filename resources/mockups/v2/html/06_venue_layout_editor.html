<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venue Layout Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: the existing Event Planner product, no new styling
   IDEA: a faithful product screen for screenshotting (mockup #6, venue_layout_editor)
   PICTURE: today's Event Layout page, editing a space's layout template: no guests, chairs vs max people
   COLOUR and TYPE: DESIGN_GUIDE.md tokens, Inter
   LAYOUT: one responsive page: sidebar at 1024px+, drawer below, view-only map and cards below 768px */
:root{color-scheme:light;--bg:#F6F7FB;--sf:#fff;--sfm:#F8F9FC;--bd:#E5E8F0;--bds:#CFD4E2;--tx:#0F1433;--mu:#5B6480;--sb:#626B85;--pr:#4F46E5;--prh:#4338CA;--prs:#EEF0FF;--prb:#C9CDFB;--nv1:#0F1535;--nv2:#151C47;--nvr:#1B2350;--nvb:#262E5C;--nvt:#F1F3FB;--nvm:#B4BBD6;--sh:0 1px 2px rgb(15 20 51/6%);--shm:0 8px 24px rgb(15 20 51/12%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
ul{list-style:none}a{text-decoration:none;color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.i{flex:none;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--pr);color:#fff}.btn.pri:hover{background:var(--prh)}
.btn.sec{background:#fff;color:var(--pr);border:1px solid var(--prb)}.btn.sec:hover{border-color:var(--pr)}
.btn.soft{background:var(--prs);color:var(--pr)}
.btn.ghost{color:var(--mu)}.btn.ghost:hover{background:var(--sfm)}
.btn.dangerbtn{background:#C81E1E;color:#fff}.btn.dangerbtn:hover{background:#A51616}
.btn.sm{height:36px;padding:0 14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.success{color:#15803D;background:#E6F7EC;border-color:#BDE5CB}
.warning{color:#B45309;background:#FFF4E3;border-color:#F8D8A4}
.info{color:#4338CA;background:#EEF0FF;border-color:#C9CDFB}
.neutral{color:#475069;background:#ECEFF5;border-color:#D9DEEA}
/* shell (same as Space details) */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30;background:linear-gradient(180deg,var(--nv1),var(--nv2));color:var(--nvt);display:flex;flex-direction:column;padding:16px}
.app.collapsed .side{display:none}
.dh{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;padding:4px 8px 0}
.logo .mk{width:32px;height:32px;border-radius:8px;background:var(--pr);display:grid;place-items:center;color:#fff}
.xb{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--nvb);place-items:center;color:var(--nvt)}
.ws{position:relative;margin-top:20px}
.wsbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--nvr);border:1px solid var(--nvb);text-align:start;color:var(--nvt)}
.wsbtn.open{border-color:var(--nvm)}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.tile.v{background:linear-gradient(135deg,#6366F1,#4F46E5)}
.tile.p{background:var(--prs);color:var(--pr)}
.wsbtn .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}
.wsbtn .sub{font-size:12px;color:var(--nvm)}
.wsbtn .grow{flex:1}
.wsbtn .i:last-child{color:var(--nvm)}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--nvm)}
.nav a.on{background:var(--nvr);color:var(--nvt);font-weight:600}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.lang{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--nvb);background:var(--nvr);font-size:14px}
.lang span{flex:1}
.out{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;font-size:14px;color:var(--nvm)}
.menu{position:absolute;left:0;top:calc(100% + 8px);width:100%;min-width:216px;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:5}
.menu h4{font-size:12px;font-weight:500;color:var(--mu);padding:8px 12px 4px}
.mi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;width:100%;text-align:start}
.mi.sel{background:var(--prs)}
.mi .tx{flex:1}.mi .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}.mi .sub{font-size:12px;color:var(--mu)}
.mi .ck{color:var(--pr)}
.opt{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 12px;border-radius:10px;font-size:14px;text-align:start}
.opt span{flex:1}.opt .i{color:var(--mu)}
.opt:hover,.mi:hover{background:var(--sfm)}.mi.sel:hover{background:var(--prs)}
.opt.sel1{background:var(--prs)}.opt.sel1 .i{color:var(--pr)}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 32px;position:sticky;top:0;z-index:10}
.ibtn{width:44px;height:44px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--tx)}
.top .mk{display:none;width:40px;height:40px;border-radius:10px;background:var(--pr);place-items:center;color:#fff}
.top .sp{flex:1}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--mu)}
.bell em{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:#C81E1E;color:#fff;font-size:11px;font-weight:600;font-style:normal;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.av{width:40px;height:40px;border-radius:50%;background:var(--prs);color:var(--pr);font-size:14px;font-weight:600;display:grid;place-items:center;flex:none}
.who{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}.who .i{color:var(--mu)}
/* page */
.content{padding:24px 32px 40px;width:100%;max-width:1344px}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:16px}
.crumb a{display:inline-flex;align-items:center;gap:6px;color:var(--pr);font-weight:600}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.ph .grow{flex:1;min-width:0}
.ttl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ph h1{font-size:32px;line-height:1.2;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph h1 .spn{color:var(--mu);font-weight:600}
.ph h1 .i{color:var(--sb)}
.ph p.d{color:var(--mu);margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:8px;font-size:14px;color:var(--mu)}
.meta span{display:flex;align-items:center;gap:8px}.meta .i{color:var(--sb)}
.hbtns{display:flex;gap:12px;flex:none}
.seg{display:inline-flex;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px}
.seg button{height:36px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mu);display:flex;align-items:center;gap:8px;justify-content:center}
.seg button.on{background:var(--pr);color:#fff;font-weight:600}
.tabs{margin-top:24px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px;display:flex;align-items:center;gap:16px}
.kpi .grow{flex:1;min-width:0}
.kpi .l{font-size:14px;color:var(--mu);display:flex;align-items:center;gap:6px}
.kpi b{display:block;font-size:24px;font-weight:700;line-height:1.3;margin-top:4px}
.kpi b.am{color:#B45309}
.kpi small{font-size:12px;color:var(--sb)}
.kic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--prs);color:var(--pr)}
.kic.g{background:#E6F7EC;color:#15803D}.kic.a{background:#FFF4E3;color:#B45309}
.tip{position:relative;display:inline-grid;color:var(--sb);cursor:help}
.tipb{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:240px;background:var(--tx);color:#fff;font-size:12px;font-weight:400;line-height:1.45;padding:8px 12px;border-radius:10px;text-align:start;box-shadow:var(--shm);opacity:0;pointer-events:none;transition:opacity .15s;z-index:6}
.tip:hover .tipb,.tip:focus .tipb{opacity:1}
.notices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.notice{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border:1px solid;border-radius:14px}
.notice>.i{margin-top:2px}
.notice .grow{flex:1;min-width:0}
.notice b{display:block;font-weight:600;font-size:16px}
.notice p{font-size:14px;color:var(--mu);margin-top:2px}
.notice.warning b,.notice.warning>.i{color:#B45309}
.notice.success b,.notice.success>.i{color:#15803D}
.notice.info b,.notice.info>.i{color:#4338CA}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:16px;margin-top:16px;align-items:start}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px;min-width:0}
.chd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.chd h2{font-size:18px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chd .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative}
.cd{font-size:14px;color:var(--mu);margin-top:12px}
.strip{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 16px;border:1px solid #C9CDFB;background:#EEF0FF;border-radius:10px;font-size:14px;color:#4338CA;font-weight:600}
.strip span{flex:1}
.mapbox{margin-top:16px;border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:#fff}
.mtool{height:52px;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:0 12px;border-bottom:1px solid var(--bd)}
.mtool .lbl{margin-right:auto;font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px}
.zb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mu);position:relative}
.zb:hover{background:var(--sfm);color:var(--tx)}
.zb .tipb{width:auto;white-space:nowrap;bottom:auto;top:calc(100% + 6px)}
.zb:hover .tipb,.zb:focus-visible .tipb{opacity:1}
.mview{height:600px;background:var(--sfm);position:relative}
.mview svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;cursor:grab}
.mview svg.panning{cursor:grabbing}
.mapbox.edit .mview{background:#F1F2FA}
.mapbox.edit [data-t],.mapbox.edit [data-o]{cursor:move}
[data-t],[data-o]{cursor:pointer}
.mapbox.fs{position:fixed;inset:16px;z-index:65;margin:0;box-shadow:var(--shm);display:flex;flex-direction:column}
.mapbox.fs .mview{flex:1;height:auto}
.fsbg{display:none;position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:64}
.fsbg.on{display:block}
.pnl h2{font-size:18px;font-weight:600;line-height:1.3}
.pnl p.e{font-size:14px;color:var(--mu);margin-top:12px}
.pfig{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;background:var(--sfm);border:1px solid var(--bd);border-radius:10px}
.pfig div{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.pfig div+div{border-left:1px solid var(--bd)}
.pfig span{font-size:12px;color:var(--sb)}
.pfig b{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px}
.pfig b .i{color:var(--pr)}
.pnote{display:flex;gap:8px;font-size:12px;color:var(--mu);margin-top:16px;line-height:1.5}
.pnote .i{color:var(--sb);margin-top:1px}
.pacts{display:flex;gap:8px;margin-top:16px}
.pacts .btn{flex:1}
.ib{width:44px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;border:1px solid var(--bd);color:var(--mu);background:#fff;position:relative}
.ib:hover{border-color:var(--bds);color:var(--tx)}
.ib.dan{color:#C81E1E;background:#FDECEC;border-color:#F6C4C4}
.ib.sm{width:36px;height:36px}
.ib .tipb{width:auto;white-space:nowrap}
.ib:hover .tipb,.ib:focus-visible .tipb{opacity:1}
.unsaved{font-size:12px}
/* tables tab */
.tools{display:flex;gap:12px;margin-top:16px}
.field{height:44px;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;color:var(--sb)}
.srch{flex:1}
.srch input{border:0;outline:0;font:inherit;font-size:14px;color:var(--tx);flex:1;min-width:0;background:none;height:100%}
.srch:focus-within{border-color:var(--pr)}
.dd{position:relative}
.sel{height:44px;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;font-size:14px;text-align:start;white-space:nowrap}
.sel:hover{border-color:var(--bds)}
.sel[aria-expanded=true]{border-color:var(--pr)}
.sel .i{color:var(--mu)}
.lst{position:absolute;left:0;right:0;min-width:180px;top:calc(100% + 4px);background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:8}
.lst.rt{left:auto;right:0}
.tcard{margin-top:16px;border:1px solid var(--bd);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--sfm);color:var(--mu);font-weight:500;text-align:center;padding:12px 16px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);vertical-align:middle;text-align:center}
tr:last-child td{border-bottom:0}
td.s,th.s{text-align:start}
td.a{text-align:end;white-space:nowrap}td.a>div{display:inline-flex;gap:8px}
th.a{width:150px}
tr.on td{background:#F7F7FF}
.shp{display:inline-flex;align-items:center;gap:8px}.shp .i{color:var(--pr)}
.pg{display:flex;align-items:center;gap:16px;margin-top:16px;font-size:14px;color:var(--mu)}
.pg .sp{flex:1}
.pgn{display:flex;gap:8px}
.pgn button{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);display:grid;place-items:center;font-size:14px;color:var(--tx);background:#fff}
.pgn button.on{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:600}
.pgn button:disabled{opacity:.4;cursor:default}
.tcards{display:none}
.nores{padding:40px 20px;text-align:center;color:var(--mu);font-size:14px}
/* dialogs */
.ov{position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:70;display:none;align-items:center;justify-content:center;padding:24px}
.ov.open{display:flex}
.dlg{width:512px;max-width:100%;max-height:calc(100vh - 48px);background:#fff;border-radius:14px;box-shadow:var(--shm);display:flex;flex-direction:column}
.dlg:focus{outline:none}
.dhd{display:flex;align-items:flex-start;gap:16px;padding:20px 24px 16px;border-bottom:1px solid var(--bd)}
.dhd .grow{flex:1;min-width:0}
.dhd h2{font-size:18px;font-weight:600;line-height:1.3}
.dhd p{font-size:14px;color:var(--mu);margin-top:4px}
.dx{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mu);margin:-4px -8px 0 0;flex:none}
.dx:hover{background:var(--sfm)}
.dbody{padding:20px 24px 24px;display:flex;flex-direction:column;gap:20px;flex:1;overflow:visible}
.dfoot{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid var(--bd);background:#fff;border-radius:0 0 14px 14px}
.lb{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-bottom:8px;line-height:1.4}
.lb .req{color:#C81E1E;margin-left:-4px}
.inp{display:block;height:44px;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff;padding:0 16px;font:inherit;font-size:14px;color:var(--tx)}
.inp:hover{border-color:var(--bds)}
.inp:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.help{font-size:12px;color:var(--mu);margin-top:8px;line-height:1.5}
.f.err .inp{border-color:#C81E1E}.f.err .help{color:#C81E1E}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dbody ul.pts{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--mu)}
.dbody ul.pts li{display:flex;gap:8px}.dbody ul.pts .i{color:var(--sb);margin-top:2px}
.dbody ul.pts b{color:var(--tx);font-weight:600}
.cprev{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--sfm);border:1px solid var(--bd);border-radius:10px;font-size:14px;color:var(--mu)}
.cprev b{color:var(--tx);font-weight:600}
.cprev.warning{background:#FFF4E3;border-color:#F8D8A4}.cprev.warning .i{color:#B45309}
/* mockup state switcher (not part of the product) */
.mock{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:60;display:flex;align-items:center;gap:8px;background:#fff;border:1px dashed var(--bds);border-radius:14px;box-shadow:var(--shm);padding:6px 6px 6px 14px;font-size:12px;color:var(--mu)}
.mock .seg{border:0;padding:0}.mock .seg button{height:32px;padding:0 12px;font-size:12px;gap:0;white-space:nowrap}
.mock .hx{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--mu)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--tx);color:#fff;font-size:14px;padding:12px 16px;border-radius:10px;box-shadow:var(--shm);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:80;max-width:min(440px,calc(100vw - 32px))}
.toast.show{opacity:1;transform:none}
.app.withmock .toast{bottom:80px}
.app.withmock .content{padding-bottom:96px}
.hidden{display:none!important}
.ph-only{display:none}
@media (max-width:1279px) and (min-width:1024px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1180px){.wrap{grid-template-columns:minmax(0,1fr)}}
/* compact: drawer */
@media (max-width:1023px){
 .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(320px,85vw);transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shm)}
 .app.collapsed .side{display:flex}
 .app.drawer .side{transform:none}
 .scrim{display:block;position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
 .app.drawer .scrim{opacity:1;pointer-events:auto}
 .xb,.top .mk{display:grid}
 .top{padding:0 16px;gap:12px}
}
/* phone: view-only map, cards instead of the table */
@media (max-width:767px){
 .who .nm,.who .i{display:none}
 .content{padding:20px 16px 40px}
 .app.withmock .content{padding-bottom:96px}
 .crumb{margin-bottom:12px}
 .ph{flex-direction:column;gap:16px}
 .ph h1{font-size:28px;gap:4px 8px}
 .meta{flex-direction:column;gap:6px}
 .hbtns{width:100%}.hbtns .btn{flex:1 1 0;padding:0 12px}
 .tabs{margin-top:20px}
 .seg{display:flex}.seg button{flex:1 1 0;padding:0 6px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .kpi{padding:16px;gap:8px;align-items:flex-start}
 .kic{display:none}
 .kpi b{font-size:22px}
 .notices{grid-template-columns:minmax(0,1fr);gap:12px}
 .notice{padding:16px}
 .card{padding:16px}
 .mview{height:auto;aspect-ratio:1040/840}
 .mapbox.fs .mview{aspect-ratio:auto}

round:'<circle cx="12" cy="12" r="9"/>',square:'<rect x="4" y="4" width="16" height="16" rx="2"/>',rect:'<rect x="2" y="7" width="20" height="10" rx="2"/>',

};
const I=(n,s=20)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const pl=(n,w,p)=>`${n} ${n===1?w:(p||w+'s')}`;
const isPhone=()=>matchMedia('(max-width:767px)').matches;

/* ---------- data: Main Hall and its layouts (same as Space details) ---------- */
const SP={n:'Main Hall',max:400,tab:45};
const DATA={'grand-garden-hall':{n:'Grand Garden Hall',r:'Owner'},'seaside-terrace':{n:'Seaside Terrace',r:'Manager'}};
const OTHER_LAYOUTS=['Wedding Rounds','Gala Long Tables','Bar Mitzvah Mixed','Rounds 2025'];
const SHAPES={round:'Round',square:'Square',rect:'Rectangle'};
const OBJ={stage:{n:'Stage',t:'pr'},bar:{n:'Bar',t:'pr'},dj:{n:'DJ Booth',t:'pr'},dance:{n:'Dance Floor',t:'ne'},food:{n:'Food Station',t:'gr'},entrance:{n:'Entrance',t:'am'}};
const OBJC={pr:['#EEF0FF','#C9CDFB','#4338CA'],gr:['#E6F7EC','#BDE5CB','#15803D'],am:['#FFF4E3','#F8D8A4','#B45309'],ne:['#ECEFF5','#D9DEEA','#475069']};
const ROOM={w:1000,h:800};
function build(k){
 const T=[];let n=1;
 if(k==='rounds'){for(let r=0;r<5;r++)for(let c=0;c<8;c++)T.push({id:n,num:n++,shape:'round',chairs:10,x:150+c*100,y:170+r*120,placed:true})}
 else if(k==='long'){for(let r=0;r<6;r++)for(let c=0;c<4;c++)T.push({id:n,num:n++,shape:'rect',chairs:16,x:230+c*180,y:150+r*110,placed:true})}
 else{for(let r=0;r<6;r++)for(let c=0;c<8;c++){const sq=r%2===1;T.push({id:n,num:n++,shape:sq?'square':'round',chairs:sq?(r===5&&c<6?6:8):10,x:150+c*100,y:150+r*110,placed:true})}}
 const O=[{id:1,type:'stage',x:400,y:24,w:200,h:64},{id:2,type:'bar',x:24,y:280,w:56,h:240},{id:3,type:'food',x:920,y:280,w:56,h:240},{id:4,type:'entrance',x:470,y:778,w:60,h:18}];
 const meta={rounds:{n:'Wedding Rounds',ed:'Nov 20, 2026',by:'Avi Golan',used:1},long:{n:'Gala Long Tables',ed:'Oct 3, 2026',by:'Noa Peretz',used:1},mixed:{n:'Bar Mitzvah Mixed',ed:'yesterday',by:'Avi Golan',used:0}}[k];
 return {...meta,k,tables:T,objs:O};
}
let L=build('mixed');
const S={ws:'grand-garden-hall',wsOpen:false,tab:'arr',edit:false,dirty:false,sel:null,view:null,fs:false,objOpen:false,q:'',shape:'all',shapeOpen:false,page:1};
let snap=null,nextObj=10;
let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3600)};
const chairs=()=>L.tables.reduce((a,t)=>a+t.chairs,0);
const unplaced=()=>L.tables.filter(t=>!t.placed);
const fitView=()=>({x:-20,y:-20,w:ROOM.w+40,h:ROOM.h+40});
S.view=fitView();

$('lg').innerHTML=I('logo',20);$('lg2').innerHTML=I('logo',20);$('close').innerHTML=I('x');$('burger').innerHTML=I('menu');
$('bell').innerHTML=I('bell')+'<em>3</em>';$('who').innerHTML=`<span class="av">AG</span><span class="nm">Avi Golan</span>${I('down',18)}`;
$('foot').innerHTML=`<div class="lang">${I('globe',18)}<span>English</span>${I('down',18)}</div><div class="out">${I('logout')}Log out</div>`;
$('mhide').innerHTML=I('x',16);

function renderSide(){const w=DATA[S.ws];
 $('ws').innerHTML=`<button class="wsbtn${S.wsOpen?' open':''}" id="wsb" aria-haspopup="listbox" aria-expanded="${S.wsOpen}"><span class="tile v">${I('bld',20)}</span><span class="grow"><span class="nm">${esc(w.n)}</span><span class="sub">Venue · ${w.r}</span></span>${I('updown',18)}</button>`+
 (S.wsOpen?`<div class="menu" role="listbox" aria-label="Switch workspace"><h4>Switch workspace</h4>
 <button class="mi" role="option" aria-selected="false" data-ws="personal"><span class="tile p">${I('user',20)}</span><span class="tx"><span class="nm">Personal</span><span class="sub">Your own events</span></span></button>
 ${Object.entries(DATA).map(([k,v])=>`<button class="mi${k===S.ws?' sel':''}" role="option" aria-selected="${k===S.ws}" data-ws="${k}"><span class="tile v">${I('bld',20)}</span><span class="tx"><span class="nm">${esc(v.n)}</span><span class="sub">${v.r}</span></span>${k===S.ws?`<span class="ck">${I('check',18)}</span>`:''}</button>`).join('')}</div>`:'');
 $('nav').innerHTML=`<a href="#" data-soon="events">${I('cal')}My Events</a><a class="on" href="#" data-soon="spaces" aria-current="page">${I('map')}My Spaces</a><a href="#" data-soon="team">${I('users')}Team</a><a href="#" data-soon="settings">${I('gear')}Settings</a>`}

/* ---------- floor plan drawing ---------- */
const CHS='#A5B4FC';
function tableSvg(t,sel){
 const st=sel?'#4F46E5':'#A5B4FC',fill=sel?'#EEF0FF':'#fff',sw=sel?2.5:1.5;let g='',ch='';
 const chair=(x,y,rot)=>`<rect x="${(x-6).toFixed(1)}" y="${(y-6).toFixed(1)}" width="12" height="12" rx="3" fill="#fff" stroke="${sel?'#4F46E5':CHS}" stroke-width="1.5"${rot!=null?` transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"`:''}/>`;
 if(t.shape==='round'){const r=Math.max(18,t.chairs*2.6),R=r+11;for(let i=0;i<t.chairs;i++){const a=i/t.chairs*2*Math.PI-Math.PI/2;ch+=chair(Math.cos(a)*R,Math.sin(a)*R,a*180/Math.PI)}g=`<circle r="${r}" fill="${fill}" stroke="${st}" stroke-width="${sw}"/>`}
 else if(t.shape==='square'){const s=44,c=[0,0,0,0];for(let i=0;i<t.chairs;i++)c[i%4]++;
  for(let j=0;j<c[0];j++)ch+=chair(-s/2+s*(j+.5)/c[0],-s/2-10);for(let j=0;j<c[1];j++)ch+=chair(-s/2+s*(j+.5)/c[1],s/2+10);
  for(let j=0;j<c[2];j++)ch+=chair(-s/2-10,-s/2+s*(j+.5)/c[2]);for(let j=0;j<c[3];j++)ch+=chair(s/2+10,-s/2+s*(j+.5)/c[3]);
  g=`<rect x="-22" y="-22" width="44" height="44" rx="4" fill="${fill}" stroke="${st}" stroke-width="${sw}"/>`}
 else{const top=Math.ceil(t.chairs/2),bot=t.chairs-top,w=Math.max(40,top*20);for(let j=0;j<top;j++)ch+=chair(-w/2+w*(j+.5)/top,-24);for(let j=0;j<bot;j++)ch+=chair(-w/2+w*(j+.5)/bot,24);
  g=`<rect x="${-w/2}" y="-14" width="${w}" height="28" rx="4" fill="${fill}" stroke="${st}" stroke-width="${sw}"/>`}
 return `<g data-t="${t.id}" transform="translate(${t.x} ${t.y})" role="button" tabindex="0" aria-label="Table ${t.num}, ${SHAPES[t.shape]}, ${t.chairs} chairs"><circle r="0.1" fill="none"/>${ch}${g}<text y="5" text-anchor="middle" font-size="14" font-weight="700" font-family="Inter,sans-serif" fill="#0F1433" pointer-events="none">${t.num}</text></g>`}
function objSvg(o,sel){const [bg,bd,tx]=OBJC[OBJ[o.type].t];const vert=o.h>o.w*1.6;
 return `<g data-o="${o.id}" transform="translate(${o.x} ${o.y})" role="button" tabindex="0" aria-label="${OBJ[o.type].n}"><rect width="${o.w}" height="${o.h}" rx="6" fill="${bg}" stroke="${sel?'#4F46E5':bd}" stroke-width="${sel?2.5:1.5}"${S.edit?' stroke-dasharray="'+(sel?'0':'5 4')+'"':''}/><text x="${o.w/2}" y="${o.h/2+4}" text-anchor="middle" font-size="${o.h<24?10:13}" font-weight="600" font-family="Inter,sans-serif" fill="${tx}" pointer-events="none"${vert?` transform="rotate(-90 ${o.w/2} ${o.h/2})"`:''}>${OBJ[o.type].n}</text></g>`}
function planSvg(){const v=S.view;
 const isSel=(k,id)=>S.sel&&S.sel.k===k&&S.sel.id===id;
 return `<svg id="plan" viewBox="${v.x} ${v.y} ${v.w} ${v.h}" role="img" aria-label="Floor plan of ${esc(SP.n)}: ${esc(L.n)}"><defs><pattern id="grd" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#E5E8F0" stroke-width="1"/></pattern></defs>
 <rect x="0" y="0" width="${ROOM.w}" height="${ROOM.h}" rx="4" fill="#fff"/><rect x="0" y="0" width="${ROOM.w}" height="${ROOM.h}" rx="4" fill="url(#grd)" stroke="#CFD4E2" stroke-width="3"/>
 ${L.objs.map(o=>objSvg(o,isSel('o',o.id))).join('')}${L.tables.filter(t=>t.placed).map(t=>tableSvg(t,isSel('t',t.id))).join('')}</svg>`}

/* ---------- page ---------- */
function kpis(){const c=chairs(),d=c-SP.max,overT=L.tables.length>SP.tab;
 const tip=`<span class="tip" tabindex="0" aria-label="From the space">${I('info',14)}<span class="tipb" role="tooltip">Set on ${esc(SP.n)}. Events created from this layout start with this number.</span></span>`;
 return `<div class="kpis">
 <div class="kpi"><div class="grow"><span class="l">Total Tables</span><b>${L.tables.length}</b><small>${overT?`tables · ${SP.tab} noted`:'tables'}</small></div><span class="kic">${I('table',22)}</span></div>
 <div class="kpi"><div class="grow"><span class="l">Seating Capacity</span><b>${c}</b><small>chairs</small></div><span class="kic">${I('users',22)}</span></div>
 <div class="kpi"><div class="grow"><span class="l">Max People ${tip}</span><b>${SP.max}</b><small>people in ${esc(SP.n)}</small></div><span class="kic">${I('bld',22)}</span></div>
 <div class="kpi"><div class="grow"><span class="l">Chairs vs Max People</span><b class="${d?'am':''}">${d>0?'+'+d:d}</b><small>${d>0?'more chairs than people':d<0?'fewer chairs than people':'chairs match max people'}</small></div><span class="kic ${d?'a':'g'}">${I(d?'alert':'checkc',22)}</span></div></div>`}
function notices(){const c=chairs(),d=c-SP.max,overT=L.tables.length>SP.tab;let h='';
 if(d>0)h+=`<div class="notice warning" role="status">${I('alert',20)}<div class="grow"><b>${d} more chairs than max people</b><p>${c} chairs for ${SP.max} people in ${esc(SP.n)}. Remove chairs or tables if the room can't hold them. Nothing is blocked.</p></div></div>`;
 else if(d<0)h+=`<div class="notice warning" role="status">${I('alert',20)}<div class="grow"><b>${-d} fewer chairs than max people</b><p>${c} chairs for ${SP.max} people in ${esc(SP.n)}. A full event would need ${-d} more seats. Nothing is blocked.</p></div></div>`;
 else h+=`<div class="notice success" role="status">${I('checkc',20)}<div class="grow"><b>Chairs match max people</b><p>${c} chairs for ${SP.max} people in ${esc(SP.n)}.</p></div></div>`;

function zoom(f,cx,cy){const v=S.view;if(cx==null){cx=v.x+v.w/2;cy=v.y+v.h/2}const nw=v.w*f;const k=Math.min(Math.max(nw,240),fitView().w*1.6)/v.w;setView({x:cx-(cx-v.x)*k,y:cy-(cy-v.y)*k,w:v.w*k,h:v.h*k})}
function bindPlan(){const svg=$('plan');if(!svg)return;
 svg.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture(e.pointerId);
  if(pts.size===2){const [a,b]=[...pts.values()];ptr={pinch:true,d:Math.hypot(a.x-b.x,a.y-b.y)};return}
  const g=e.target.closest('[data-t],[data-o]');const p=svgPt(svg,e.clientX,e.clientY);
  if(g){const k=g.dataset.t?'t':'o',id=+(g.dataset.t||g.dataset.o);const it=(k==='t'?L.tables:L.objs).find(x=>x.id===id);
   ptr={k,id,g,sx:e.clientX,sy:e.clientY,dx:p.x-it.x,dy:p.y-it.y,moved:false,drag:S.edit}}
  else ptr={pan:true,sx:e.clientX,sy:e.clientY,v:{...S.view},moved:false}});
 svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!ptr)return;
  if(ptr.pinch&&pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);const c=svgPt(svg,(a.x+b.x)/2,(a.y+b.y)/2);zoom(ptr.d/d,c.x,c.y);ptr.d=d;return}
  const mv=Math.hypot(e.clientX-ptr.sx,e.clientY-ptr.sy)>4;if(mv)ptr.moved=true;if(!ptr.moved)return;
  if(ptr.pan){svg.classList.add('panning');const r=svg.getBoundingClientRect(),s=Math.max(ptr.v.w/r.width,ptr.v.h/r.height);setView({...ptr.v,x:ptr.v.x-(e.clientX-ptr.sx)*s,y:ptr.v.y-(e.clientY-ptr.sy)*s});return}
  if(ptr.drag){const p=svgPt(svg,e.clientX,e.clientY),it=(ptr.k==='t'?L.tables:L.objs).find(x=>x.id===ptr.id);
   let nx=Math.round((p.x-ptr.dx)/10)*10,ny=Math.round((p.y-ptr.dy)/10)*10;
   if(ptr.k==='t'){nx=Math.min(Math.max(nx,40),ROOM.w-40);ny=Math.min(Math.max(ny,40),ROOM.h-40)}else{nx=Math.min(Math.max(nx,0),ROOM.w-it.w);ny=Math.min(Math.max(ny,0),ROOM.h-it.h)}
   if(nx!==it.x||ny!==it.y){it.x=nx;it.y=ny;ptr.g.setAttribute('transform',`translate(${nx} ${ny})`);if(!S.dirty){S.dirty=true;ptr.dirtied=true}}}});

  if(p.pinch)return;

  if(p.pan&&!p.moved&&S.sel){S.sel=null;render()}};

 svg.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey&&!S.fs)return;e.preventDefault();const p=svgPt(svg,e.clientX,e.clientY);zoom(e.deltaY>0?1.12:1/1.12,p.x,p.y)},{passive:false});
 svg.addEventListener('keydown',e=>{const g=e.target.closest('[data-t],[data-o]');if(!g)return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();S.sel={k:g.dataset.t?'t':'o',id:+(g.dataset.t||g.dataset.o)};render();const n=document.querySelector(`[data-${S.sel.k}="${S.sel.id}"]`);if(n)n.focus();return}

   if(e.key==='ArrowLeft')it.x-=st;if(e.key==='ArrowRight')it.x+=st;if(e.key==='ArrowUp')it.y-=st;if(e.key==='ArrowDown')it.y+=st;S.dirty=true;S.sel={k,id};render();const n=document.querySelector(`[data-${k}="${id}"]`);if(n)n.focus()}});
}
function freeSpot(){for(let y=150;y<=740;y+=50)for(let x=120;x<=880;x+=50){if(L.tables.every(t=>!t.placed||Math.hypot(t.x-x,t.y-y)>=100)&&L.objs.every(o=>x<o.x-50||x>o.x+o.w+50||y<o.y-50||y>o.y+o.h+50))return {x,y}}return {x:500,y:420}}

 if(D.shapeOpen&&b.dataset.d!=='shape'){D.shapeOpen=false;drawDlg()}
 const a=b.dataset.d;if(a==='close')closeDlg();else if(a==='ok')submitDlg();else if(a==='shape'){D.shapeOpen=!D.shapeOpen;drawDlg();$('f-sh').focus()}});
$('ov').addEventListener('input',ev=>{const id=ev.target.id;if(id==='f-n')D.f.n=ev.target.value;if(id==='f-num')D.f.num=ev.target.value;
 if(id==='f-ch'){D.f.chairs=ev.target.value;const c=$('cprev');if(c){const tmp=document.createElement('div');tmp.innerHTML=dlgHtml();c.replaceWith(tmp.querySelector('#cprev'))}}});
$('ov').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('inp')){e.preventDefault();submitDlg()}});

/* ---------- actions ---------- */
function enterEdit(){snap=JSON.parse(JSON.stringify({tables:L.tables,objs:L.objs}));S.edit=true;S.dirty=false}
document.addEventListener('click',ev=>{const t=ev.target.closest('button,a,[data-row]');
 if(!ev.target.closest('#ws')&&S.wsOpen){S.wsOpen=false;renderSide()}
 if(D.open||!t)return;
 if(t.closest('#ov'))return;
 if(t.tagName==='A')ev.preventDefault();
 const d=t.dataset;
 if(S.objOpen&&d.a!=='objmenu'&&!d.obj){S.objOpen=false;render();if(!d.a&&!d.z)return}
 if(S.shapeOpen&&d.a!=='shapemenu'&&!d.shape){S.shapeOpen=false;render();if(!d.a)return}
 if(t.id==='wsb'){S.wsOpen=!S.wsOpen;renderSide();return}
 if(d.ws){S.wsOpen=false;renderSide();toast(d.ws==='personal'?"Personal opens today's My Events page (your own events).":d.ws!==S.ws?`Switches to ${DATA[d.ws].n} and opens its My Spaces page.`:'');return}
 if(t.id==='burger'){if(matchMedia('(max-width:1023px)').matches)setDrawer(true);else $('app').classList.toggle('collapsed');return}
 if(t.id==='close'){setDrawer(false);return}
 if(d.soon){setDrawer(false);toast({spaces:'Goes to My Spaces (screen #3).',events:'Opens the venue My Events page (screen #2).',team:'Opens the Team page (screen #7).',settings:'Opens Venue Settings (screen #8).'}[d.soon]);return}
 if(d.mock){L=build(d.mock);OTHER_LAYOUTS.splice(0,3,'Wedding Rounds','Gala Long Tables','Bar Mitzvah Mixed');Object.assign(S,{edit:false,dirty:false,sel:null,page:1,q:'',shape:'all',fs:false});S.view=fitView();snap=null;history.replaceState(null,'',d.mock==='mixed'?location.pathname:'#'+d.mock);render();return}
 if(t.id==='mhide'){$('app').classList.remove('withmock');$('mock').classList.add('hidden');return}
 if(d.tab){S.tab=d.tab;S.fs=false;render();return}
 if(d.z){if(d.z==='in')zoom(.8);else if(d.z==='out')zoom(1.25);else if(d.z==='fit')setView(fitView());else{S.fs=!S.fs;render()}return}
 if(d.pg){S.page=+d.pg;render();return}
 if(d.shape){S.shape=d.shape;S.shapeOpen=false;S.page=1;render();return}
 if(d.obj){const o=OBJ[d.obj],v=S.view,w=d.obj==='dance'?160:d.obj==='entrance'?60:d.obj==='stage'?200:d.obj==='dj'?70:56,h=d.obj==='dance'?120:d.obj==='entrance'?18:d.obj==='stage'?64:d.obj==='dj'?50:160;
  const id=nextObj++;L.objs.push({id,type:d.obj,w,h,x:Math.round(Math.min(Math.max(v.x+v.w/2-w/2,0),ROOM.w-w)/10)*10,y:Math.round(Math.min(Math.max(v.y+v.h/2-h/2,0),ROOM.h-h)/10)*10});S.objOpen=false;S.dirty=true;S.sel={k:'o',id};render();toast(`${o.n} was added in the middle of the view. Drag it into place.`);return}
 if(t.dataset.row&&!ev.target.closest('button')){S.sel={k:'t',id:+t.dataset.row};render();return}
 const a=d.a;if(!a)return;
 if(a==='back'){toast(S.dirty?'Asks to save or discard the unsaved changes, then goes back to Main Hall (screen #5).':'Goes back to Main Hall: the space details page (screen #5).');return}
 if(a==='rename'){openDlg('rename');return}
 if(a==='add'){openDlg('table');return}
 if(a==='export'){toast(`Downloads the table list of ${L.n} (number, shape, chairs).`);return}
 if(a==='edit'){enterEdit();render();return}
 if(a==='cancel'){if(snap){L.tables=snap.tables;L.objs=snap.objs}S.edit=false;S.dirty=false;S.sel=null;render();toast('Your changes to the plan were discarded.');return}
 if(a==='save'){S.edit=false;const was=S.dirty;S.dirty=false;snap=null;if(was)L.ed='just now';render();toast(was?'The layout was saved. Events already created from it keep their own copy.':'No changes to save.');return}
 if(a==='objmenu'){S.objOpen=!S.objOpen;render();return}
 if(a==='shapemenu'){S.shapeOpen=!S.shapeOpen;render();return}
 if(a==='place'){if(!S.edit)enterEdit();const ups=unplaced();ups.forEach(t=>{const p=freeSpot();t.x=p.x;t.y=p.y;t.placed=true});S.dirty=true;S.sel={k:'t',id:ups[ups.length-1].id};render();toast(`${pl(ups.length,'table')} placed on the plan. Drag ${ups.length===1?'it':'them'} into place, then save.`);return}
 if(a==='edittable'){openDlg('table',+d.id);return}
 if(a==='deltable'){openDlg('del',+d.id);return}
 if(a==='delobj'){const o=L.objs.find(x=>x.id===+d.id);L.objs=L.objs.filter(x=>x!==o);S.sel=null;S.dirty=true;render();toast(`${OBJ[o.type].n} was removed. Save the layout to keep this change.`);return}
});
$('page').addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.page=1;render()}});
function setDrawer(o){$('app').classList.toggle('drawer',o)}
$('scrim').addEventListener('click',()=>setDrawer(false));
$('fsbg').addEventListener('click',()=>{S.fs=false;render()});
document.addEventListener('keydown',e=>{
 if(D.open){if(e.key==='Escape'){if(D.shapeOpen){D.shapeOpen=false;drawDlg();$('f-sh').focus()}else closeDlg();e.preventDefault()}
  else if(e.key==='Tab'){const fs=[...$('dlg').querySelectorAll('button,input')];const a=fs[0],z=fs[fs.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}return}
 if(e.key!=='Escape')return;
 if(S.objOpen||S.shapeOpen){S.objOpen=S.shapeOpen=false;render()}else if(S.fs){S.fs=false;render()}else if(S.wsOpen){S.wsOpen=false;renderSide()}else setDrawer(false)});
matchMedia('(max-width:1023px)').addEventListener('change',()=>{setDrawer(false);$('app').classList.remove('collapsed')});
matchMedia('(max-width:767px)').addEventListener('change',()=>{S.objOpen=false;render()});
/* screenshot states: #long, #rounds, #edit, #tables, #rename, #add, #delete, #selected */
function fromHash(){const h=location.hash.slice(1);
 if(h==='long'||h==='rounds'){L=build(h)}
 if(h==='edit'&&!isPhone()){enterEdit();S.sel={k:'t',id:12}}
 if(h==='selected')S.sel={k:'t',id:12};
 if(h==='tables')S.tab='tbl';
 render();
 if(h==='rename')openDlg('rename');if(h==='add')openDlg('table');if(h==='delete')openDlg('del',12)}
renderSide();fromHash();
}
</script>
</body></html>
