<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venue Space Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: the existing Event Planner product, no new styling
   IDEA: a faithful product screen for screenshotting (mockup #5, venue_space_details)
   PICTURE: the screen itself: space header, KPIs, layout cards, upcoming events
   COLOUR and TYPE: DESIGN_GUIDE.md tokens, Inter
   LAYOUT: one responsive page: sidebar at 1024px+, drawer below, phone cards below 768px */
:root{color-scheme:light;--bg:#F6F7FB;--sf:#fff;--sfm:#F8F9FC;--bd:#E5E8F0;--bds:#CFD4E2;--tx:#0F1433;--mu:#5B6480;--sb:#626B85;--pr:#4F46E5;--prh:#4338CA;--prs:#EEF0FF;--prb:#C9CDFB;--nv1:#0F1535;--nv2:#151C47;--nvr:#1B2350;--nvb:#262E5C;--nvt:#F1F3FB;--nvm:#B4BBD6;--sh:0 1px 2px rgb(15 20 51/6%);--shm:0 8px 24px rgb(15 20 51/12%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
ul{list-style:none}a{text-decoration:none;color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.i{flex:none;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--pr);color:#fff}.btn.pri:hover{background:var(--prh)}
.btn.sec{background:#fff;color:var(--pr);border:1px solid var(--prb)}
.btn.soft{background:var(--prs);color:var(--pr)}
.btn.sm{height:36px;padding:0 14px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.success{color:#15803D;background:#E6F7EC;border-color:#BDE5CB}
.warning{color:#B45309;background:#FFF4E3;border-color:#F8D8A4}
.info{color:#4338CA;background:#EEF0FF;border-color:#C9CDFB}
.neutral{color:#475069;background:#ECEFF5;border-color:#D9DEEA}
/* shell (same as Venue My Events) */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30;background:linear-gradient(180deg,var(--nv1),var(--nv2));color:var(--nvt);display:flex;flex-direction:column;padding:16px}
.app.collapsed .side{display:none}
.dh{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;padding:4px 8px 0}
.logo .mk{width:32px;height:32px;border-radius:8px;background:var(--pr);display:grid;place-items:center;color:#fff}
.xb{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--nvb);place-items:center;color:var(--nvt)}
.ws{position:relative;margin-top:20px}
.wsbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--nvr);border:1px solid var(--nvb);text-align:start;color:var(--nvt)}
.wsbtn.open{border-color:var(--nvm)}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.tile.v{background:linear-gradient(135deg,#6366F1,#4F46E5)}
.tile.p{background:var(--prs);color:var(--pr)}
.wsbtn .nm{font-size:14px;font-weight:600;line-height:1.3}
.wsbtn .sub{font-size:12px;color:var(--nvm)}
.wsbtn .grow{flex:1}
.wsbtn .i:last-child{color:var(--nvm)}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--nvm)}
.nav a.on{background:var(--nvr);color:var(--nvt);font-weight:600}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.lang{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--nvb);background:var(--nvr);font-size:14px}
.lang span{flex:1}
.out{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;font-size:14px;color:var(--nvm)}
.menu{position:absolute;left:0;top:calc(100% + 8px);width:100%;min-width:216px;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:5}
.menu h4{font-size:12px;font-weight:500;color:var(--mu);padding:8px 12px 4px}
.mi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;width:100%;text-align:start}
.mi.sel{background:var(--prs)}
.mi .tx{flex:1}.mi .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}.mi .sub{font-size:12px;color:var(--mu)}
.mi .ck{color:var(--pr)}
.opt{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 12px;border-radius:10px;font-size:14px;text-align:start}
.opt span{flex:1}.opt .i{color:var(--mu)}.opt.dan,.opt.dan .i{color:#C81E1E}
.opt:hover,.mi:hover{background:var(--sfm)}.mi.sel:hover{background:var(--prs)}
.sep{height:1px;background:var(--bd);margin:4px 0}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 32px;position:sticky;top:0;z-index:10}
.ibtn{width:44px;height:44px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--tx)}
.top .mk{display:none;width:40px;height:40px;border-radius:10px;background:var(--pr);place-items:center;color:#fff}
.top .sp{flex:1}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--mu)}
.bell em{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:#C81E1E;color:#fff;font-size:11px;font-weight:600;font-style:normal;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.av{width:40px;height:40px;border-radius:50%;background:var(--prs);color:var(--pr);font-size:14px;font-weight:600;display:grid;place-items:center;flex:none}
.who{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}.who .i{color:var(--mu)}
/* page */
.content{padding:24px 32px 40px;width:100%;max-width:1344px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.ph h1{font-size:32px;line-height:1.2;font-weight:700}
.ph p{color:var(--mu);margin-top:4px}
.cta2{display:none}
.tools{display:flex;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.tools .sp{flex:1}
.seg{display:flex;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px}
.seg button{height:36px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mu);display:flex;align-items:center;gap:8px;justify-content:center}
.seg button.on{background:var(--pr);color:#fff;font-weight:600}
.cnt{min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:#ECEFF5;color:#475069;font-size:12px;font-weight:600;display:grid;place-items:center}
.on .cnt{background:#fff;color:var(--pr)}
.field{height:44px;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;color:var(--sb)}
.srch{width:300px}
.srch input{border:0;outline:0;font:inherit;font-size:14px;color:var(--tx);flex:1;min-width:0;background:none;height:100%}
.srch:focus-within{border-color:var(--pr)}
/* mockup state switcher (not part of the product) */
.mock{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:70;display:flex;align-items:center;gap:8px;background:#fff;border:1px dashed var(--bds);border-radius:14px;box-shadow:var(--shm);padding:6px 6px 6px 14px;font-size:12px;color:var(--mu)}
.mock .seg{border:0;padding:0}.mock .seg button{height:32px;padding:0 12px;font-size:12px}
.mock .hx{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--mu)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--tx);color:#fff;font-size:14px;padding:12px 16px;border-radius:10px;box-shadow:var(--shm);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:80;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:none}
.app.withmock .toast{bottom:80px}
.hidden{display:none!important}
/* compact: drawer */
@media (max-width:1023px){
 .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(320px,85vw);transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shm)}
 .app.collapsed .side{display:flex}
 .app.drawer .side{transform:none}
 .scrim{display:block;position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
 .app.drawer .scrim{opacity:1;pointer-events:auto}
 .xb,.top .mk{display:grid}
 .top{padding:0 16px;gap:12px}
}
/* phone */
@media (max-width:767px){
 .who .nm,.who .i{display:none}
 .content{padding:24px 16px 96px}
 .ph h1{font-size:28px}
 .ph .btn{display:none}
 .cta2{display:flex;width:100%;margin-top:16px}
 .tools{margin-top:20px;gap:8px}
 .seg{flex:1}.seg button{flex:1 1 0;padding:0 6px}
 .tools .sp{display:none}
 .srch{width:100%;order:2}
 .cards{margin-top:20px;grid-template-columns:minmax(0,1fr);gap:16px}
 .cov{height:120px}
 .cb{padding:16px;gap:14px}
 .cb h3{font-size:16px}
 .fig b{font-size:16px}
 .empty{padding:40px 16px}
 .empty h2{font-size:20px}
 .steps{flex-direction:column;align-items:stretch;width:100%}
 .empty .btn{width:100%}
 .toast{left:16px;right:16px;bottom:16px}
 .app.withmock .toast{bottom:72px}
 .mock{left:16px;right:16px;transform:none;justify-content:space-between}
}

/* ===== Create / edit space dialog (mockup #4) ===== */
.cov img.phi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.btn.ghost{color:var(--mu)}.btn.ghost:hover{background:var(--sfm)}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn.pri:disabled:hover{background:var(--pr)}
.ov{position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
.ov.open{display:flex}
.dlg:focus{outline:none;box-shadow:var(--shm)}
.dlg{width:512px;max-width:100%;max-height:calc(100vh - 48px);background:#fff;border-radius:14px;box-shadow:var(--shm);display:flex;flex-direction:column;overflow:hidden}
.dhd{display:flex;align-items:flex-start;gap:16px;padding:20px 24px 16px;border-bottom:1px solid var(--bd)}
.dhd .grow{flex:1;min-width:0}
.dhd h2{font-size:18px;font-weight:600;line-height:1.3}
.dhd p{font-size:14px;color:var(--mu);margin-top:4px}
.dx{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mu);margin:-4px -8px 0 0;flex:none}
.dx:hover{background:var(--sfm)}
.dbody{padding:20px 24px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;flex:1}
.dfoot{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid var(--bd);background:#fff}
.lb{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-bottom:8px;line-height:1.4}
.lb .req{color:#C81E1E;margin-left:-4px}
.lb .badge{font-weight:600}
.inp{display:block;height:44px;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff;padding:0 16px;font:inherit;font-size:14px;color:var(--tx)}
.inp::placeholder{color:var(--sb)}
.inp:hover{border-color:var(--bds)}
.inp:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.help{font-size:12px;color:var(--mu);margin-top:8px;line-height:1.5}
.f.err .inp,.f.err .sel{border-color:#C81E1E}
.f.err .help{color:#C81E1E}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.icn{position:relative}.icn .inp{padding-left:44px}.icn>.i{position:absolute;left:14px;top:13px;color:var(--sb);pointer-events:none}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:5}
.sopt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;width:100%;text-align:start}
.sopt .i{color:var(--sb);margin-top:2px}
.sopt b{display:block;font-size:14px;font-weight:600;line-height:1.4}
.sopt span span{font-size:12px;color:var(--mu)}
.sopt.act,.sopt:hover{background:var(--sfm)}
.dd{position:relative}
.sel{height:44px;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;font-size:14px;text-align:start}
.sel:hover{border-color:var(--bds)}
.sel[aria-expanded=true]{border-color:var(--pr)}
.sel .i{color:var(--mu)}
.tzl{position:absolute;left:0;right:0;top:calc(100% + 4px);bottom:auto;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:5}
.tzl.up{top:auto;bottom:calc(100% + 4px)}
.tzs{height:40px;margin-bottom:4px}
.tzs input{border:0;outline:0;font:inherit;font-size:14px;color:var(--tx);flex:1;min-width:0;background:none;height:100%}
.tzs:focus-within{border-color:var(--pr)}
.tzo{max-height:208px;overflow-y:auto}
.tzo .opt b{font-weight:500}.tzo .opt small{font-size:12px;color:var(--mu)}
.tzo .opt.sel1{background:var(--prs)}.tzo .opt.sel1 .i{color:var(--pr)}
.tzo .opt.act{background:var(--sfm)}
.tzo p{font-size:14px;color:var(--mu);padding:10px 12px}
.photo{display:flex;gap:16px;align-items:flex-start}
.pv{width:144px;height:88px;border-radius:10px;flex:none;overflow:hidden;position:relative;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:700;letter-spacing:1px}
.pv img,.pv svg.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}
.pbtns + .help{margin-top:8px}
.note{display:flex;gap:12px;padding:12px 16px;border:1px solid #C9CDFB;background:#EEF0FF;border-radius:10px;font-size:14px}
.note>.i{color:#4338CA;margin-top:2px}
.note b{display:block;color:#4338CA;font-weight:600}
.note span span{color:#475069}
.dsk{display:inline}
@media (max-width:767px){
 .ov{padding:0;align-items:stretch}
 .dlg{width:100%;max-height:none;height:100%;border-radius:0;animation:up .2s ease-out}
 .dhd{padding:16px;align-items:center}
 .dhd p{display:none}
 .dx{width:44px;height:44px;margin:-4px -8px -4px 0}
 .dbody{padding:20px 16px 24px}
 .dfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:0;box-shadow:0 -4px 16px rgb(15 20 51/8%)}
 .dfoot .btn{flex:1 1 0}
 .row2{grid-template-columns:minmax(0,1fr)}
 .inp,.sel,.tzs input{font-size:16px}
 .photo{flex-direction:column}
 .pv{width:100%;height:144px}
 .app.dlgopen .mock{display:none}
 .dsk{display:none}
 .mock>span:first-child{display:none}
 .mock .seg button{padding:0 10px}
}
@media (min-width:768px){.app.dlgopen .mock{left:16px;transform:none}.app.dlgopen #mseg{display:none}}
.mock .seg button{gap:0}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== Space details (mockup #5) ===== */
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mu);margin-bottom:16px}
.crumb a{display:inline-flex;align-items:center;gap:6px;color:var(--pr);font-weight:600}
.crumb .i{color:var(--sb)}
.hd{display:flex;align-items:flex-start;gap:20px}
.hcov{width:120px;height:88px;border-radius:14px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:28px;font-weight:700;letter-spacing:1px}
.hcov svg.ph,.hcov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hd .grow{flex:1;min-width:0}
.hd h1{font-size:32px;line-height:1.2;font-weight:700;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meta{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:8px;font-size:14px;color:var(--mu)}
.meta span{display:flex;align-items:center;gap:8px}.meta .i{color:var(--sb)}
.hbtns{display:flex;gap:12px;flex:none}
.btn.ghost{color:var(--mu)}
.btn.dangerbtn{background:#C81E1E;color:#fff}.btn.dangerbtn:hover{background:#A51616}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:24px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px;display:flex;align-items:center;gap:16px}
.kpi .grow{flex:1;min-width:0}
.kpi .l{font-size:14px;color:var(--mu);display:flex;align-items:center;gap:6px}
.kpi b{display:block;font-size:24px;font-weight:700;line-height:1.3;margin-top:4px}
.kpi small{font-size:12px;color:var(--sb)}
.kic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--prs);color:var(--pr)}
.kic.g{background:#E6F7EC;color:#15803D}.kic.a{background:#FFF4E3;color:#B45309}
.tip{position:relative;display:inline-grid;color:var(--sb);cursor:help}
.tipb{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:240px;background:var(--tx);color:#fff;font-size:12px;font-weight:400;line-height:1.45;padding:8px 12px;border-radius:10px;text-align:start;box-shadow:var(--shm);opacity:0;pointer-events:none;transition:opacity .15s;z-index:6}
.tip:hover .tipb,.tip:focus .tipb{opacity:1}
.notice{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border:1px solid;border-radius:14px;margin-top:24px}
.notice>.i{margin-top:2px}
.notice .grow{flex:1;min-width:0}
.notice b{display:block;font-weight:600;font-size:16px}
.notice p{font-size:14px;color:var(--mu);margin-top:2px}
.notice.neutral b,.notice.neutral>.i{color:#475069}
.blk{margin-top:32px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sh h2{font-size:24px;font-weight:700;line-height:1.2}
.sh p{color:var(--mu);font-size:14px;margin-top:4px}
.sh .r{display:flex;gap:12px;align-items:center}
.lcards{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:24px}
.lc{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);display:flex;flex-direction:column;min-width:0}
.th{height:168px;border-radius:13px 13px 0 0;overflow:hidden;position:relative;background:var(--sfm);border-bottom:1px solid var(--bd)}
.th svg{display:block;width:100%;height:100%}
.th .badge{position:absolute;top:12px;left:12px}
.lc.arch .th svg{filter:grayscale(1);opacity:.6}
.lb2{padding:20px;display:flex;flex-direction:column;gap:16px;flex:1}
.lb2 h3{font-size:18px;font-weight:600;line-height:1.3}
.lb2 .used{font-size:14px;color:var(--mu);margin-top:4px;display:flex;align-items:center;gap:8px}
.lb2 .used .i{color:var(--sb)}
.lfigs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr);background:var(--sfm);border:1px solid var(--bd);border-radius:10px}
.lfigs div{padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.lfigs div+div{border-left:1px solid var(--bd)}
.lfigs b{font-size:18px;font-weight:700;line-height:1.3}
.lfigs b.d{font-size:14px;font-weight:600;line-height:1.3;padding:3px 0}
.lfigs span{font-size:12px;color:var(--sb);line-height:1.35}
.lfigs .over b{color:#B45309}

 <div class="f" id="w-ph"><span class="lb">Space Photo</span><div class="photo"><div class="pv" id="pv"></div><div><div class="pbtns" id="pbtns"></div><p class="help" id="h-ph">${HELP.ph}</p></div></div><input type="file" id="file" accept="image/png,image/jpeg" hidden></div>
 </form>
 <div class="dfoot"><button type="button" class="btn ghost" data-d="close">Cancel</button><button type="submit" form="dform" class="btn pri" id="dsave">${ed?I('save',18)+'Save Changes':I('plus',18)+'Create Space'}</button></div>`}
function renderPhoto(){const f=D.f;
 $('pv').style.background=f.photo?'#ECEFF5':COVERS[f.cov];
 $('pv').innerHTML=f.photo==='svg'?PHOTO:f.photo?`<img src="${f.photo}" alt="Space photo preview">`:(f.n.trim()?initials(f.n.trim()):I('bld',28));
 $('pbtns').innerHTML=f.photo?`<button type="button" class="btn sec sm" data-d="upload">${I('imageup',18)}Replace Photo</button><button type="button" class="btn ghost sm" data-d="rmphoto">${I('trash',18)}Remove</button>`:`<button type="button" class="btn sec sm" data-d="upload">${I('imageup',18)}Upload Photo</button>`}
function validate(){const e={},f=D.f,w=cur(),n=f.n.trim();
 if(!n)e.n='Enter a name for the space, e.g. Main Hall.';
 else if(w.spaces.some((s,i)=>i!==D.k&&s.n.toLowerCase()===n.toLowerCase()))e.n=`${w.n} already has a space named “${n}”. Choose another name.`;
 if(!f.a.trim())e.a='Enter the address, or pick one from the suggestions.';
 const m=f.max.trim();if(!m)e.max='Enter how many people the space holds, between 1 and 3000.';else if(!/^\d+$/.test(m)||+m<1||+m>3000)e.max='Enter a whole number between 1 and 3000.';
 const t=f.tab.trim();if(t&&(!/^\d+$/.test(t)||+t<1||+t>200))e.tab='Enter a whole number between 1 and 200, or leave it empty.';
 return e}
function showErrs(e){['n','a','max','tab'].forEach(k=>{const has=D.tried&&e[k];$('w-'+k).classList.toggle('err',!!has);$('f-'+k).setAttribute('aria-invalid',has?'true':'false');$('h-'+k).textContent=has?e[k]:HELP[k]})}
const dirty=()=>JSON.stringify(D.f)!==D.orig;
function updSave(){$('dsave').disabled=D.mode==='edit'&&!dirty()}
function live(){if(D.tried)showErrs(validate());updSave()}
/* address suggestions */
function hideSugg(){D.sg=[];D.sa=-1;$('sugg').classList.add('hidden');$('f-a').setAttribute('aria-expanded','false')}
function showSugg(){const q=$('f-a').value.trim().toLowerCase();if(q.length<2){hideSugg();return}
 const ws=q.split(/[\s,]+/).filter(Boolean);D.sg=ADDR.filter(([a,b])=>ws.every(x=>(a+' '+b).toLowerCase().includes(x))).slice(0,5);
 if(!D.sg.length||(D.sg.length===1&&`${D.sg[0][0]}, ${D.sg[0][1]}`.toLowerCase()===q)){hideSugg();return}
 D.sa=Math.min(D.sa,D.sg.length-1);
 $('sugg').innerHTML=D.sg.map(([a,b],i)=>`<button type="button" class="sopt${i===D.sa?' act':''}" role="option" id="sg${i}" aria-selected="${i===D.sa}" data-sg="${i}">${I('pin',16)}<span><b>${esc(a)}</b><span>${esc(b)}</span></span></button>`).join('');
 $('sugg').classList.remove('hidden');$('f-a').setAttribute('aria-expanded','true');
 if(D.sa>=0)$('f-a').setAttribute('aria-activedescendant','sg'+D.sa);else $('f-a').removeAttribute('aria-activedescendant')}
function pickSugg(i){const [a,b]=D.sg[i];$('f-a').value=`${a}, ${b}`;D.f.a=$('f-a').value;hideSugg();live()}
/* time zone list */
function tzFiltered(){const q=($('tzq').value||'').trim().toLowerCase();return TZ.filter(([z,c])=>!q||(z.replace(/_/g,' ')+' '+c).toLowerCase().includes(q))}
function renderTz(){const l=tzFiltered();D.ta=Math.min(Math.max(D.ta,0),l.length-1);
 $('tzo').innerHTML=l.length?l.map(([z,c],i)=>`<button type="button" class="opt${z===D.f.tz?' sel1':''}${i===D.ta?' act':''}" role="option" aria-selected="${z===D.f.tz}" data-tz="${z}"><span><b>${z}</b> <small>· ${esc(c)}</small></span>${z===D.f.tz?I('check',18):''}</button>`).join(''):'<p>No time zones match.</p>';
 const a=$('tzo').querySelector('.act');if(a)a.scrollIntoView({block:'nearest'})}
function setTz(o){D.tzOpen=o;$('tzl').classList.toggle('hidden',!o);$('f-tz').setAttribute('aria-expanded',o);
 if(o){const r=$('f-tz').getBoundingClientRect(),bd=$('dform').getBoundingClientRect();$('tzl').classList.toggle('up',bd.bottom-r.bottom<300&&r.top-bd.top>bd.bottom-r.bottom);$('tzq').value='';D.ta=Math.max(0,TZ.findIndex(([z])=>z===D.f.tz));renderTz();$('tzq').focus()}}
function pickTz(z){D.f.tz=z;$('tzv').textContent=tzLabel(z);setTz(false);$('f-tz').focus();live()}
function openDlg(mode,k=-1){const w=cur(),s=mode==='edit'?w.spaces[k]:null;
 if(mode==='edit'&&!s)return;
 D.mode=mode;D.k=mode==='edit'?k:-1;D.tried=false;D.tzOpen=false;D.sg=[];D.sa=-1;
 const used=w.spaces.length;
 D.f=s?{n:s.n,a:s.a,max:String(s.max),tab:s.tab==null?'':String(s.tab),tz:s.tz||'Asia/Jerusalem',photo:s.img||(s.photo?'svg':null),cov:s.cov||'c'}
      :{n:'',a:'',max:'',tab:'',tz:(w.spaces.find(x=>x.tz)||{}).tz||'Asia/Jerusalem',photo:null,cov:'abc'[used%3]};
 D.orig=JSON.stringify(D.f);
 if(!D.open)D.ret=document.activeElement;
 D.open=true;S.menu=null;
 $('dlg').innerHTML=dlgHTML(s);renderPhoto();updSave();
 $('ov').classList.add('open');$('app').classList.add('dlgopen');document.body.style.overflow='hidden';
 syncMock();
 const fa=$('f-a');
 ['n','max','tab'].forEach(x=>$('f-'+x).addEventListener('input',e=>{D.f[x]=e.target.value;if(x==='n'&&!D.f.photo)renderPhoto();live()}));
 fa.addEventListener('input',()=>{D.f.a=fa.value;D.sa=-1;showSugg();live()});
 fa.addEventListener('focus',showSugg);
 fa.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==fa)hideSugg()},120));
 fa.addEventListener('keydown',e=>{if(!D.sg.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();D.sa=(D.sa+(e.key==='ArrowDown'?1:-1)+D.sg.length)%D.sg.length;showSugg()}
  else if(e.key==='Enter'&&D.sa>=0){e.preventDefault();pickSugg(D.sa)}
  else if(e.key==='Escape'){e.stopPropagation();e.preventDefault();hideSugg()}});
 $('sugg').addEventListener('mousedown',e=>{const b=e.target.closest('[data-sg]');if(b){e.preventDefault();pickSugg(+b.dataset.sg)}});
 $('tzq').addEventListener('input',()=>{D.ta=0;renderTz()});
 $('tzq').addEventListener('keydown',e=>{const l=tzFiltered();
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(l.length){D.ta=(D.ta+(e.key==='ArrowDown'?1:-1)+l.length)%l.length;renderTz()}}
  else if(e.key==='Enter'){e.preventDefault();if(l[D.ta])pickTz(l[D.ta][0])}
  else if(e.key==='Escape'){e.stopPropagation();e.preventDefault();setTz(false);$('f-tz').focus()}});
 $('file').addEventListener('change',e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
  const bad=!/^image\/(png|jpeg)$/.test(file.type)?'This file is not a JPG or PNG. Choose a JPG or PNG photo.':file.size>5*1024*1024?'This photo is larger than 5 MB. Choose a smaller one.':'';
  $('w-ph').classList.toggle('err',!!bad);$('h-ph').textContent=bad||HELP.ph;if(bad)return;
  const r=new FileReader();r.onload=()=>{D.f.photo=r.result;renderPhoto();updSave()};r.readAsDataURL(file)});
 $('dform').addEventListener('submit',e=>{e.preventDefault();saveDlg()});
 if(matchMedia('(min-width:768px)').matches)setTimeout(()=>$('f-n').focus(),0);else $('dlg').focus();
 history.replaceState(null,'','#'+mode);
}
function closeDlg(silent){if(!D.open)return;D.open=false;$('ov').classList.remove('open');$('app').classList.remove('dlgopen');document.body.style.overflow='';syncMock();
 setHash(hashFor());
 if(!silent&&D.ret&&document.contains(D.ret))D.ret.focus()}
function saveDlg(){const e=validate();D.tried=true;showErrs(e);
 const first=['n','a','max','tab'].find(k=>e[k]);if(first){$('f-'+first).focus();return}
 const f=D.f,w=cur();
 const rec={n:f.n.trim(),a:f.a.trim(),max:+f.max,tab:f.tab.trim()?+f.tab:null,tz:f.tz,photo:f.photo==='svg',img:f.photo&&f.photo!=='svg'?f.photo:null,cov:f.cov};
 if(D.mode==='edit'){const s=w.spaces[D.k];Object.assign(s,rec);closeDlg();render();toast(`${rec.n} was saved.${s.up?` Its upcoming events keep their own details.`:''}`)}
 else{if(S.empty){w.spaces=[];S.empty=false}w.spaces.unshift({...rec,lay:0,up:0});S.tab='active';S.q='';$('q').value='';closeDlg(true);render();toast(`${rec.n} was created. Next, draw its first table layout.`);
  const b=document.querySelector('#cards [data-menu="0"]');if(b)b.focus()}}
$('ov').addEventListener('click',e=>{
 if(e.target===$('ov')){closeDlg();return}
 if(D.tzOpen&&!e.target.closest('.dd'))setTz(false);
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.d==='close')closeDlg();
 else if(d.d==='upload')$('file').click();
 else if(d.d==='rmphoto'){D.f.photo=null;renderPhoto();updSave();$('pbtns').querySelector('button').focus()}
 else if(b.id==='f-tz')setTz(!D.tzOpen);
 else if(d.tz)pickTz(d.tz);
});
function dlgKey(e){
 if(e.key==='Escape'){if(D.tzOpen){setTz(false);$('f-tz').focus()}else closeDlg();e.preventDefault();return}
 if(e.key==='Tab'){const fs=[...$('dlg').querySelectorAll('button:not([disabled]),input:not([type=file])')].filter(x=>x.offsetParent!==null);if(!fs.length)return;
  const a=fs[0],z=fs[fs.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}}

render();fromHash();

}
</script></body></html>
