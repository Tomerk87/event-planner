<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venue Event: Guests (read-only)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mockup #17, venue_event_guests: the venue's read-only Guests page. No phones, no add/import/delete, no WhatsApp; only Seating Export.
   Tokens: DESIGN_GUIDE.md / tokens.css. Layout: sidebar at 1024px+, drawer below, phone cards below 768px. */
:root{color-scheme:light;--bg:#F6F7FB;--sf:#fff;--sfm:#F8F9FC;--bd:#E5E8F0;--bds:#CFD4E2;--tx:#0F1433;--mu:#5B6480;--sb:#626B85;--pr:#4F46E5;--prh:#4338CA;--prs:#EEF0FF;--prb:#C9CDFB;--nv1:#0F1535;--nv2:#151C47;--nvr:#1B2350;--nvb:#262E5C;--nvt:#F1F3FB;--nvm:#B4BBD6;--own:#D97706;--sh:0 1px 2px rgb(15 20 51/6%);--shm:0 8px 24px rgb(15 20 51/12%);--shb:0 -4px 16px rgb(15 20 51/8%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
ul{list-style:none}a{text-decoration:none;color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.i{flex:none;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--pr);color:#fff}.btn.pri:hover{background:var(--prh)}
.btn.sec{background:#fff;color:var(--pr);border:1px solid var(--prb)}.btn.sec:hover{border-color:var(--pr)}
.btn.soft{background:var(--prs);color:var(--pr)}
.btn.ghost{color:var(--mu)}.btn.ghost:hover{background:var(--sfm)}
.btn.dan{background:#C81E1E;color:#fff}.btn.dan:hover{background:#A51616}
.btn.sm{height:36px;padding:0 14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.icb.dan{background:#FDECEC;color:#C81E1E;border:1px solid #F6C4C4}.icb.dan:hover{border-color:#C81E1E}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.badge.lg{height:28px;padding:0 12px;gap:6px}
.success{color:#15803D;background:#E6F7EC;border-color:#BDE5CB}
.warning{color:#B45309;background:#FFF4E3;border-color:#F8D8A4}
.info{color:#4338CA;background:#EEF0FF;border-color:#C9CDFB}
.neutral{color:#475069;background:#ECEFF5;border-color:#D9DEEA}
.badge.owner .i{color:var(--own)}
/* shell */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30;background:linear-gradient(180deg,var(--nv1),var(--nv2));color:var(--nvt);display:flex;flex-direction:column;padding:16px}
.app.collapsed .side{display:none}
.dh{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;padding:4px 8px 0}
.logo .mk{width:32px;height:32px;border-radius:8px;background:var(--pr);display:grid;place-items:center;color:#fff}
.xb{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--nvb);place-items:center;color:var(--nvt)}
.evs{position:relative;margin-top:20px}
.evbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--nvr);border:1px solid var(--nvb);text-align:start;color:var(--nvt)}
.evbtn.open{border-color:var(--nvm)}
.cov{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;font-size:13px;font-weight:700}
.cov.a{background:linear-gradient(135deg,#8B5CF6,#EC4899)}.cov.b{background:linear-gradient(135deg,#10B981,#3B82F6)}
.evbtn .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}
.evbtn .sub{font-size:12px;color:var(--nvm)}
.evbtn .grow{flex:1;min-width:0}
.evbtn>.i{color:var(--nvm)}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--nvm)}
.nav a:hover{background:var(--nvr)}
.nav a.on{background:var(--nvr);color:var(--nvt);font-weight:600}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
.lang{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--nvb);background:var(--nvr);font-size:14px;width:100%;color:var(--nvt)}
.lang span{flex:1;text-align:start}
.out{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;font-size:14px;color:var(--nvm)}
.menu{position:absolute;left:0;top:calc(100% + 8px);width:100%;min-width:232px;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:5}
.menu h4{font-size:12px;font-weight:500;color:var(--mu);padding:8px 12px 4px}
.mi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;width:100%;text-align:start}
.mi.sel{background:var(--prs)}
.mi .tx{flex:1;min-width:0}.mi .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}.mi .sub{font-size:12px;color:var(--mu)}
.mi .ck{color:var(--pr)}
.mi:hover{background:var(--sfm)}.mi.sel:hover{background:var(--prs)}
.msep{height:1px;background:var(--bd);margin:8px 0}
.mlink{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--pr);width:100%}
.mlink:hover{background:var(--sfm)}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 32px;position:sticky;top:0;z-index:10}
.ibtn{width:44px;height:44px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--tx)}
.top .mk{display:none;width:40px;height:40px;border-radius:10px;background:var(--pr);place-items:center;color:#fff}
.top .sp{flex:1}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--mu)}
.bell em{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:#C81E1E;color:#fff;font-size:11px;font-weight:600;font-style:normal;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.rolei{width:36px;height:44px;display:grid;place-items:center;color:var(--own)}
.av{width:40px;height:40px;border-radius:50%;background:var(--prs);color:var(--pr);font-size:14px;font-weight:600;display:grid;place-items:center;flex:none}
.av.sm{width:32px;height:32px;font-size:12px}
.av.lg{width:48px;height:48px;font-size:16px}
.av.nacc{background:#ECEFF5;color:#475069}
.who{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}.who .i{color:var(--mu)}
/* page */
.content{padding:24px 32px 40px;width:100%;max-width:1344px;display:flex;flex-direction:column;gap:24px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.ph h1{font-size:32px;line-height:1.2;font-weight:700}
.ph p{color:var(--mu);margin-top:4px}
.note{display:flex;gap:12px;padding:16px 20px;border-radius:14px;border:1px solid}
.note.info{background:#EEF0FF;border-color:#C9CDFB}.note.info>.i{color:#4338CA}
.note.warning{background:#FFF4E3;border-color:#F8D8A4}.note.warning>.i{color:#B45309}
.note.neutral{background:#ECEFF5;border-color:#D9DEEA}.note.neutral>.i{color:#475069}
.note>.i{margin-top:2px}
.note b{display:block;font-size:14px;font-weight:600}
.note.info b{color:#4338CA}.note.warning b{color:#B45309}.note.neutral b{color:#475069}
.note p{font-size:14px;color:var(--tx);margin-top:4px}
.note.info p{color:var(--mu)}
.note p strong{font-weight:600}
.note.sm{padding:12px 16px;border-radius:10px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px}
.chd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.chd .grow{display:flex;gap:12px;align-items:flex-start;min-width:0}
.sic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.sic.c{background:var(--prs);color:var(--pr)}.sic.v{background:#ECEFF5;color:#475069}
.chd h2{font-size:18px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chd p{font-size:14px;color:var(--mu);margin-top:4px}
.chd .right{display:flex;align-items:center;gap:12px;flex:none}
.ro{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:24px 16px 8px}
.empty .ic{width:56px;height:56px;border-radius:50%;background:#FFF4E3;color:#B45309;display:grid;place-items:center}
.empty h3{font-size:16px;font-weight:600}
.empty p{font-size:14px;color:var(--mu);max-width:520px}
.empty.sm{padding:8px 16px}
.empty.sm .ic{background:#ECEFF5;color:#475069;width:48px;height:48px}
.muted-line{display:flex;gap:8px;font-size:14px;color:var(--mu)}
.muted-line .i{color:var(--sb);margin-top:2px}
/* tables */
.tbl{margin-top:16px;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{white-space:nowrap;background:var(--sfm);font-weight:500;color:var(--mu);text-align:center;height:46px;padding:0 16px;border-bottom:1px solid var(--bd)}
th.s{text-align:start}
td{height:60px;padding:8px 16px;border-bottom:1px solid var(--bd)}
tr:last-child td{border-bottom:0}
td.c{text-align:center;white-space:nowrap}
.nmc{display:flex;align-items:center;gap:12px;font-weight:500}
.nmc .na{color:var(--mu);font-weight:400}
.you{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:#ECEFF5;color:#475069;font-size:12px;font-weight:600}
.mut{color:var(--mu)}
/* dialogs */
.ov{position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
.ov.open{display:flex}
.dlg{width:512px;max-width:100%;max-height:calc(100vh - 48px);background:#fff;border-radius:14px;box-shadow:var(--shm);display:flex;flex-direction:column;overflow:hidden}
.dlg:focus{outline:none}
.dhd{display:flex;align-items:flex-start;gap:16px;padding:20px 24px 16px;border-bottom:1px solid var(--bd)}
.dhd .grow{flex:1;min-width:0}
.dhd h2{font-size:18px;font-weight:600;line-height:1.3}
.dhd p{font-size:14px;color:var(--mu);margin-top:4px}
.dhd .icb{color:var(--mu);margin:-6px -8px 0 0}
.dbody{padding:20px 24px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;flex:1;font-size:14px}
.dbody>p{color:var(--mu)}.dbody>p strong{color:var(--tx);font-weight:600}
.dft{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid var(--bd)}
.lbl{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
.icn{position:relative}.icn .i{position:absolute;left:14px;top:13px;color:var(--sb);pointer-events:none}
.inp{display:block;height:44px;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff;padding:0 16px 0 42px;font:inherit;font-size:14px;color:var(--tx)}
.inp::placeholder{color:var(--sb)}.inp:hover{border-color:var(--bds)}
.inp:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.help{font-size:12px;color:var(--mu);margin-top:8px;line-height:1.5}
.err .inp{border-color:#C81E1E}.err .help{color:#C81E1E}
.pts{display:flex;flex-direction:column;gap:8px;color:var(--mu)}
.pts li{display:flex;gap:8px}.pts .i{color:var(--sb);margin-top:2px}.pts .y .i{color:#15803D}
.pts strong{color:var(--tx);font-weight:600}
.box{padding:16px;border-radius:10px;background:var(--sfm);border:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.box h4{font-size:14px;font-weight:600}
/* mockup state switcher (not part of the product) */
.mock{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;display:flex;align-items:center;gap:8px;background:#fff;border:1px dashed var(--bds);border-radius:14px;box-shadow:var(--shm);padding:6px 6px 6px 14px;font-size:12px;color:var(--mu)}
.seg{display:flex;background:#fff;border-radius:14px;gap:4px}
.seg button{height:32px;padding:0 12px;border-radius:10px;font-size:12px;font-weight:500;color:var(--mu)}
.seg button.on{background:var(--pr);color:#fff;font-weight:600}
.mock .hx{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--mu)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--tx);color:#fff;font-size:14px;padding:12px 16px;border-radius:10px;box-shadow:var(--shm);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:70;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:none}
.app.withmock .toast{bottom:80px}
.app.withmock .content{padding-bottom:96px}
.hidden{display:none!important}
.danger{color:#C81E1E;background:#FDECEC;border-color:#F6C4C4}
.ph .acts{display:flex;gap:12px;flex:none}
.note .grow{flex:1;min-width:0}
.note .meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12px;color:var(--mu)}
.note .meta span{display:inline-flex;align-items:center;gap:4px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:108px}
.kpi .l{font-size:14px;color:var(--mu);line-height:1.3}
.kpi .n{font-size:24px;font-weight:700;line-height:1.2;margin-top:4px}
.kpi .u{font-size:12px;color:var(--sb)}
.kpi .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic.t-pr{background:var(--prs);color:var(--pr)}.ic.t-su{background:#E6F7EC;color:#15803D}.ic.t-wa{background:#FFF4E3;color:#B45309}.ic.t-da{background:#FDECEC;color:#C81E1E}.ic.t-ne{background:#ECEFF5;color:#475069}
/* filters */
.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.filters .search{flex:1;min-width:280px}
.search .inp{padding-right:40px}
.search .clr{position:absolute;right:4px;top:4px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mu)}
.search .clr:hover{background:var(--sfm)}
.search .clr .i{position:static}
.dd{position:relative}
.ddb{height:44px;display:flex;align-items:center;gap:12px;padding:0 14px 0 16px;border:1px solid var(--bd);border-radius:10px;background:#fff;font-size:14px;color:var(--tx);white-space:nowrap;min-width:150px;justify-content:space-between;width:100%}
.ddb:hover{border-color:var(--bds)}
.ddb.act{border-color:var(--prb);background:var(--prs);color:var(--prh);font-weight:600}
.ddb .i{color:var(--mu)}
.ddm{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;width:max-content;max-width:280px;max-height:320px;overflow-y:auto;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:20}
.ddm.r{left:auto;right:0}
.ddo{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 12px;border-radius:10px;font-size:14px;text-align:start}
.ddo:hover{background:var(--sfm)}
.ddo.sel{background:var(--prs);color:var(--prh);font-weight:600}
.ddo .tx{flex:1}
.ddo .ct{font-size:12px;color:var(--mu);font-weight:500}
.ddo .ck{color:var(--pr)}
.ddsep{height:1px;background:var(--bd);margin:6px 0}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mu)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:999px;background:var(--prs);border:1px solid var(--prb);color:var(--prh);font-size:12px;font-weight:600}
.chip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--prh)}
.chip button:hover{background:#fff}
.lnk{color:var(--pr);font-weight:600;font-size:14px;height:32px;padding:0 8px;border-radius:10px}
.lnk:hover{background:var(--prs)}
/* guest table */
.gcard{padding:0;overflow:hidden}
.gcard table th{height:56px;line-height:1.3;white-space:normal}
.gcard table td{height:64px}
.gcard td.c{text-align:center}
th .sb{display:inline-flex;align-items:center;gap:4px;color:inherit;font-weight:500;padding:4px 6px;border-radius:6px;text-align:center}
th .sb:hover{color:var(--tx);background:#fff}
th .sb.on{color:var(--pr);font-weight:600}
th .sb .i{color:var(--sb)}th .sb.on .i{color:var(--pr)}
th.s .sb{text-align:start;margin-left:-6px}
.nm2{display:flex;align-items:center;gap:12px}
.nm2 b{display:block;font-weight:600;line-height:1.3}
.nm2 small{display:block;font-size:12px;color:var(--mu);line-height:1.4}
.tb{font-weight:600}
.pgr{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mu)}
.pgr .rpp{display:flex;align-items:center;gap:12px}
.pgr .rpp .ddb{min-width:80px}
.pgr .ddm{top:auto;bottom:calc(100% + 6px)}
.pages{display:flex;gap:4px;align-items:center}
.pages button{min-width:36px;height:36px;border-radius:10px;font-size:14px;font-weight:500;color:var(--tx);display:grid;place-items:center;padding:0 6px}
.pages button:hover{background:#fff}
.pages button.on{background:var(--pr);color:#fff;font-weight:600}
.pages button.nv{border:1px solid var(--bd);background:#fff}
.pages button[disabled]{opacity:.45;cursor:not-allowed}
.pages .el{width:24px;text-align:center}
.gcards{display:none}
.gc{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:12px}
.gc .top2{display:flex;gap:12px;align-items:flex-start}
.gc .grow{flex:1;min-width:0}
.gc h3{font-size:16px;font-weight:600;line-height:1.3}
.gc .sub{font-size:14px;color:var(--mu)}
.gc .figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--mu)}
.gc .figs b{display:block;font-size:14px;color:var(--tx);font-weight:600;margin-top:2px}
.nores{padding:40px 16px}
.nores .ic{background:#ECEFF5;color:#475069}
.empty .ic.in{background:var(--prs);color:var(--pr)}
/* export dialog */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--bd);border-radius:10px;text-align:start;background:#fff;width:100%}
.opt:hover{border-color:var(--bds)}
.opt.on{border-color:var(--pr);background:var(--prs)}
.opt .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--bds);flex:none;margin-top:2px;display:grid;place-items:center}
.opt.on .rd{border-color:var(--pr)}
.opt.on .rd::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--pr)}
.opt b{display:block;font-size:14px;font-weight:600}
.opt small{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.fs{border:0}.fs legend{font-size:14px;font-weight:500;margin-bottom:8px}
.cols{display:flex;flex-wrap:wrap;gap:8px}
.cols .badge{height:28px;padding:0 10px}
.prev{border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.prev table{font-size:12px}
.prev th{height:32px;padding:0 10px;font-size:12px}
.prev td{height:32px;padding:4px 10px}

.dd.sortdd{display:none}
@media (max-width:1279px){

}
@media (max-width:1023px){

 .gcard{overflow-x:auto}
}
@media (max-width:767px){
 .who .nm,.who .i{display:none}
 .content{padding:24px 16px 40px;gap:20px}
 .ph{flex-direction:column;gap:16px}

 .ph .acts{width:100%}.ph .acts .btn{flex:1}
 .note{padding:16px}
 .kpis{grid-template-columns:1fr 1fr;gap:12px}
 .kpi{padding:16px;min-height:96px;align-items:flex-start}
 .kpi .ic{width:40px;height:40px}
 .filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .filters .search{grid-column:1/-1;min-width:0}
 .dd.sortdd{display:block}
 .ddb{min-width:0}
 .ddb span{overflow:hidden;text-overflow:ellipsis}
 .filters .dd:nth-child(odd) .ddm{left:auto;right:0}
 .ddm{max-width:calc(100vw - 32px)}
 .gcard{display:none}
 .gcards{display:flex;flex-direction:column;gap:12px}
 .pgr{flex-direction:column;align-items:stretch;gap:12px}
 .pgr .rpp{justify-content:space-between}
 .pages{justify-content:center}
 .opts{grid-template-columns:1fr}
 .ov{padding:0;align-items:stretch}
 .dlg{width:100%;max-height:none;height:100%;border-radius:0}
 .dhd{padding:16px;align-items:center}
 .dbody{padding:20px 16px 24px}
 .dft{padding:12px 16px;box-shadow:var(--shb);border-top:0}
 .dft .btn{flex:1}
 .toast{left:16px;right:16px;bottom:16px}
 .app.withmock .toast{bottom:72px}
 .mock{left:8px;right:8px;transform:none;justify-content:space-between;padding:6px}
 .mock>span{display:none}
 .seg button{padding:0 8px}
 .app.dlgopen .mock{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const sortTh=(key,label,cls='',w='')=>{const on=S.sort===key;return `<th class="${cls}"${w?` style="width:${w}"`:''} aria-sort="${on?(S.dir>0?'ascending':'descending'):'none'}"><button class="sb${on?' on':''}" data-sort="${key}">${label}${I(on?(S.dir>0?'up':'dn'):'updown',14)}</button></th>`};

const pager=(total)=>{const pages=Math.max(1,Math.ceil(total/S.rpp)),p=S.page;
 const nums=[];for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-p)<=1||(p<=3&&i<=4)||(p>=pages-2&&i>=pages-3))nums.push(i);else if(nums[nums.length-1]!=='…')nums.push('…')}
 const from=total?(p-1)*S.rpp+1:0,to=Math.min(total,p*S.rpp);
 return `<div class="pgr"><div class="rpp"><span>Rows per page</span>${dd('rpp')}<span>${from}–${to} of ${total} guests</span></div>
 <nav class="pages" aria-label="Pages"><button class="nv" data-pg="${p-1}" ${p<=1?'disabled':''} aria-label="Previous page">${I('left',18)}</button>${nums.map(n=>n==='…'?'<span class="el">…</span>':`<button class="${n===p?'on':''}" data-pg="${n}" ${n===p?'aria-current="page"':''}>${n}</button>`).join('')}<button class="nv" data-pg="${p+1}" ${p>=pages?'disabled':''} aria-label="Next page">${I('right',18)}</button></nav></div>`};

const listArea=()=>{
 if(S.mode==='await')return `<section class="card"><div class="empty"><span class="ic in">${I('users',26)}</span><h3>No guests yet</h3><p>The guest list is managed by the client. Guests appear here after your client accepts the invitation and adds them. Phone numbers are never shown to the venue.</p><button class="btn pri" data-soon="Permissions">${I('shield',18)}Go to Permissions</button></div></section>`;
 const all=filtered(),pages=Math.max(1,Math.ceil(all.length/S.rpp));if(S.page>pages)S.page=pages;
 const rows=all.slice((S.page-1)*S.rpp,S.page*S.rpp);
 if(!all.length)return `<section class="card"><div class="empty nores"><span class="ic">${I('search',24)}</span><h3>No guests match</h3><p>Try a different name, or clear the filters.</p><button class="btn sec" data-a="clear">Clear Filters</button></div></section>`;
 const tr=rows.map(g=>`<tr><td><div class="nm2"><span class="av sm">${initials(g.n)}</span><div><b>${esc(g.n)}</b>${g.inv?`<small>${esc(g.inv)}</small>`:''}</div></div></td><td class="c">${g.exp}</td><td class="c">${g.conf??'<span class="mut">—</span>'}</td><td class="c">${badge(g.st)}</td><td class="c">${tableCell(g)}</td><td>${g.grp?esc(g.grp):'<span class="mut">—</span>'}</td></tr>`).join('');
 const cards=rows.map(g=>`<article class="gc"><div class="top2"><span class="av">${initials(g.n)}</span><div class="grow"><h3>${esc(g.n)}</h3>${g.inv?`<div class="sub">${esc(g.inv)}</div>`:''}</div>${badge(g.st)}</div><div class="figs"><span>Expected<b>${g.exp}</b></span><span>Confirmed<b>${g.conf??'—'}</b></span><span>Table<b>${g.table?g.table:g.st==='approved'?'None':'—'}</b></span><span>Group<b>${g.grp?esc(g.grp):'—'}</b></span></div></article>`).join('');
 return `<section class="card gcard"><table><caption class="hidden">Guests, read-only</caption><thead><tr>${sortTh('name','Name','s','30%')}${sortTh('exp','Expected<br>Attendees')}${sortTh('conf','Confirmed')}${sortTh('st','Status')}${sortTh('table','Table')}${sortTh('grp','Group','s')}</tr></thead><tbody>${tr}</tbody></table></section>
 <section class="gcards" aria-label="Guests">${cards}</section>${pager(all.length)}`};

const chips=()=>{if(S.mode==='await')return '';const c=[];
 if(S.q.trim())c.push(['q',`“${S.q.trim()}”`]);
 if(S.st!=='all')c.push(['st',STATUS[S.st][0]]);
 if(S.tb!=='all')c.push(['tb',S.tb==='none'?'No table':'Table '+S.tb]);
 if(S.gr!=='all')c.push(['gr',S.gr==='none'?'No group':S.gr]);
 if(!c.length)return '';
 return `<div class="chips"><span>${filtered().length} of ${GUESTS.length} guests</span>${c.map(([k,l])=>`<span class="chip">${esc(l)}<button data-unf="${k}" aria-label="Remove filter ${esc(l)}">${I('x',14)}</button></span>`).join('')}<button class="lnk" data-a="clear">Clear all</button></div>`};

const renderMain=()=>{const off=S.mode==='await';
 $('content').innerHTML=`<div class="ph"><div><h1>Guests</h1><p>See who's coming and where they sit.</p></div><div class="acts"><button class="btn sec" data-a="export"${off?' disabled':''}>${I('download',18)}Seating Export</button></div></div>
 <div class="note info">${I('users')}<div class="grow"><b>The guest list is managed by the client</b><p>${off?`After your client joins, they add guests, collect RSVPs and seat people. You'll see names, responses and tables here.`:`<strong>${CLIENT}</strong> adds guests, sends invitations and seats people. You can view the list and export seating, but not change it.`}</p><div class="meta"><span>${I('eyeoff',14)}Phone numbers are hidden from ${VENUE}</span>${off?'':`<span>${I('clock',14)}Last change by the client: today, 14:20</span>`}</div></div></div>
 ${kpis()}
 ${off?'':`<div class="filters" id="filters"><div class="icn search"><label class="hidden" for="q">Search guests</label>${I('search',18)}<input class="inp" id="q" type="search" aria-label="Search guests" placeholder="Search by guest or invitation name…" value="${esc(S.q)}" autocomplete="off">${S.q?`<button class="clr" data-a="clrq" aria-label="Clear search">${I('x',16)}</button>`:''}</div>${dd('st')}${dd('tb')}${dd('gr')}${dd('sort','sortdd')}</div>`}
 ${chips()}
 <div id="listArea" style="display:flex;flex-direction:column;gap:16px">${listArea()}</div>`;
 document.querySelectorAll('#mseg button').forEach(b=>b.classList.toggle('on',b.dataset.mock===S.mode))};
const render=(keepFocus)=>{renderSide();
 const f=document.activeElement,id=f&&f.id,pos=id==='q'?f.selectionStart:null;
 renderMain();
 if(keepFocus&&id==='q'){const q=$('q');q.focus();q.setSelectionRange(pos,pos)}};

/* ---- seating export ---- */
const expRows=()=>{const e=S.exp;let r=GUESTS.filter(g=>e.inc==='all'||g.st==='approved');
 return r.slice().sort(e.sort==='table'?(a,b)=>(a.table??999)-(b.table??999)||a.n.localeCompare(b.n):(a,b)=>a.n.localeCompare(b.n))};
let lastFocus=null;
const hd=(t,p)=>`<div class="dhd"><div class="grow"><h2 id="dtitle">${t}</h2>${p?`<p>${p}</p>`:''}</div><button class="icb" data-a="close" aria-label="Close">${I('x')}</button></div>`;
const opt=(grp,val,b,s)=>`<button class="opt${S.exp[grp]===val?' on':''}" role="radio" aria-checked="${S.exp[grp]===val}" data-eo="${grp}" data-ev="${val}"><span class="rd"></span><span><b>${b}</b><small>${s}</small></span></button>`;
const drawDlg=()=>{const r=expRows(),ppl=sum(r,g=>g.conf||g.exp);
 $('dlg').innerHTML=hd('Seating Export',`Download the guest list with tables for ${esc(EV.n)}.`)+`<div class="dbody">
 <fieldset class="fs"><legend>Sort By</legend><div class="opts" role="radiogroup">${opt('sort','table','By table','Table 1, Table 2… then guests without a table')}${opt('sort','name','By guest name','A to Z, for the check-in desk')}</div></fieldset>
 <fieldset class="fs"><legend>Include</legend><div class="opts" role="radiogroup">${opt('inc','approved','Approved guests',`${GUESTS.filter(g=>g.st==='approved').length} guests`)}${opt('inc','all','All guests',`${GUESTS.length} guests, with their RSVP status`)}</div></fieldset>
 <fieldset class="fs"><legend>Format</legend><div class="opts" role="radiogroup">${opt('fmt','xlsx','Excel (.xlsx)','To edit or share')}${opt('fmt','pdf','PDF','To print for the event night')}</div></fieldset>
 <div><span class="lbl">Columns</span><div class="cols">${['Table','Guest','Invitation Name','Confirmed','Status','Group'].map(c=>`<span class="badge neutral">${c}</span>`).join('')}</div><p class="help">Phone numbers are never included. ${r.length} rows, ${ppl} people.</p></div>
 <div class="prev"><table><thead><tr><th>Table</th><th class="s">Guest</th><th>Confirmed</th></tr></thead><tbody>${r.slice(0,3).map(g=>`<tr><td class="c">${g.table??'—'}</td><td>${esc(g.n)}</td><td class="c">${g.conf??'—'}</td></tr>`).join('')}<tr><td colspan="3" class="mut" style="text-align:center">+ ${Math.max(0,r.length-3)} more rows</td></tr></tbody></table></div>
 </div><div class="dft"><button class="btn ghost" data-a="close">Cancel</button><button class="btn pri" data-a="download">${I('download',18)}Download</button></div>`};
const openDlg=()=>{S.dlg=1;lastFocus=document.activeElement;drawDlg();$('ov').classList.add('open');$('app').classList.add('dlgopen');setTimeout(()=>$('dlg').focus(),0)};
const closeDlg=()=>{S.dlg=null;$('ov').classList.remove('open');$('app').classList.remove('dlgopen');if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus()};
const download=()=>{const r=expRows(),q=v=>`"${String(v).replace(/"/g,'""')}"`;
 const csv=['Table,Guest,Invitation Name,Confirmed,Status,Group',...r.map(g=>[g.table??'No table',g.n,g.inv,g.conf??'',STATUS[g.st][0],g.grp].map(q).join(','))].join('\r\n');
 const name='dana-yossi-wedding_seating.'+(S.exp.fmt==='pdf'?'pdf':'xlsx');
 try{const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download=name.replace(/\.(xlsx|pdf)$/,'.csv');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){}
 closeDlg();toast(`${name} was downloaded (${r.length} guests). The mockup saves a .csv.`)};

/* ---- events ---- */
const setDrawer=o=>{$('app').classList.toggle('drawer',o);if(!o&&S.evOpen){S.evOpen=false;renderSide()}};
const SOON={Dashboard:'Opens the venue Dashboard (mockup #19).','Event Layout':'Opens the Event Layout, where the venue edits the map and tables.','Event Settings':'Opens Event Settings, where the venue edits the date, address and max people.',Permissions:'Opens Permissions, where you manage the client (mockup #15).',back:'Goes back to the venue My Events (mockup #2).',lang:'Language: English, עברית, Português.'};
const setHash=h=>{try{history.replaceState(null,'','#'+h)}catch(e){}};
document.addEventListener('click',ev=>{const t=ev.target.closest('button,a');
 if(!ev.target.closest('#evs')&&S.evOpen){S.evOpen=false;renderSide()}
 if(S.dd&&!ev.target.closest('.dd')){S.dd=null;renderMain()}
 if(ev.target===$('ov')){closeDlg();return}
 if(ev.target===$('scrim')){setDrawer(false);return}
 if(!t||t.disabled)return;
 if(t.tagName==='A')ev.preventDefault();
 const d=t.dataset;
 if(t.id==='evb'){S.evOpen=!S.evOpen;renderSide();return}
 if(d.other){S.evOpen=false;renderSide();toast(`Opens ${d.other}.`);return}
 if(d.soon){toast(SOON[d.soon]||'Drawn in its own mockup.');return}
 if(t.id==='burger'){if(matchMedia('(max-width:1023px)').matches)setDrawer(true);else $('app').classList.toggle('collapsed');return}
 if(t.id==='close'){setDrawer(false);return}
 if(d.mock){S.mode=d.mock;S.page=1;setHash(d.mock);render();return}
 if(t.id==='mhide'){$('app').classList.remove('withmock');$('mock').classList.add('hidden');return}
 if(d.dd){S.dd=S.dd===d.dd?null:d.dd;renderMain();const m=document.querySelector(`[data-ddw="${d.dd}"] .ddo.sel`);if(m)m.focus();else document.querySelector(`[data-dd="${d.dd}"]`).focus();return}
 if(d.ddk){const k=d.ddk,v=d.ddv;S.dd=null;
  if(k==='sort'){S.sort=v;S.dir=1}else if(k==='rpp'){S.rpp=+v}else S[k]=v;
  S.page=1;renderMain();const b=document.querySelector(`[data-dd="${k}"]`);if(b)b.focus();return}
 if(d.sort){if(S.sort===d.sort)S.dir*=-1;else{S.sort=d.sort;S.dir=1}S.page=1;renderMain();const b=document.querySelector(`[data-sort="${d.sort}"]`);if(b)b.focus();return}
 if(d.pg){S.page=+d.pg;renderMain();document.querySelector('#listArea').scrollIntoView({block:'start',behavior:'smooth'});return}
 if(d.unf){if(d.unf==='q')S.q='';else S[d.unf]='all';S.page=1;renderMain();return}
 if(d.eo){S.exp[d.eo]=d.ev;drawDlg();const b=$('dlg').querySelector(`[data-eo="${d.eo}"][data-ev="${d.ev}"]`);if(b)b.focus();return}
 switch(d.a){
  case 'export':openDlg();return;
  case 'close':closeDlg();return;
  case 'download':download();return;
  case 'clear':S.q='';S.st=S.tb=S.gr='all';S.page=1;renderMain();return;
  case 'clrq':S.q='';S.page=1;renderMain();$('q').focus();return;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.page=1;render(true)}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(S.dlg)closeDlg();else if(S.dd){const k=S.dd;S.dd=null;renderMain();document.querySelector(`[data-dd="${k}"]`).focus()}else if(S.evOpen){S.evOpen=false;renderSide();$('evb').focus()}else setDrawer(false)}
 if(S.dd&&(e.key==='ArrowDown'||e.key==='ArrowUp')){const o=[...document.querySelectorAll('.ddm .ddo')],i=o.indexOf(document.activeElement);e.preventDefault();const n=o[(i+(e.key==='ArrowDown'?1:-1)+o.length)%o.length];if(n)n.focus()}
 if(e.key==='Tab'&&S.dlg){const f=[...$('dlg').querySelectorAll('button:not([disabled])')];if(!f.length)return;const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
let h0='';try{h0=location.hash.slice(1)}catch(e){}
S.mode=h0==='await'?'await':'joined';
window.addEventListener('hashchange',()=>{let h='';try{h=location.hash.slice(1)}catch(e){}S.mode=h==='await'?'await':'joined';render()});
render();
}
</script>
</body></html>
