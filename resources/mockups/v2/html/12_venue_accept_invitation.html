<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accept Invitation · Event Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens: copied from tokens.css so this file is self-contained */
:root{
  --color-bg:#f6f7fb;--color-surface:#ffffff;--color-surface-muted:#f8f9fc;--color-border:#e5e8f0;--color-border-strong:#cfd4e2;
  --color-text:#0f1433;--color-text-muted:#5b6480;--color-text-subtle:#626b85;
  --color-primary:#4f46e5;--color-primary-hover:#4338ca;--color-primary-soft:#eef0ff;--color-primary-border:#c9cdfb;--color-on-primary:#ffffff;
  --color-success:#15803d;--color-success-soft:#e6f7ec;--color-success-border:#bde5cb;
  --color-warning:#b45309;--color-warning-soft:#fff4e3;--color-warning-border:#f8d8a4;
  --color-danger:#c81e1e;--color-danger-hover:#a51616;--color-danger-soft:#fdecec;--color-danger-border:#f6c4c4;
  --color-info:#4338ca;--color-info-soft:#eef0ff;--color-info-border:#c9cdfb;
  --color-neutral:#475069;--color-neutral-soft:#eceff5;--color-neutral-border:#d9deea;
  --color-overlay:rgb(15 20 51 / 55%);
  --font-sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Hebrew',Arial,sans-serif;
  --font-size-xs:.75rem;--font-size-sm:.875rem;--font-size-md:1rem;--font-size-lg:1.125rem;--font-size-xl:1.5rem;--font-size-2xl:2rem;
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-pill:999px;
  --shadow-sm:0 1px 2px rgb(15 20 51 / 6%);--shadow-md:0 8px 24px rgb(15 20 51 / 12%);--shadow-bar:0 -4px 16px rgb(15 20 51 / 8%);
  --focus-ring:0 0 0 2px var(--color-surface),0 0 0 4px var(--color-primary);
  --control-height:2.75rem;--control-height-sm:2.25rem;--topbar-height:4rem;--content-max-width:80rem;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);font-size:var(--font-size-md);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--color-primary)}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
h1,h2,h3,p{margin:0}
.ltr{direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block;flex:none}

/* ---------- Top bar ---------- */
.topbar{height:var(--topbar-height);background:var(--color-surface);border-bottom:1px solid var(--color-border);position:sticky;top:0;z-index:20}
.topbar-in{max-width:var(--content-max-width);height:100%;margin:0 auto;padding:0 var(--space-8);display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.logo{display:flex;align-items:center;gap:var(--space-3);font-size:var(--font-size-lg);font-weight:700;text-decoration:none;color:var(--color-text);border-radius:var(--radius-md)}
.logo-mark{width:36px;height:36px;border-radius:var(--radius-md);background:var(--color-primary);color:var(--color-on-primary);display:grid;place-items:center}
.tb-right{display:flex;align-items:center;gap:var(--space-3)}
.dd{position:relative}
.tb-btn{height:var(--control-height);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:var(--radius-md);font-size:var(--font-size-sm);font-weight:500;color:var(--color-text)}
.tb-btn:hover{background:var(--color-surface-muted)}
.tb-btn .muted{color:var(--color-text-muted)}
.lang-btn{border:1px solid var(--color-border)}
.avatar{width:40px;height:40px;border-radius:var(--radius-pill);background:var(--color-primary-soft);color:var(--color-primary);display:grid;place-items:center;font-size:var(--font-size-sm);font-weight:600;flex:none}
.avatar.sm{width:32px;height:32px;font-size:var(--font-size-xs)}
.user-btn{padding:0 var(--space-2) 0 var(--space-1)}
.user-btn .name{font-weight:600}

/* Product dropdown list */
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:220px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:var(--space-1);z-index:30;display:none}
.menu.open{display:block}
.menu.up{top:auto;bottom:calc(100% + 6px)}
.menu.left{right:auto;left:0}
.menu-head{padding:var(--space-2) var(--space-3) var(--space-3);border-bottom:1px solid var(--color-border);margin-bottom:var(--space-1)}
.menu-head b{display:block;font-size:var(--font-size-sm);font-weight:600}
.menu-head span{font-size:var(--font-size-xs);color:var(--color-text-muted)}
.menu-item{width:100%;min-height:40px;display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-3);border-radius:var(--radius-sm);font-size:var(--font-size-sm);text-align:start;color:var(--color-text)}
.menu-item:hover,.menu-item:focus-visible{background:var(--color-surface-muted)}
.menu-item[aria-checked="true"]{color:var(--color-primary);font-weight:600}
.menu-item .chk{margin-inline-start:auto;visibility:hidden}
.menu-item[aria-checked="true"] .chk{visibility:visible}
.menu-item svg{color:var(--color-text-muted)}
.menu-item[aria-checked="true"] svg{color:var(--color-primary)}

/* ---------- Page ---------- */
main{max-width:var(--content-max-width);margin:0 auto;padding:var(--space-10) var(--space-8) 96px}
.layout{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);grid-template-areas:"sum act" "can act";gap:var(--space-6);align-items:start;max-width:1120px;margin:0 auto}
.a-sum{grid-area:sum}.a-act{grid-area:act}.a-can{grid-area:can}
.single{max-width:560px;margin:0 auto}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:var(--space-6)}
.card-title{font-size:var(--font-size-lg);font-weight:600;line-height:1.2}
.card-desc{font-size:var(--font-size-sm);color:var(--color-text-muted);margin-top:var(--space-1)}

/* Event summary */
.cover{height:168px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:linear-gradient(120deg,#16b98a 0%,#2f8fe0 60%,#4f6ff0 100%);position:relative;display:grid;place-items:center;color:#fff}
.cover-badge{position:absolute;top:var(--space-3);left:var(--space-3)}
.sum-body{padding:var(--space-6)}
.eyebrow{display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-sm);color:var(--color-text-muted);font-weight:500}
.eyebrow b{color:var(--color-text);font-weight:600}
.h1{font-size:var(--font-size-2xl);font-weight:700;line-height:1.2;margin-top:var(--space-2)}
.details{list-style:none;margin:var(--space-5) 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4) var(--space-6)}
.details li{display:flex;gap:var(--space-3);align-items:flex-start;min-width:0}
.details .ic{width:40px;height:40px;border-radius:var(--radius-pill);background:var(--color-primary-soft);color:var(--color-primary);display:grid;place-items:center;flex:none}
.details small{display:block;font-size:var(--font-size-xs);color:var(--color-text-subtle)}
.details span{font-weight:500;overflow-wrap:anywhere}
.inviter{display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-6);padding-top:var(--space-5);border-top:1px solid var(--color-border);font-size:var(--font-size-sm);color:var(--color-text-muted);flex-wrap:wrap}
.inviter b{color:var(--color-text);font-weight:600}
.inviter .exp{margin-inline-start:auto;display:flex;align-items:center;gap:var(--space-2)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:var(--space-1);height:24px;padding:0 10px;border-radius:var(--radius-pill);font-size:var(--font-size-xs);font-weight:600;border:1px solid transparent;white-space:nowrap}
.b-info{background:var(--color-info-soft);color:var(--color-info);border-color:var(--color-info-border)}
.b-success{background:var(--color-success-soft);color:var(--color-success);border-color:var(--color-success-border)}
.b-warning{background:var(--color-warning-soft);color:var(--color-warning);border-color:var(--color-warning-border)}

/* What you can do */
.can-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);margin-top:var(--space-5)}
.can-item{display:flex;gap:var(--space-3)}
.can-item .ic{width:40px;height:40px;border-radius:var(--radius-pill);background:var(--color-primary-soft);color:var(--color-primary);display:grid;place-items:center;flex:none}
.can-item b{display:block;font-size:var(--font-size-sm);font-weight:600}
.can-item span{font-size:var(--font-size-sm);color:var(--color-text-muted)}

/* Notices */
.notice{display:flex;gap:var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid;border-radius:var(--radius-md);font-size:var(--font-size-sm)}
.notice svg{margin-top:1px}
.notice b{display:block;font-weight:600}
.notice p{color:var(--color-text)}
.n-info{background:var(--color-info-soft);border-color:var(--color-info-border);color:var(--color-info)}
.n-warning{background:var(--color-warning-soft);border-color:var(--color-warning-border);color:var(--color-warning)}
.mt5{margin-top:var(--space-5)}.mt4{margin-top:var(--space-4)}.mt6{margin-top:var(--space-6)}.mt3{margin-top:var(--space-3)}

/* Account box */
.acct{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);background:var(--color-surface-muted);border:1px solid var(--color-border);border-radius:var(--radius-md);margin-top:var(--space-5)}
.acct-txt{min-width:0;flex:1}
.acct-txt small{display:block;font-size:var(--font-size-xs);color:var(--color-text-subtle)}
.acct-txt b{display:block;font-size:var(--font-size-sm);font-weight:600}
.acct-txt span{display:block;font-size:var(--font-size-sm);color:var(--color-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Buttons */
.btn{height:var(--control-height);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);padding:0 var(--space-5);border-radius:var(--radius-md);font-size:var(--font-size-sm);font-weight:600;border:1px solid transparent;white-space:nowrap;text-decoration:none;transition:background .15s}
.btn-lg{height:52px;font-size:var(--font-size-md)}
.btn-block{width:100%}
.btn-primary{background:var(--color-primary);color:var(--color-on-primary)}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-secondary{background:var(--color-surface);color:var(--color-primary);border-color:var(--color-primary-border)}
.btn-secondary:hover{border-color:var(--color-primary)}
.btn-ghost{color:var(--color-text-muted)}
.btn-ghost:hover{background:var(--color-surface-muted)}
.btn[aria-busy="true"]{opacity:.85;pointer-events:none}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.link{color:var(--color-primary);font-weight:600;font-size:var(--font-size-sm);border-radius:var(--radius-sm);text-decoration:none}
.link:hover{text-decoration:underline}
.btn-row{display:flex;gap:var(--space-3);justify-content:flex-end;margin-top:var(--space-6)}
.center-note{text-align:center;font-size:var(--font-size-sm);color:var(--color-text-muted);margin-top:var(--space-4)}
.exp-line{display:flex;align-items:center;justify-content:center;gap:var(--space-2);font-size:var(--font-size-xs);color:var(--color-text-subtle);margin-top:var(--space-3)}

/* Segmented tabs */
.seg-tabs{display:flex;background:var(--color-surface-muted);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-1);gap:var(--space-1);margin-top:var(--space-5)}
.seg-tabs button{flex:1;height:var(--control-height-sm);border-radius:var(--radius-sm);font-size:var(--font-size-sm);font-weight:500;color:var(--color-text-muted)}
.seg-tabs button[aria-selected="true"]{background:var(--color-primary);color:var(--color-on-primary);font-weight:600}

/* Form fields */
.form{margin-top:var(--space-5);display:grid;gap:var(--space-4)}
.field label,.lrow{font-size:var(--font-size-sm);font-weight:500;display:block;margin-bottom:var(--space-2)}
.lrow{display:flex;justify-content:space-between;align-items:baseline}
.lrow label{margin:0}
.input-wrap{position:relative}
.input{width:100%;height:var(--control-height);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:0 var(--space-3);font-size:var(--font-size-md)}
.input:hover{border-color:var(--color-border-strong)}
.input:focus-visible{border-color:var(--color-primary)}
.input.err{border-color:var(--color-danger)}
.input.pw{padding-right:48px}
.eye{position:absolute;right:4px;top:4px;width:36px;height:36px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--color-text-muted)}
.eye:hover{background:var(--color-surface-muted)}
.help{font-size:var(--font-size-xs);color:var(--color-text-muted);margin-top:var(--space-2);display:flex;gap:var(--space-1);align-items:flex-start}
.help.e{color:var(--color-danger)}
.help.w{color:var(--color-warning)}
.help svg{margin-top:1px}
.caption{font-size:var(--font-size-xs);color:var(--color-text-muted);text-align:center}

/* Status (error, success) pages */
.status-card{text-align:center;padding:var(--space-10) var(--space-8) var(--space-8)}
.big-ic{width:64px;height:64px;border-radius:var(--radius-pill);display:grid;place-items:center;margin:0 auto var(--space-5)}
.t-warning{background:var(--color-warning-soft);color:var(--color-warning)}
.t-danger{background:var(--color-danger-soft);color:var(--color-danger)}
.t-success{background:var(--color-success-soft);color:var(--color-success)}
.t-info{background:var(--color-info-soft);color:var(--color-info)}
.t-primary{background:var(--color-primary-soft);color:var(--color-primary)}
.status-card .h1{font-size:28px;margin:0}
.status-card .lead{color:var(--color-text-muted);margin-top:var(--space-3)}
.status-card .btn-row{justify-content:center}
.mini{display:flex;gap:var(--space-4);align-items:center;text-align:start;padding:var(--space-4);background:var(--color-surface-muted);border:1px solid var(--color-border);border-radius:var(--radius-md);margin-top:var(--space-6)}
.mini-cover{width:64px;height:64px;border-radius:var(--radius-md);background:linear-gradient(120deg,#16b98a 0%,#2f8fe0 60%,#4f6ff0 100%);display:grid;place-items:center;color:#fff;flex:none}
.mini b{display:block;font-weight:600}
.mini .meta{display:block;font-size:var(--font-size-sm);color:var(--color-text-muted)}
.mini .badge{margin-top:var(--space-2);white-space:normal;height:auto;min-height:24px;padding:2px 10px}
.contact{display:flex;gap:var(--space-3);align-items:center;text-align:start;padding:var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-md);margin-top:var(--space-6)}
.contact div{min-width:0}
.contact b{display:block;font-size:var(--font-size-sm);font-weight:600}
.contact div>span{display:block;font-size:var(--font-size-sm);color:var(--color-text-muted)}
.contact a{font-size:var(--font-size-sm);font-weight:500}
.steps{list-style:none;margin:var(--space-6) 0 0;padding:0;text-align:start;border:1px solid var(--color-border);border-radius:var(--radius-md)}
.steps-h{font-size:var(--font-size-sm);font-weight:600;text-align:start;margin-top:var(--space-6)}
.steps li+li{border-top:1px solid var(--color-border)}
.steps button{width:100%;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);text-align:start;border-radius:var(--radius-md)}
.steps button:hover{background:var(--color-surface-muted)}
.steps .ic{width:36px;height:36px;border-radius:var(--radius-pill);background:var(--color-primary-soft);color:var(--color-primary);display:grid;place-items:center;flex:none}
.steps b{display:block;font-size:var(--font-size-sm);font-weight:600}
.steps span{display:block;font-size:var(--font-size-xs);color:var(--color-text-muted)}
.steps .chev{margin-inline-start:auto;color:var(--color-text-muted)}

/* Phone bottom action bar */
.bbar{display:none}
/* Toast */
.toast{position:fixed;right:var(--space-6);bottom:88px;z-index:50;display:flex;align-items:center;gap:var(--space-3);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:var(--space-3) var(--space-4);font-size:var(--font-size-sm);font-weight:500;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast svg{color:var(--color-success)}

/* ---------- Mockup state switcher (not part of the product) ---------- */
.mock>span{white-space:nowrap}
.mock{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;display:flex;align-items:center;gap:var(--space-2);background:#fff;border:1px dashed var(--color-border-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:6px 6px 6px 14px;font-size:var(--font-size-xs);color:var(--color-text-muted)}
.mock-seg{display:flex;gap:4px}
.mock-seg button{height:32px;padding:0 10px;border-radius:var(--radius-md);font-size:var(--font-size-xs);font-weight:500;color:var(--color-text-muted);white-space:nowrap}
.mock-seg button:hover{background:var(--color-surface-muted)}
.mock-seg button[aria-pressed="true"]{background:var(--color-primary);color:#fff;font-weight:600}
.mock-dd{display:none}
.mock-dd .tb-btn{height:36px;border:1px solid var(--color-border);font-size:var(--font-size-xs)}
.mock .hx{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--radius-md);color:var(--color-text-muted)}
.mock .hx:hover{background:var(--color-surface-muted)}
.mock-show{position:fixed;right:12px;bottom:12px;z-index:40;width:32px;height:32px;border-radius:var(--radius-pill);background:#fff;border:1px dashed var(--color-border-strong);color:var(--color-text-muted);display:none;place-items:center;opacity:.5}
.mock-show:hover{opacity:1}
body.mock-hidden .mock{display:none}
body.mock-hidden .mock-show{display:grid}
body.mock-hidden .toast{bottom:var(--space-6)}

/* ---------- Compact: below 1024px, one column ---------- */
@media (max-width:1023px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"sum" "act" "can";max-width:560px}
  .mock-seg{display:none}
  .mock-dd{display:block}
}
/* ---------- Phone: below 768px ---------- */
@media (max-width:767px){
  .topbar-in{padding:0 var(--space-4)}
  .logo-text{display:none}
  .lang-btn .lbl,.user-btn .name,.user-btn .chev{display:none}
  .user-btn{padding:0}
  main{padding:var(--space-4) var(--space-4) 96px}
  body.has-bbar main{padding-bottom:168px}
  .acct{flex-wrap:wrap}
  .acct-txt span{white-space:normal;overflow-wrap:anywhere}
  .card-pad,.sum-body{padding:var(--space-4)}
  .cover{height:132px;padding-top:var(--space-6)}
  .cover>svg{width:40px;height:40px}
  .h1{font-size:28px}
  .details{grid-template-columns:1fr;gap:var(--space-3)}
  .inviter .exp{margin-inline-start:0;width:100%}
  .can-grid{grid-template-columns:1fr;gap:var(--space-4)}
  .status-card{padding:var(--space-8) var(--space-4) var(--space-4)}
  .status-card .h1{font-size:24px}
  .status-card .btn-row{flex-direction:column-reverse}
  .status-card .btn-row .btn{width:100%}
  .desk-only{display:none !important}
  .bbar{display:flex;gap:var(--space-3);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--color-surface);box-shadow:var(--shadow-bar);padding:var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom))}
  .bbar .btn{flex:1;min-width:0}
  body:not(.has-bbar) .bbar{display:none}
  .toast{left:var(--space-4);right:var(--space-4);bottom:136px}
  body.has-bbar .toast{bottom:144px}
  .mock{left:var(--space-2);right:var(--space-2);transform:none;justify-content:space-between;padding:6px}
  .mock>span{display:none}
  body.has-bbar .mock{bottom:84px}
  body.has-bbar.mock-hidden .mock-show{bottom:84px}
  body.mock-hidden .toast{bottom:var(--space-4)}
  body.mock-hidden.has-bbar .toast{bottom:84px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="#" onclick="return false" aria-label="Event Planner home">
      <span class="logo-mark" id="logoMark"></span><span class="logo-text">Event Planner</span>
    </a>
    <div class="tb-right" id="tbRight"></div>
  </div>
</header>

<main id="main" aria-live="polite"></main>

/* ---------- Action card variants ---------- */
function actMatch(){

function emailHelp(){
  const v=S.form.email.trim().toLowerCase();
  if(S.err.email) return `<p class="help e" id="emailHelp">${I('info',14)}${S.err.email}</p>`;
  if(v && v!==D.email) return `<p class="help w" id="emailHelp">${I('alert',14)}<span>This invitation is for ${E(D.email)}. Another email can't accept it.</span></p>`;
  return `<p class="help" id="emailHelp">Filled in from your invitation.</p>`;
}
function actSignedOut(){
  if(S.verify) return `<section class="card card-pad a-act" aria-labelledby="actT" style="text-align:center">
    <div class="big-ic t-primary" style="margin-top:var(--space-2)">${I('mail',28)}</div>

  return `<section class="card card-pad a-act" aria-labelledby="actT">
   <h2 class="card-title" id="actT">Sign In to Accept</h2>
   <p class="card-desc">This invitation is for ${E(D.email)}. Sign in or create an account with this email to accept it.</p>
   <div class="seg-tabs" role="tablist" aria-label="Account">
     <button role="tab" aria-selected="${si}" data-tab="signin">Sign in</button>
     <button role="tab" aria-selected="${!si}" data-tab="signup">Create account</button></div>
   <form class="form" id="authForm" novalidate>
     ${si?'':`<div class="field"><label for="fName">Full Name</label>
       <input class="input${S.err.name?' err':''}" id="fName" autocomplete="name" value="${esc(S.form.name)}" placeholder="Your name" aria-describedby="nameHelp">
       ${S.err.name?`<p class="help e" id="nameHelp">${I('info',14)}${S.err.name}</p>`:''}</div>`}
     <div class="field"><label for="fEmail">Email</label>
       <input class="input ltr${S.err.email?' err':''}" id="fEmail" type="email" autocomplete="email" value="${esc(S.form.email)}" aria-describedby="emailHelp">
       ${emailHelp()}</div>
     <div class="field">
       <div class="lrow"><label for="fPw">Password</label>${si?'<a class="link" href="#" onclick="return false">Forgot password?</a>':''}</div>
       <div class="input-wrap"><input class="input pw${S.err.pw?' err':''}" id="fPw" type="${S.form.showPw?'text':'password'}" autocomplete="${si?'current-password':'new-password'}" value="${esc(S.form.pw)}" aria-describedby="pwHelp">
         <button type="button" class="eye" data-act="togglePw" aria-label="${S.form.showPw?'Hide':'Show'} password">${I(S.form.showPw?'eyeOff':'eye',18)}</button></div>
       ${S.err.pw?`<p class="help e" id="pwHelp">${I('info',14)}${S.err.pw}</p>`:si?'':'<p class="help" id="pwHelp">At least 8 characters.</p>'}</div>
     <button type="submit" class="btn btn-primary btn-lg btn-block desk-only" data-submit>${si?'Sign in':'Create account'}</button>
     <p class="caption">${si?'After you sign in, you can review the invitation and accept it.':'We\'ll email you a link to verify your address. Then you can accept the invitation.'}</p>
   </form>
  </section>`;
}
function actOther(){
  const o=D.other;
  return `<section class="card card-pad a-act" aria-labelledby="actT">
   <h2 class="card-title" id="actT">Accept Invitation</h2>
   <div class="acct"><span class="avatar">${o.ini}</span>

   <div class="notice n-warning mt4">${I('alert',20)}<div><b>This invitation is for another email</b>

   <p class="card-desc mt4">Switch to the account that uses ${E(D.email)}, or create one with that email. If the invitation should go to ${E(o.email)}, ask ${esc(D.inviter)} at ${esc(D.venue)} to send a new one: <a href="mailto:${D.inviterEmail}" onclick="return false">${E(D.inviterEmail)}</a>.</p>

/* ---------- Status pages ---------- */
const contact=()=>`<div class="contact"><span class="avatar">AG</span><div><b>${esc(D.inviter)}, ${esc(D.venue)}</b><span>Your contact at the venue</span>
  <a href="mailto:${D.inviterEmail}" onclick="return false">${E(D.inviterEmail)}</a></div></div>`;
const STATUS={
 expired:()=>`<section class="card status-card single">
   <div class="big-ic t-warning">${I('calX',28)}</div>
   <h1 class="h1">This Invitation Has Expired</h1>

 used:()=>`<section class="card status-card single">
   <div class="big-ic t-info">${I('circleCheck',28)}</div>

 success:()=>`<section class="card status-card single">

   <h2 class="steps-h">Next Steps</h2>

/* ---------- Phone bottom bar ---------- */
function renderBbar(){
  let h='';
  if(S.st==='match') h=`<button class="btn btn-primary btn-lg" data-act="accept">${I('check',18)}Accept invitation</button>`;
  else if(S.st==='signedout'&&!S.verify) h=`<button class="btn btn-primary btn-lg" data-act="submitForm">${S.tab==='signin'?'Sign in':'Create account'}</button>`;
  else if(S.st==='other') h=`<button class="btn btn-secondary btn-lg" data-act="myevents">My Events</button><button class="btn btn-primary btn-lg" data-act="switch">Switch account</button>`;
  $('bbar').innerHTML=h;
  document.body.classList.toggle('has-bbar',!!h);
}

/* ---------- Render ---------- */
function render(focusId){
  renderTop();
  const m=$('main');
  if(STATUS[S.st]) m.innerHTML=STATUS[S.st]();
  else m.innerHTML=`<div class="layout">${summary()}${S.st==='match'?actMatch():S.st==='signedout'?actSignedOut():actOther()}${canDo()}</div>`;
  renderBbar();
  renderMock();
  document.title=(S.st==='success'?'Invitation Accepted':STATUS[S.st]?'Invitation Unavailable':'Accept Invitation')+' · Event Planner';
  if(focusId&&$(focusId)){const el=$(focusId);el.focus();if(el.setSelectionRange&&el.type!=='email'){const n=el.value.length;el.setSelectionRange(n,n)}}
}
function go(st,toast){
  S.st=st;S.verify=false;S.err={};
  if(st==='signedout'){S.form={email:D.email,pw:'',name:'',showPw:false}}
  render();
  history.replaceState(null,'','#'+st);
  window.scrollTo({top:0});
  if(toast) showToast(toast);
}

/* ---------- Mockup switcher ---------- */
function renderMock(){
  $('mockSeg').innerHTML=STATES.map(([k,l])=>`<button aria-pressed="${k===S.st}" data-mock="${k}">${l}</button>`).join('');
  const cur=STATES.find(s=>s[0]===S.st)[1];
  $('mockDdBtn').innerHTML=`State: <b style="font-weight:600">${cur}</b>${I('chevDown',16)}`;
  $('mockMenu').innerHTML=STATES.map(([k,l])=>`<button class="menu-item" role="menuitemradio" aria-checked="${k===S.st}" data-mock="${k}">${l}${I('check',16,'chk')}</button>`).join('');
  $('mockHide').innerHTML=I('x',16);
  $('mockShow').innerHTML=I('sliders',16);
}

/* ---------- Toast ---------- */
let tt;
function showToast(msg){
  const t=$('toast');t.innerHTML=I('circleCheck',18)+esc(msg);t.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800);
}

/* ---------- Dropdowns ---------- */
function closeMenus(except){
  document.querySelectorAll('.menu.open').forEach(mn=>{if(mn!==except){mn.classList.remove('open');const b=document.querySelector(`[data-dd="${mn.id}"]`)||(mn.id==='mockMenu'&&$('mockDdBtn'));b&&b.setAttribute('aria-expanded','false')}});
}
function toggleMenu(btn,menu){
  const open=!menu.classList.contains('open');closeMenus();
  menu.classList.toggle('open',open);btn.setAttribute('aria-expanded',open);
  if(open){const f=menu.querySelector('.menu-item');f&&f.focus()}
}

/* ---------- Busy button helper ---------- */
function busy(label,then){
  document.querySelectorAll('[data-act="accept"],[data-submit],[data-act="submitForm"]').forEach(b=>{
    b.setAttribute('aria-busy','true');b.innerHTML=I('loader',18,'spin')+label});
  setTimeout(then,900);
}

/* ---------- Form ---------- */
function submitForm(){
  const si=S.tab==='signin', f=S.form, e={};
  const v=f.email.trim().toLowerCase();
  if(!v) e.email='Enter your email.';
  else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) e.email='Enter a valid email, like name@example.com.';
  if(!si&&!f.name.trim()) e.name='Enter your name.';
  if(!f.pw) e.pw=si?'Enter your password.':'Create a password.';
  else if(!si&&f.pw.length<8) e.pw='Use at least 8 characters.';
  S.err=e;
  if(Object.keys(e).length){render(e.name&&!si?'fName':e.email?'fEmail':'fPw');return}
  if(si){
    busy('Signing in…',()=>{
      if(v===D.email) go('match','Signed in as '+D.client+'.');
      else {S.form.email=v;S.st='other';S.err={};render();history.replaceState(null,'','#other');showToast('Signed in.')}
    });
  } else busy('Creating account…',()=>{S.verify=true;S.err={};render()});
}

/* ---------- Events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,a');
  if(!t){closeMenus();return}
  if(t.dataset.dd){toggleMenu(t,$(t.dataset.dd));return}
  if(t.id==='mockDdBtn'){toggleMenu(t,$('mockMenu'));return}
  if(t.dataset.mock){closeMenus();go(t.dataset.mock);return}
  if(t.dataset.lang){S.lang=t.dataset.lang;closeMenus();render();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;S.err={};render();return}
  if(t.id==='mockHide'||t.id==='mockShow'){document.body.classList.toggle('mock-hidden');return}
  const a=t.dataset.act; if(!a){closeMenus();return}
  closeMenus();
  switch(a){
    case 'accept': busy('Accepting…',()=>go('success','Invitation accepted.'));break;
    case 'switch': go('signedout','You\'re signed out. Sign in with '+D.email+'.');break;
    case 'logout': go('signedout','You\'re signed out.');break;
    case 'toSignin': go('signedout');break;
    case 'myevents': showToast('Opens My Events.');break;
    case 'openEvent': showToast('Opens the event Dashboard.');break;
    case 'togglePw': S.form.showPw=!S.form.showPw;render('fPw');break;
    case 'submitForm': submitForm();break;
    case 'backToForm': S.verify=false;render();break;
    case 'resend': showToast('We sent the verification email again.');break;
  }
});
document.addEventListener('submit',ev=>{ev.preventDefault();submitForm()});
document.addEventListener('input',ev=>{
  const id=ev.target.id;
  if(id==='fEmail'){S.form.email=ev.target.value;delete S.err.email;
    const h=$('emailHelp');h.outerHTML=emailHelp();ev.target.classList.remove('err')}
  if(id==='fPw'){S.form.pw=ev.target.value;if(S.err.pw){delete S.err.pw;ev.target.classList.remove('err');const h=$('pwHelp');h&&(h.remove())}}
  if(id==='fName'){S.form.name=ev.target.value;if(S.err.name){delete S.err.name;ev.target.classList.remove('err');const h=$('nameHelp');h&&h.remove()}}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape') closeMenus();
  if((ev.key==='h'||ev.key==='H')&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)) document.body.classList.toggle('mock-hidden');
  const mn=document.querySelector('.menu.open');
  if(mn&&(ev.key==='ArrowDown'||ev.key==='ArrowUp')){
    ev.preventDefault();const it=[...mn.querySelectorAll('.menu-item')];const i=it.indexOf(document.activeElement);
    it[(i+(ev.key==='ArrowDown'?1:-1)+it.length)%it.length].focus();
  }
});

$('logoMark').innerHTML=I('logo',20);
const h=location.hash.slice(1);
S.st=STATES.some(s=>s[0]===h)?h:'match';
render();
</script>
</body>
