<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: the existing Event Planner product, no new styling
   IDEA: a faithful product screen for screenshotting
   PICTURE: the screen itself
   COLOUR and TYPE: DESIGN_GUIDE.md tokens, Inter
   LAYOUT: fixed-width frames, one per state */
:root{color-scheme:light;--bg:#F6F7FB;--sf:#fff;--sfm:#F8F9FC;--bd:#E5E8F0;--bds:#CFD4E2;--tx:#0F1433;--mu:#5B6480;--sb:#626B85;--pr:#4F46E5;--prh:#4338CA;--prs:#EEF0FF;--prb:#C9CDFB;--nv1:#0F1535;--nv2:#151C47;--nvr:#1B2350;--nvb:#262E5C;--nvt:#F1F3FB;--nvm:#B4BBD6;--sh:0 1px 2px rgb(15 20 51/6%);--shm:0 8px 24px rgb(15 20 51/12%);--shb:0 -4px 16px rgb(15 20 51/8%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--tx);background:#DCDFE8;overflow-x:auto}
ul{list-style:none}a{text-decoration:none;color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.i{flex:none;display:block}
.state{padding:24px 16px 8px;font-size:14px;color:var(--mu);font-weight:500}
.state b{color:var(--tx)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--pr);color:#fff}
.btn.sec{background:#fff;color:var(--pr);border:1px solid var(--prb)}
.btn.sm{height:36px;padding:0 14px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.success{color:#15803D;background:#E6F7EC;border-color:#BDE5CB}
.warning{color:#B45309;background:#FFF4E3;border-color:#F8D8A4}
.info{color:#4338CA;background:#EEF0FF;border-color:#C9CDFB}
.neutral{color:#475069;background:#ECEFF5;border-color:#D9DEEA}
/* sidebar */
.side{background:linear-gradient(180deg,var(--nv1),var(--nv2));color:var(--nvt);display:flex;flex-direction:column;padding:16px}
.logo{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;padding:4px 8px 0}
.logo .mk{width:32px;height:32px;border-radius:8px;background:var(--pr);display:grid;place-items:center;color:#fff}
.ws{position:relative;margin-top:20px}
.wsbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--nvr);border:1px solid var(--nvb);text-align:start;color:var(--nvt)}
.wsbtn.open{border-color:var(--nvm)}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.tile.v{background:linear-gradient(135deg,#6366F1,#4F46E5)}
.tile.p{background:var(--prs);color:var(--pr)}
.wsbtn .nm{font-size:14px;font-weight:600;line-height:1.3}
.wsbtn .sub{font-size:12px;color:var(--nvm)}
.wsbtn .grow{flex:1}
.wsbtn .i:last-child{color:var(--nvm)}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--nvm);text-decoration:none}
.nav a.on{background:var(--nvr);color:var(--nvt);font-weight:600}
.navlbl{font-size:12px;color:var(--nvm);padding:20px 12px 4px}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.lang{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--nvb);background:var(--nvr);font-size:14px}
.lang span{flex:1}
.out{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;font-size:14px;color:var(--nvm)}
/* switcher menu */
.menu{position:absolute;left:0;top:calc(100% + 8px);width:280px;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:5}
.menu h4{font-size:12px;font-weight:500;color:var(--mu);padding:8px 12px 4px}
.mi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;width:100%;text-align:start}
.mi.sel{background:var(--prs)}
.mi .tx{flex:1}
.mi .nm{font-size:14px;font-weight:600;line-height:1.3}
.mi .sub{font-size:12px;color:var(--mu)}
.mi .ck{color:var(--pr)}
.menu .note{border-top:1px solid var(--bd);margin:8px 4px 0;padding:12px 8px 4px;font-size:12px;color:var(--sb)}
/* top bar */
.top{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px}
.ibtn{width:44px;height:44px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--tx)}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--mu)}
.bell em{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:#C81E1E;color:#fff;font-size:11px;font-weight:600;font-style:normal;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.av{width:40px;height:40px;border-radius:50%;background:var(--prs);color:var(--pr);font-size:14px;font-weight:600;display:grid;place-items:center;flex:none}
/* tabs */
.seg{display:flex;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px}
.seg button{height:36px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mu);display:flex;align-items:center;gap:8px;justify-content:center}
.seg button.on{background:var(--pr);color:#fff;font-weight:600}
.cnt{min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--neutral-soft,#ECEFF5);color:#475069;font-size:12px;font-weight:600;display:grid;place-items:center}
.on .cnt{background:#fff;color:var(--pr)}
.field{height:44px;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;color:var(--sb)}
.field.dd{color:var(--tx);font-weight:500}
.field.dd .i{color:var(--mu)}
.field.dd span{flex:1}
.vt{display:flex;border:1px solid var(--bd);border-radius:10px;background:#fff;padding:4px;gap:4px}
.vt button{width:36px;height:34px;border-radius:6px;display:grid;place-items:center;color:var(--mu)}
.vt .on{background:var(--prs);color:var(--pr)}
/* card bits */
.meta{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mu)}
.meta li{display:flex;align-items:center;gap:8px}
.meta .i{color:var(--sb)}
.await{color:#B45309;font-weight:500}
.prog .pl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.bar{height:6px;border-radius:999px;background:var(--bd);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pr);border-radius:999px}
.hint{font-size:12px;color:var(--sb);line-height:1.5}
.dots{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--tx);box-shadow:var(--sh)}
</style></head><body>
<style>
body{background:var(--bg)}
:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30}
.app.collapsed .side{display:none}
.dh{display:flex;align-items:center;justify-content:space-between}
.xb{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--nvb);place-items:center;color:var(--nvt)}
.menu{width:100%;min-width:216px}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{padding:0 32px;position:sticky;top:0;z-index:10}
.top .mk{display:none;width:40px;height:40px;border-radius:10px;background:var(--pr);place-items:center;color:#fff}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}
.who .i{color:var(--mu)}
.content{padding:24px 32px 40px;width:100%;max-width:1344px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.ph h1{font-size:32px;line-height:1.2;font-weight:700}
.ph p{color:var(--mu);margin-top:4px}
.cta2{display:none}
.tools{display:flex;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.tools .sp{flex:1}
.ddw{position:relative;width:200px}
.ddw .field{width:100%;cursor:pointer}
.ddw .menu{left:auto;right:0;width:100%}
.opt{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 12px;border-radius:10px;font-size:14px;text-align:start}
.opt span{flex:1}.opt.sel{background:var(--prs);color:var(--pr);font-weight:600}
.opt:hover,.mi:hover{background:var(--sfm)}.opt.sel:hover,.mi.sel:hover{background:var(--prs)}
.srch{width:300px}
.srch input{border:0;outline:0;font:inherit;font-size:14px;color:var(--tx);flex:1;min-width:0;background:none;height:100%}
.srch:focus-within{border-color:var(--pr)}
.sbtn{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--prb);background:#fff;color:var(--pr);place-items:center;flex:none}
/* cards */
.cards{margin-top:24px}
.cards.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.cards.list{display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.cov{height:152px;position:relative;display:grid;place-items:center;color:#fff;flex:none}
.cov>.badge{position:absolute;top:12px;left:12px}
.cov .dots{position:absolute;top:12px;right:12px}
.cb{padding:20px;display:flex;flex-direction:column;gap:16px;flex:1;min-width:0}
.ttl{display:flex;gap:8px;align-items:flex-start}
.ttl h3{flex:1;font-size:18px;font-weight:600;line-height:1.3}
.ttl .i,.bb{display:none}
.ttl .i{color:var(--mu);margin-top:2px}
.cb>.btn{align-self:flex-start;margin-top:auto}
.list .card{flex-direction:row;padding:12px;gap:4px}
.list .cov{width:240px;height:auto;min-height:176px;border-radius:10px}
.list .cov>.badge{display:none}
.list .cb{padding:4px 16px 4px 12px;gap:10px}
.list .ttl .i,.list .bb{display:inline-flex}
.list .bb{align-self:flex-start}
.list .cb>.btn{display:none}
.list .meta{gap:4px}
.empty{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:40px 20px;text-align:center;margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.empty .ic{width:48px;height:48px;border-radius:50%;background:var(--prs);color:var(--pr);display:grid;place-items:center}
.toast{position:fixed;right:24px;bottom:24px;background:var(--tx);color:#fff;font-size:14px;padding:12px 16px;border-radius:10px;box-shadow:var(--shm);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:none}
.hidden{display:none!important}
@media (min-width:768px) and (max-width:1199px){.tools .sp{flex-basis:100%;height:0}.srch{flex:1;width:auto}}
/* compact: drawer */
@media (max-width:1023px){
 .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(320px,85vw);transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shm)}
 .app.collapsed .side{display:flex}
 .app.drawer .side{transform:none}
 .scrim{display:block;position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
 .app.drawer .scrim{opacity:1;pointer-events:auto}
 .xb,.top .mk{display:grid}
 .top{padding:0 16px;gap:12px}
}
/* phone */
@media (max-width:767px){
 .who .nm,.who .i{display:none}
 .content{padding:24px 16px 32px}
 .ph h1{font-size:28px}
 .ph .btn{display:none}
 .cta2{display:flex;width:100%;margin-top:16px}
 .tools{margin-top:20px;gap:8px}
 .seg{width:100%}.seg button{flex:1 1 0;padding:0 6px;gap:6px;white-space:nowrap}
 .tools .sp{display:none}
 .ddw{flex:1;width:auto}
 .ddw .menu{left:0;right:auto}
 .sbtn{display:grid}
 .srch{display:none;order:9;width:100%}
 .app.searching .srch{display:flex}
 .cards{margin-top:20px}.cards.grid{gap:16px}
 .list .card{padding:16px;gap:16px}
 .list .cov{width:96px;min-height:150px}
 .list .cb{padding:0;gap:10px}
 .list .ttl h3,.grid .ttl h3{font-size:16px}
 .cb{padding:16px}.list .cb{padding:0}
 .toast{left:16px;right:16px;bottom:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 await:{t:'Awaiting client',c:'warning',i:'clock'},
 sent:{t:'Invitation sent',c:'info',i:'mail'},
 expired:{t:'Invitation expired',c:'warning',i:'alert'},
 joined:{t:'Client joined',c:'success',i:'ccheck'},
 past:{t:'Past',c:'neutral',i:'hist'}};
const EVENTS=[
 {n:"Dana & Yossi's Wedding",d:'Dec 17, 2026',t:'19:30',sp:'Main Hall',cl:'Dana Levi',max:350,st:'joined',conf:212,cov:'b',ic:'glass'},
 {n:'Cohen Bar Mitzvah',d:'Jan 8, 2027',t:'18:00',sp:'Garden',cl:'Rachel Cohen',max:180,st:'sent',sent:'Nov 24',cov:'c',ic:'cake'},
 {n:"Noa & Amit's Wedding",d:'Feb 11, 2027',t:'19:00',sp:'Main Hall',cl:null,max:400,st:'await',cov:'a',ic:'glass'},
 {n:'Peretz Engagement Party',d:'Jan 28, 2027',t:'20:30',sp:'Garden',cl:'Yael Peretz',max:150,st:'expired',exp:'Nov 20',cov:'b',ic:'glass'},
 {n:'Brightline Year-End Party',d:'Mar 4, 2027',t:'20:00',sp:'Garden',cl:'Tal Mizrahi',max:220,st:'joined',conf:96,cov:'c',ic:'brief'},
 {n:"Shira & Ben's Wedding",d:'Oct 22, 2026',t:'19:00',sp:'Main Hall',cl:'Shira Katz',max:300,st:'past',conf:268,cov:'a',ic:'glass'},
 {n:"Miriam's 60th Birthday",d:'Sep 10, 2026',t:'12:30',sp:'Garden',cl:'Miriam Levi',max:120,st:'past',conf:104,cov:'b',ic:'cake'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=k=>{const s=ST[k];return `<span class="badge ${s.c}">${I(s.i,12)}${s.t}</span>`};
const clientLine=e=>e.cl?`<li>${I('user',16)}<span>Client: ${esc(e.cl)}</span></li>`:`<li>${I('user',16)}<span class="await">Awaiting client</span></li>`;
const progress=e=>{
 if(e.conf!=null){const p=Math.round(e.conf/e.max*100);return `<div class="prog"><div class="pl"><span>${e.conf} confirmed</span><span>${e.max} capacity</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}
 if(e.st==='expired')return `<p class="hint">Invitation expired on ${e.exp}. Resend it from the event's Permissions page.</p>`;
 if(e.st==='sent')return `<p class="hint">Invitation sent on ${e.sent}. Guests appear once the client accepts.</p>`;
 return `<p class="hint">No client invited yet. Invite one from the event's Permissions page.</p>`};

const WS=[{n:'Grand Garden Hall',r:'Owner'},{n:'Seaside Terrace',r:'Manager'}];
const wsMenu=(cur)=>`<div class="menu" role="listbox" aria-label="Switch workspace"><h4>Switch workspace</h4>
<button class="mi" role="option" aria-selected="false"><span class="tile p">${I('user',20)}</span><span class="tx"><span class="nm" style="display:block">Personal</span><span class="sub">Your own events</span></span></button>
${WS.map(w=>`<button class="mi${w.n===cur?' sel':''}" role="option" aria-selected="${w.n===cur}"><span class="tile v">${I('bld',20)}</span><span class="tx"><span class="nm" style="display:block">${esc(w.n)}</span><span class="sub">${w.r}</span></span>${w.n===cur?`<span class="ck">${I('check',18)}</span>`:''}</button>`).join('')}</div>`;
const wsButton=(open,name,role,cls='')=>`<button class="wsbtn${open?' open':''}" aria-haspopup="listbox" aria-expanded="${open}"><span class="tile v">${I('bld',20)}</span><span class="grow"><span class="nm" style="display:block">${esc(name)}</span><span class="sub">Venue · ${role}</span></span>${I('updown',18)}</button>`;
const navItems=role=>`<a class="on" href="#">${I('cal')}My Events</a><a href="#">${I('map')}My Spaces</a><a href="#">${I('users')}Team</a>${role==='Owner'?`<a href="#">${I('gear')}Settings</a>`:''}`;
const pastBtn=e=>e.st==='past'?`<a class="btn sec" href="#">View Event</a>`:`<a class="btn pri" href="#">Open Event ${I('arrow',18)}</a>`;
{
const $=id=>document.getElementById(id);
const DATA={
 'grand-garden-hall':{n:'Grand Garden Hall',r:'Owner',spaces:['Main Hall','Garden'],ev:EVENTS},
 'seaside-terrace':{n:'Seaside Terrace',r:'Manager',spaces:['Terrace','Lounge'],ev:[
  {n:"Ofer & Lior's Wedding",d:'Dec 3, 2026',t:'19:00',sp:'Terrace',cl:'Lior Ben-David',max:260,st:'joined',conf:181,cov:'a',ic:'glass'},
  {n:'Startup Summit Dinner',d:'Feb 18, 2027',t:'19:30',sp:'Lounge',cl:'Gal Friedman',max:90,st:'sent',sent:'Nov 25',cov:'c',ic:'brief'},
  {n:'Gold Family Reunion',d:'Aug 30, 2026',t:'13:00',sp:'Terrace',cl:'Dafna Gold',max:140,st:'past',conf:122,cov:'b',ic:'cake'}]}};
const S={ws:'grand-garden-hall',tab:'all',space:'',q:'',view:matchMedia('(max-width:767px)').matches?'list':'grid',wsOpen:false,ddOpen:false};
const cur=()=>DATA[S.ws];
let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)};
// static icons
$('lg').innerHTML=I('logo',20);$('lg2').innerHTML=I('logo',20);$('close').innerHTML=I('x');$('burger').innerHTML=I('menu');
$('bell').innerHTML=I('bell')+'<em>3</em>';$('who').innerHTML=`<span class="av">AG</span><span class="nm">Avi Golan</span>${I('down',18)}`;
$('foot').innerHTML=`<div class="lang">${I('globe',18)}<span>English</span>${I('down',18)}</div><div class="out">${I('logout')}Log out</div>`;
document.querySelectorAll('.cta').forEach(b=>b.innerHTML=I('plus',18)+'Create Event');
$('sbtn').innerHTML=I('search',20);$('sic').innerHTML=I('search',18);
const renderSide=()=>{const w=cur();
 $('ws').innerHTML=`<button class="wsbtn${S.wsOpen?' open':''}" id="wsb" aria-haspopup="listbox" aria-expanded="${S.wsOpen}"><span class="tile v">${I('bld',20)}</span><span class="grow"><span class="nm" style="display:block">${esc(w.n)}</span><span class="sub">Venue · ${w.r}</span></span>${I('updown',18)}</button>`+
 (S.wsOpen?`<div class="menu" role="listbox" aria-label="Switch workspace"><h4>Switch workspace</h4>
 <button class="mi" role="option" aria-selected="false" data-ws="personal"><span class="tile p">${I('user',20)}</span><span class="tx"><span class="nm" style="display:block">Personal</span><span class="sub">Your own events</span></span></button>
 ${Object.entries(DATA).sort((a,b)=>a[1].n.localeCompare(b[1].n)).map(([k,v])=>`<button class="mi${k===S.ws?' sel':''}" role="option" aria-selected="${k===S.ws}" data-ws="${k}"><span class="tile v">${I('bld',20)}</span><span class="tx"><span class="nm" style="display:block">${esc(v.n)}</span><span class="sub">${v.r}</span></span>${k===S.ws?`<span class="ck">${I('check',18)}</span>`:''}</button>`).join('')}</div>`:'');
 $('nav').innerHTML=`<a class="on" href="#" aria-current="page">${I('cal')}My Events</a><a href="#" data-soon>${I('map')}My Spaces</a><a href="#" data-soon>${I('users')}Team</a>${w.r==='Owner'?`<a href="#" data-soon>${I('gear')}Settings</a>`:''}`};
const isPast=e=>e.st==='past';
const card=e=>`<article class="card"><div class="cov" style="background:${COVERS[e.cov]}">${badge(e.st)}<button class="dots" aria-label="More actions">${I('dots',18)}</button>${I(e.ic,48)}</div>
<div class="cb"><div class="ttl"><h3>${esc(e.n)}</h3>${I('right',20)}</div><span class="bb">${badge(e.st)}</span>
<ul class="meta"><li>${I('cal',16)}${e.d}</li><li>${I('clock',16)}${e.t}</li><li>${I('pin',16)}${esc(e.sp)}</li>${clientLine(e)}<li>${I('users',16)}${e.max} maximum attendees</li></ul>${progress(e)}${pastBtn(e)}</div></article>`;
const renderMain=()=>{const w=cur(),ev=w.ev.filter(e=>(!S.space||e.sp===S.space));
 const c={all:ev.length,up:ev.filter(e=>!isPast(e)).length,past:ev.filter(isPast).length};
 $('tabs').innerHTML=[['all','All Events'],['up','Upcoming'],['past','Past']].map(([k,l])=>`<button role="tab" aria-selected="${S.tab===k}" class="${S.tab===k?'on':''}" data-tab="${k}">${l} <span class="cnt">${c[k]}</span></button>`).join('');
 $('ddb').innerHTML=`${I('pin',18)}<span>${S.space||'All spaces'}</span>${I('down',18)}`;$('ddb').setAttribute('aria-expanded',S.ddOpen);
 $('ddw').querySelector('.menu')?.remove();
 if(S.ddOpen)$('ddw').insertAdjacentHTML('beforeend',`<div class="menu" role="listbox" aria-label="Filter by space">${['',...w.spaces].map(s=>`<button class="opt${S.space===s?' sel':''}" role="option" aria-selected="${S.space===s}" data-space="${esc(s)}"><span>${s?esc(s):'All spaces'}</span>${S.space===s?I('check',16):''}</button>`).join('')}</div>`);
 $('vt').innerHTML=`<button class="${S.view==='grid'?'on':''}" data-view="grid" aria-label="Grid view" aria-pressed="${S.view==='grid'}">${I('grid',18)}</button><button class="${S.view==='list'?'on':''}" data-view="list" aria-label="List view" aria-pressed="${S.view==='list'}">${I('list',18)}</button>`;
 const q=S.q.trim().toLowerCase();
 const shown=ev.filter(e=>(S.tab==='all'||(S.tab==='past')===isPast(e))&&(!q||(e.n+' '+(e.cl||'')+' '+e.sp).toLowerCase().includes(q)));
 $('cards').className='cards '+S.view;
 $('cards').innerHTML=shown.length?shown.map(card).join(''):`<div class="empty" style="grid-column:1/-1"><span class="ic">${I('cal',22)}</span><p>No events match your filters.</p><button class="btn pri" data-act="clear">Clear Filters</button></div>`};
const render=()=>{renderSide();renderMain()};
const setDrawer=o=>{$('app').classList.toggle('drawer',o);if(!o){S.wsOpen=false;renderSide()}};
const fromHash=()=>{const h=location.hash.slice(1);if(DATA[h]&&h!==S.ws){S.ws=h;S.space='';render()}};
document.addEventListener('click',ev=>{const t=ev.target.closest('button,a,[role=button]');
 if(!ev.target.closest('#ws')&&S.wsOpen){S.wsOpen=false;renderSide()}
 if(!ev.target.closest('#ddw')&&S.ddOpen){S.ddOpen=false;renderMain()}
 if(!t)return;
 if(t.tagName==='A')ev.preventDefault();
 const d=t.dataset;
 if(t.id==='wsb'){S.wsOpen=!S.wsOpen;renderSide();return}
 if(d.ws){S.wsOpen=false;if(d.ws==='personal'){renderSide();toast('Personal opens today\'s My Events page (your own events).');return}
  S.ws=d.ws;S.space='';try{history.replaceState(null,'','#'+d.ws)}catch(e){}render();toast(`Switched to ${cur().n} (${cur().r}).`);return}
 if(t.id==='burger'){if(matchMedia('(max-width:1023px)').matches)setDrawer(true);else $('app').classList.toggle('collapsed');return}
 if(t.id==='close'){setDrawer(false);return}
 if(t.id==='ddb'){S.ddOpen=!S.ddOpen;renderMain();return}
 if(d.space!==undefined){S.space=d.space;S.ddOpen=false;renderMain();return}
 if(d.tab){S.tab=d.tab;renderMain();return}
 if(d.view){S.view=d.view;renderMain();return}
 if(t.id==='sbtn'){const o=$('app').classList.toggle('searching');if(o)$('q').focus();return}
 if(d.act==='clear'){S.tab='all';S.space='';S.q='';$('q').value='';renderMain();return}
 if(d.act==='create'){toast('Create Event opens the venue wizard (screen #9).');return}
 if(d.soon!==undefined){toast('This mockup covers My Events only.');return}
 if(t.classList.contains('dots')){toast('Event actions menu.');return}
 if(t.classList.contains('btn')){toast('Opens the event.');return}
});
$('scrim').addEventListener('click',()=>setDrawer(false));
$('ddb').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();S.ddOpen=!S.ddOpen;renderMain()}});
$('q').addEventListener('input',e=>{S.q=e.target.value;renderMain()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(S.wsOpen){S.wsOpen=false;renderSide()}else if(S.ddOpen){S.ddOpen=false;renderMain()}else setDrawer(false)});
matchMedia('(max-width:1023px)').addEventListener('change',()=>{setDrawer(false);$('app').classList.remove('collapsed')});
addEventListener('hashchange',fromHash);
render();fromHash();
}
</script></body></html>
