<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venue My Spaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: the existing Event Planner product, no new styling
   IDEA: a faithful product screen for screenshotting (mockup #3, venue_spaces)
   PICTURE: the screen itself: space cards, or the empty state
   COLOUR and TYPE: DESIGN_GUIDE.md tokens, Inter
   LAYOUT: one responsive page: sidebar at 1024px+, drawer below, phone cards below 768px */
:root{color-scheme:light;--bg:#F6F7FB;--sf:#fff;--sfm:#F8F9FC;--bd:#E5E8F0;--bds:#CFD4E2;--tx:#0F1433;--mu:#5B6480;--sb:#626B85;--pr:#4F46E5;--prh:#4338CA;--prs:#EEF0FF;--prb:#C9CDFB;--nv1:#0F1535;--nv2:#151C47;--nvr:#1B2350;--nvb:#262E5C;--nvt:#F1F3FB;--nvm:#B4BBD6;--sh:0 1px 2px rgb(15 20 51/6%);--shm:0 8px 24px rgb(15 20 51/12%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
ul{list-style:none}a{text-decoration:none;color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.i{flex:none;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--pr);color:#fff}.btn.pri:hover{background:var(--prh)}
.btn.sec{background:#fff;color:var(--pr);border:1px solid var(--prb)}
.btn.soft{background:var(--prs);color:var(--pr)}
.btn.sm{height:36px;padding:0 14px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.success{color:#15803D;background:#E6F7EC;border-color:#BDE5CB}
.warning{color:#B45309;background:#FFF4E3;border-color:#F8D8A4}
.info{color:#4338CA;background:#EEF0FF;border-color:#C9CDFB}
.neutral{color:#475069;background:#ECEFF5;border-color:#D9DEEA}
/* shell (same as Venue My Events) */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30;background:linear-gradient(180deg,var(--nv1),var(--nv2));color:var(--nvt);display:flex;flex-direction:column;padding:16px}
.app.collapsed .side{display:none}
.dh{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;padding:4px 8px 0}
.logo .mk{width:32px;height:32px;border-radius:8px;background:var(--pr);display:grid;place-items:center;color:#fff}
.xb{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--nvb);place-items:center;color:var(--nvt)}
.ws{position:relative;margin-top:20px}
.wsbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--nvr);border:1px solid var(--nvb);text-align:start;color:var(--nvt)}
.wsbtn.open{border-color:var(--nvm)}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.tile.v{background:linear-gradient(135deg,#6366F1,#4F46E5)}
.tile.p{background:var(--prs);color:var(--pr)}
.wsbtn .nm{font-size:14px;font-weight:600;line-height:1.3}
.wsbtn .sub{font-size:12px;color:var(--nvm)}
.wsbtn .grow{flex:1}
.wsbtn .i:last-child{color:var(--nvm)}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--nvm)}
.nav a.on{background:var(--nvr);color:var(--nvt);font-weight:600}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.lang{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--nvb);background:var(--nvr);font-size:14px}
.lang span{flex:1}
.out{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;font-size:14px;color:var(--nvm)}
.menu{position:absolute;left:0;top:calc(100% + 8px);width:100%;min-width:216px;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:5}
.menu h4{font-size:12px;font-weight:500;color:var(--mu);padding:8px 12px 4px}
.mi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;width:100%;text-align:start}
.mi.sel{background:var(--prs)}
.mi .tx{flex:1}.mi .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}.mi .sub{font-size:12px;color:var(--mu)}
.mi .ck{color:var(--pr)}
.opt{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 12px;border-radius:10px;font-size:14px;text-align:start}
.opt span{flex:1}.opt .i{color:var(--mu)}.opt.dan,.opt.dan .i{color:#C81E1E}
.opt:hover,.mi:hover{background:var(--sfm)}.mi.sel:hover{background:var(--prs)}
.sep{height:1px;background:var(--bd);margin:4px 0}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 32px;position:sticky;top:0;z-index:10}
.ibtn{width:44px;height:44px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--tx)}
.top .mk{display:none;width:40px;height:40px;border-radius:10px;background:var(--pr);place-items:center;color:#fff}
.top .sp{flex:1}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--mu)}
.bell em{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:#C81E1E;color:#fff;font-size:11px;font-weight:600;font-style:normal;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.av{width:40px;height:40px;border-radius:50%;background:var(--prs);color:var(--pr);font-size:14px;font-weight:600;display:grid;place-items:center;flex:none}
.who{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}.who .i{color:var(--mu)}
/* page */
.content{padding:24px 32px 40px;width:100%;max-width:1344px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.ph h1{font-size:32px;line-height:1.2;font-weight:700}
.ph p{color:var(--mu);margin-top:4px}
.cta2{display:none}
.tools{display:flex;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.tools .sp{flex:1}
.seg{display:flex;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px}
.seg button{height:36px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mu);display:flex;align-items:center;gap:8px;justify-content:center}
.seg button.on{background:var(--pr);color:#fff;font-weight:600}
.cnt{min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:#ECEFF5;color:#475069;font-size:12px;font-weight:600;display:grid;place-items:center}
.on .cnt{background:#fff;color:var(--pr)}
.field{height:44px;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;color:var(--sb)}
.srch{width:300px}
.srch input{border:0;outline:0;font:inherit;font-size:14px;color:var(--tx);flex:1;min-width:0;background:none;height:100%}
.srch:focus-within{border-color:var(--pr)}
/* space cards */
.cards{margin-top:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);display:flex;flex-direction:column;position:relative}
.cov{height:152px;position:relative;display:grid;place-items:center;color:#fff;flex:none;border-radius:13px 13px 0 0;overflow:hidden}
.cov>.badge{position:absolute;top:12px;left:12px}
.cov .ini{font-size:40px;font-weight:700;letter-spacing:1px;opacity:.95}
.cov svg.ph{position:absolute;inset:0;width:100%;height:100%}
.cov .pt{position:absolute;bottom:12px;left:12px;font-size:12px;font-weight:600;background:rgb(15 20 51/55%);padding:2px 8px;border-radius:999px;display:flex;gap:4px;align-items:center}
.dots{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--tx);box-shadow:var(--sh);z-index:2}
.cmenu{left:auto;right:12px;top:52px;width:220px;min-width:0}
.cb{padding:20px;display:flex;flex-direction:column;gap:16px;flex:1;min-width:0}
.cb h3{font-size:18px;font-weight:600;line-height:1.3}
.addr{display:flex;gap:8px;font-size:14px;color:var(--mu);margin-top:4px}
.addr .i{color:var(--sb);margin-top:2px}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--sfm);border:1px solid var(--bd);border-radius:10px}
.fig{padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.fig:nth-child(even){border-left:1px solid var(--bd)}.fig:nth-child(n+3){border-top:1px solid var(--bd)}
.fig b{font-size:18px;font-weight:700;line-height:1.3}
.fig b.no{color:var(--sb);font-weight:600}
.fig span{font-size:12px;color:var(--sb);display:flex;align-items:center;gap:3px;line-height:1.35}
.fig .tip{position:relative;display:inline-grid;color:var(--sb);cursor:help}
.tipb{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:220px;background:var(--tx);color:#fff;font-size:12px;font-weight:400;line-height:1.45;padding:8px 12px;border-radius:10px;text-align:start;box-shadow:var(--shm);opacity:0;pointer-events:none;transition:opacity .15s;z-index:6}
.tip:hover .tipb,.tip:focus .tipb{opacity:1}
.nxt{font-size:14px;color:var(--mu);display:flex;gap:8px;align-items:flex-start}
.nxt .i{color:var(--sb);margin-top:2px}.nxt b{color:var(--tx);font-weight:500}
.nolay{color:#B45309}.nolay .i{color:#B45309}
.acts{display:flex;gap:12px;margin-top:auto}
.acts .btn{flex:1}
.card.arch .cov{filter:grayscale(.85);opacity:.75}
/* empty */
.empty{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:56px 24px;margin-top:24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.empty .ic{width:64px;height:64px;border-radius:50%;background:var(--prs);color:var(--pr);display:grid;place-items:center}
.empty h2{font-size:24px;font-weight:700;line-height:1.2}
.empty p{color:var(--mu);max-width:480px}
.steps{display:flex;gap:12px;margin:8px 0;flex-wrap:wrap;justify-content:center}
.steps li{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mu);background:var(--sfm);border:1px solid var(--bd);border-radius:999px;padding:6px 14px 6px 6px}
.steps .n{width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--prb);color:var(--pr);font-size:12px;font-weight:600;display:grid;place-items:center}
.nores{grid-column:1/-1;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;color:var(--mu)}
.nores .ic{width:48px;height:48px;border-radius:50%;background:var(--prs);color:var(--pr);display:grid;place-items:center}
/* mockup state switcher (not part of the product) */
.mock{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;display:flex;align-items:center;gap:8px;background:#fff;border:1px dashed var(--bds);border-radius:14px;box-shadow:var(--shm);padding:6px 6px 6px 14px;font-size:12px;color:var(--mu)}
.mock .seg{border:0;padding:0}.mock .seg button{height:32px;padding:0 12px;font-size:12px}
.mock .hx{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--mu)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--tx);color:#fff;font-size:14px;padding:12px 16px;border-radius:10px;box-shadow:var(--shm);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:none}
.app.withmock .toast{bottom:80px}
.hidden{display:none!important}
/* compact: drawer */
@media (max-width:1023px){
 .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(320px,85vw);transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shm)}
 .app.collapsed .side{display:flex}
 .app.drawer .side{transform:none}
 .scrim{display:block;position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
 .app.drawer .scrim{opacity:1;pointer-events:auto}
 .xb,.top .mk{display:grid}
 .top{padding:0 16px;gap:12px}
}
/* phone */
@media (max-width:767px){
 .who .nm,.who .i{display:none}
 .content{padding:24px 16px 96px}
 .ph h1{font-size:28px}
 .ph .btn{display:none}
 .cta2{display:flex;width:100%;margin-top:16px}
 .tools{margin-top:20px;gap:8px}
 .seg{flex:1}.seg button{flex:1 1 0;padding:0 6px}
 .tools .sp{display:none}
 .srch{width:100%;order:2}
 .cards{margin-top:20px;grid-template-columns:minmax(0,1fr);gap:16px}
 .cov{height:120px}
 .cb{padding:16px;gap:14px}
 .cb h3{font-size:16px}
 .fig b{font-size:16px}
 .empty{padding:40px 16px}
 .empty h2{font-size:20px}
 .steps{flex-direction:column;align-items:stretch;width:100%}
 .empty .btn{width:100%}
 .toast{left:16px;right:16px;bottom:16px}
 .app.withmock .toast{bottom:72px}
 .mock{left:16px;right:16px;transform:none;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app withmock" id="app">
 <aside class="side" id="side" aria-label="Main navigation">
  <div class="dh"><div class="logo"><span class="mk" id="lg"></span>Event Planner</div><button class="xb" id="close" aria-label="Close menu"></button></div>
  <div class="ws" id="ws"></div>
  <nav class="nav" id="nav" aria-label="Venue"></nav>
  <div class="foot" id="foot"></div>
 </aside>
 <div class="scrim" id="scrim"></div>
 <div class="main">
  <header class="top"><button class="ibtn" id="burger" aria-label="Menu"></button><span class="mk" id="lg2"></span><span class="sp"></span><span class="bell" id="bell" aria-label="3 notifications"></span><span class="who" id="who"></span></header>
  <main class="content">
   <div class="ph"><div><h1>My Spaces</h1><p>The rooms you rent out. Each space keeps its table layouts, ready for new events.</p></div><a class="btn pri cta" href="#" data-act="create" id="cta1"></a></div>
   <a class="btn pri cta cta2" href="#" data-act="create" id="cta2"></a>
   <div class="tools" id="tools">
    <div class="seg" role="tablist" id="tabs"></div><span class="sp"></span>
    <label class="field srch" id="srch"><span id="sic"></span><input id="q" type="search" placeholder="Search spaces..." aria-label="Search spaces"></label>
   </div>
   <div id="cards"></div>
  </main>
 </div>
 <div class="mock" id="mock" aria-label="Mockup state (not part of the product)"><span>Mockup state</span><div class="seg" id="mseg"><button data-mock="full">Spaces</button><button data-mock="empty">Empty venue</button></div><button class="hx" id="mhide" aria-label="Hide mockup controls"></button></div>
 <div class="toast" id="toast" role="status"></div>
</div>
<script>

image:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
calplus:'<path d="M8 2v4M16 2v4M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8M3 10h18M16 19h6M19 16v6"/>',
eye:'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>'
};
const I=(n,s=20)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COVERS={a:'linear-gradient(135deg,#8B5CF6,#EC4899)',b:'linear-gradient(135deg,#10B981,#3B82F6)',c:'linear-gradient(135deg,#0EA5E9,#6366F1)'};
/* a stand-in "uploaded photo": a simple drawn garden scene */
const PHOTO=`<svg class="ph" viewBox="0 0 400 152" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient><linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/></linearGradient></defs><rect width="400" height="152" fill="url(#sky)"/><path d="M0 96 Q100 80 200 92 T400 88 V152 H0Z" fill="url(#lawn)"/><g fill="#166534"><circle cx="40" cy="70" r="26"/><circle cx="70" cy="80" r="20"/><circle cx="350" cy="66" r="28"/><circle cx="318" cy="80" r="18"/></g><g fill="#FEF3C7" stroke="#D97706" stroke-width="1"><path d="M150 70 L200 46 L250 70 Z"/><rect x="156" y="70" width="88" height="24"/></g><g stroke="#FDE68A" stroke-width="2"><path d="M90 50 Q200 30 310 50" fill="none" stroke-dasharray="2 8"/></g><g fill="#fff"><circle cx="120" cy="118" r="10"/><circle cx="200" cy="124" r="10"/><circle cx="280" cy="118" r="10"/></g></svg>`;
const DATA={
 'grand-garden-hall':{n:'Grand Garden Hall',r:'Owner',spaces:[
  {n:'Main Hall',a:'12 Orchard Lane, Ramat Gan',max:400,tab:45,lay:3,up:2,next:"Dana & Yossi's Wedding · Dec 17, 2026",cov:'c'},
  {n:'Garden',a:'12 Orchard Lane, Ramat Gan (back lawn)',max:250,tab:25,lay:2,up:3,next:'Cohen Bar Mitzvah · Jan 8, 2027',photo:true},
  {n:'Rooftop Lounge',a:'12 Orchard Lane, Ramat Gan (5th floor)',max:120,tab:null,lay:0,up:0,cov:'a'},
  {n:'Old Ballroom',a:'12 Orchard Lane, Ramat Gan',max:300,tab:32,lay:2,up:0,cov:'b',arch:'Archived on Aug 2, 2026'}]},
 'seaside-terrace':{n:'Seaside Terrace',r:'Manager',spaces:[
  {n:'Terrace',a:'7 Harbor Walk, Herzliya',max:300,tab:30,lay:2,up:1,next:"Ofer & Lior's Wedding · Dec 3, 2026",photo:true},
  {n:'Lounge',a:'7 Harbor Walk, Herzliya (ground floor)',max:120,tab:12,lay:1,up:1,next:'Startup Summit Dinner · Feb 18, 2027',cov:'c'}]}};
const $=id=>document.getElementById(id);
const S={ws:'grand-garden-hall',tab:'active',q:'',wsOpen:false,menu:null,empty:false};
const cur=()=>DATA[S.ws];
let tt;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800)};
$('lg').innerHTML=I('logo',20);$('lg2').innerHTML=I('logo',20);$('close').innerHTML=I('x');$('burger').innerHTML=I('menu');
$('bell').innerHTML=I('bell')+'<em>3</em>';$('who').innerHTML=`<span class="av">AG</span><span class="nm">Avi Golan</span>${I('down',18)}`;
$('foot').innerHTML=`<div class="lang">${I('globe',18)}<span>English</span>${I('down',18)}</div><div class="out">${I('logout')}Log out</div>`;
document.querySelectorAll('.cta').forEach(b=>b.innerHTML=I('plus',18)+'Create Space');
$('sic').innerHTML=I('search',18);$('mhide').innerHTML=I('x',16);
const initials=n=>n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const renderSide=()=>{const w=cur();
 $('ws').innerHTML=`<button class="wsbtn${S.wsOpen?' open':''}" id="wsb" aria-haspopup="listbox" aria-expanded="${S.wsOpen}"><span class="tile v">${I('bld',20)}</span><span class="grow"><span class="nm" style="display:block">${esc(w.n)}</span><span class="sub">Venue · ${w.r}</span></span>${I('updown',18)}</button>`+
 (S.wsOpen?`<div class="menu" role="listbox" aria-label="Switch workspace"><h4>Switch workspace</h4>
 <button class="mi" role="option" aria-selected="false" data-ws="personal"><span class="tile p">${I('user',20)}</span><span class="tx"><span class="nm">Personal</span><span class="sub">Your own events</span></span></button>
 ${Object.entries(DATA).map(([k,v])=>`<button class="mi${k===S.ws?' sel':''}" role="option" aria-selected="${k===S.ws}" data-ws="${k}"><span class="tile v">${I('bld',20)}</span><span class="tx"><span class="nm">${esc(v.n)}</span><span class="sub">${v.r}</span></span>${k===S.ws?`<span class="ck">${I('check',18)}</span>`:''}</button>`).join('')}</div>`:'');
 $('nav').innerHTML=`<a href="#" data-soon>${I('cal')}My Events</a><a class="on" href="#" aria-current="page">${I('map')}My Spaces</a><a href="#" data-soon>${I('users')}Team</a>${w.r==='Owner'?`<a href="#" data-soon>${I('gear')}Settings</a>`:''}`};
const fig=(v,l,extra='')=>`<div class="fig">${v==null?'<b class="no">Not set</b>':`<b>${v}</b>`}<span>${l}${extra}</span></div>`;
const tip=`<span class="tip" tabindex="0" aria-label="For information only">${I('info',12)}<span class="tipb" role="tooltip">For information only. Events can have more tables; the layout editor shows a warning, nothing is blocked.</span></span>`;
const cardMenu=(s,k)=>`<div class="menu cmenu" role="menu">${s.arch?
 `<button class="opt" role="menuitem" data-a="restore" data-k="${k}">${I('undo',18)}<span>Restore Space</span></button>`:
 `<button class="opt" role="menuitem" data-a="edit">${I('pencil',18)}<span>Edit Space</span></button>
 <button class="opt" role="menuitem" data-a="layout">${I('layout',18)}<span>Add Layout</span></button>
 <button class="opt" role="menuitem" data-a="event"${s.lay?'':' disabled style="opacity:.5"'}>${I('calplus',18)}<span>Create Event Here</span></button>
 <div class="sep"></div><button class="opt dan" role="menuitem" data-a="archive" data-k="${k}">${I('archive',18)}<span>Archive Space</span></button>`}</div>`;
const card=(s,k)=>{
 const next=s.arch?`<p class="nxt">${I('archive',16)}<span>${esc(s.arch)}. Existing events keep their own copy of the layout.</span></p>`
  :s.lay===0?`<p class="nxt nolay">${I('alert',16)}<span>No layouts yet. Draw one before creating events here.</span></p>`
  :s.up?`<p class="nxt">${I('cal',16)}<span>Next: <b>${esc(s.next)}</b></span></p>`
  :`<p class="nxt">${I('cal',16)}<span>No upcoming events.</span></p>`;
 const acts=s.arch?`<button class="btn sec" data-a="restore" data-k="${k}">${I('undo',18)}Restore</button>`
  :s.lay===0?`<button class="btn soft" data-a="layout">${I('plus',18)}Add Layout</button><button class="btn pri" data-a="open" data-n="${esc(s.n)}">Open Space ${I('arrow',18)}</button>`
  :`<button class="btn pri" data-a="open" data-n="${esc(s.n)}">Open Space ${I('arrow',18)}</button>`;
 return `<article class="card${s.arch?' arch':''}"><div class="cov" style="background:${COVERS[s.cov]||'#ECEFF5'}">${s.photo?PHOTO+`<span class="pt">${I('image',12)}Photo</span>`:`<span class="ini">${initials(s.n)}</span>`}${s.arch?`<span class="badge neutral">${I('archive',12)}Archived</span>`:''}</div>
 <button class="dots" data-menu="${k}" aria-label="More actions for ${esc(s.n)}" aria-haspopup="menu" aria-expanded="${S.menu===k}">${I('dots',18)}</button>${S.menu===k?cardMenu(s,k):''}
 <div class="cb"><div><h3>${esc(s.n)}</h3><p class="addr">${I('pin',16)}<span>${esc(s.a)}</span></p></div>
 <div class="figs">${fig(s.max,'max people')}${fig(s.tab,'max tables',tip)}${fig(s.lay,s.lay===1?'layout':'layouts')}${fig(s.up,s.up===1?'upcoming event':'upcoming events')}</div>
 ${next}<div class="acts">${acts}</div></div></article>`};
const renderMain=()=>{const w=cur(),empty=S.empty;
 ['cta1','cta2','tools'].forEach(id=>$(id).classList.toggle('hidden',empty));
 document.querySelectorAll('#mseg button').forEach(b=>b.classList.toggle('on',(b.dataset.mock==='empty')===empty));
 if(empty){$('cards').className='';$('cards').innerHTML=`<section class="empty"><span class="ic">${I('map',30)}</span><h2>Create your first space</h2><p>A space is a room you rent out, like a hall or a garden. Add one, draw its tables, and you're ready to create events in it.</p>
 <ol class="steps"><li><span class="n">1</span>Add a space</li><li><span class="n">2</span>Draw a table layout</li><li><span class="n">3</span>Create events for clients</li></ol>
 <button class="btn pri" data-act="create">${I('plus',18)}Create Space</button></section>`;return}
 const sp=w.spaces.map((s,k)=>[s,k]);
 const c={active:sp.filter(([s])=>!s.arch).length,arch:sp.filter(([s])=>s.arch).length};
 $('tabs').innerHTML=[['active','Active'],['arch','Archived']].map(([k,l])=>`<button role="tab" aria-selected="${S.tab===k}" class="${S.tab===k?'on':''}" data-tab="${k}">${l} <span class="cnt">${c[k]}</span></button>`).join('');
 const q=S.q.trim().toLowerCase();
 const shown=sp.filter(([s])=>(S.tab==='arch')===!!s.arch&&(!q||(s.n+' '+s.a).toLowerCase().includes(q)));
 $('cards').className='cards';
 $('cards').innerHTML=shown.length?shown.map(([s,k])=>card(s,k)).join(''):`<div class="nores"><span class="ic">${I(q?'search':'archive',22)}</span><p>${q?'No spaces match your search.':'No archived spaces. Archived spaces stay here and can be restored.'}</p>${q?'<button class="btn sec" data-act="clear">Clear Search</button>':''}</div>`};
const render=()=>{renderSide();renderMain()};
const setDrawer=o=>{$('app').classList.toggle('drawer',o);if(!o&&S.wsOpen){S.wsOpen=false;renderSide()}};
const fromHash=()=>{const h=location.hash.slice(1);if(h==='empty'){S.empty=true}else if(DATA[h]){S.ws=h;S.empty=false}else return;S.tab='active';render()};
document.addEventListener('click',ev=>{const t=ev.target.closest('button,a');
 if(!ev.target.closest('#ws')&&S.wsOpen){S.wsOpen=false;renderSide()}
 if(S.menu!==null&&!ev.target.closest('.cmenu')&&!ev.target.closest('[data-menu]')){S.menu=null;renderMain()}
 if(!t||t.disabled)return;
 if(t.tagName==='A')ev.preventDefault();
 const d=t.dataset;
 if(t.id==='wsb'){S.wsOpen=!S.wsOpen;renderSide();return}
 if(d.ws){S.wsOpen=false;if(d.ws==='personal'){renderSide();toast("Personal opens today's My Events page (your own events).");return}
  S.ws=d.ws;S.empty=false;S.tab='active';history.replaceState(null,'','#'+d.ws);render();toast(`Switched to ${cur().n} (${cur().r}).`);return}
 if(t.id==='burger'){if(matchMedia('(max-width:1023px)').matches)setDrawer(true);else $('app').classList.toggle('collapsed');return}
 if(t.id==='close'){setDrawer(false);return}
 if(d.menu!==undefined){const k=+d.menu;S.menu=S.menu===k?null:k;renderMain();return}
 if(d.tab){S.tab=d.tab;renderMain();return}
 if(d.mock){S.empty=d.mock==='empty';S.tab='active';history.replaceState(null,'','#'+(S.empty?'empty':S.ws));render();return}
 if(t.id==='mhide'){$('app').classList.remove('withmock');$('mock').classList.add('hidden');return}
 if(d.act==='clear'){S.q='';$('q').value='';renderMain();return}
 if(d.act==='create'){toast('Create Space opens the space dialog (screen #4).');return}
 if(d.soon!==undefined){toast('This mockup covers My Spaces only.');return}
 const a=d.a;if(!a)return;S.menu=null;
 const sp=cur().spaces;
 if(a==='open'){toast(`Opens ${d.n}: space details and layouts (screen #5).`)}
 else if(a==='edit')toast('Opens the Edit Space dialog (screen #4).');
 else if(a==='layout')toast('Opens the layout editor (screen #6).');
 else if(a==='event')toast('Opens the Create Event wizard with this space chosen (screen #9).');
 else if(a==='archive'){const s=sp[+d.k];s.arch='Archived on Nov 27, 2026';s.up_=s.up;toast(`${s.n} was archived. Its ${s.up||'no'} upcoming event${s.up===1?'':'s'} keep their own layout copies.`)}
 else if(a==='restore'){const s=sp[+d.k];delete s.arch;toast(`${s.n} was restored.`)}
 renderMain();
});
$('scrim').addEventListener('click',()=>setDrawer(false));
$('q').addEventListener('input',e=>{S.q=e.target.value;renderMain()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(S.menu!==null){S.menu=null;renderMain()}else if(S.wsOpen){S.wsOpen=false;renderSide()}else setDrawer(false)});
matchMedia('(max-width:1023px)').addEventListener('change',()=>{setDrawer(false);$('app').classList.remove('collapsed')});
addEventListener('hashchange',fromHash);
render();fromHash();
}
</script></body></html>
