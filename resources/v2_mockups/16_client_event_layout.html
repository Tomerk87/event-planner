<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client: Event Layout (mockup #16)</title>
<style>
/* Mockup #16, client_event_layout: the client's Event Layout inside a venue event (Dana & Yossi's Wedding, Grand Garden Hall).
   The map and tables are view-only (no Add Table, Edit Layout, move, resize or delete). Seating (Manage Guests) is fully active.
   Tokens: DESIGN_GUIDE.md / tokens.css. Layout: sidebar at 1024px+, drawer below, phone layout below 768px.
   Routes: #arrangement, #tables, #table-17 (selected), #manage-5 (Manage Guests dialog), #unseated. */
:root{color-scheme:light;--bg:#F6F7FB;--sf:#fff;--sfm:#F8F9FC;--bd:#E5E8F0;--bds:#CFD4E2;--tx:#0F1433;--mu:#5B6480;--sb:#626B85;--pr:#4F46E5;--prh:#4338CA;--prs:#EEF0FF;--prb:#C9CDFB;--nv1:#0F1535;--nv2:#151C47;--nvr:#1B2350;--nvb:#262E5C;--nvt:#F1F3FB;--nvm:#B4BBD6;--own:#D97706;--sh:0 1px 2px rgb(15 20 51/6%);--shm:0 8px 24px rgb(15 20 51/12%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 Inter,system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Hebrew',Arial,sans-serif;color:var(--tx);background:var(--bg)}
ul{list-style:none}a{text-decoration:none;color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.i{flex:none;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--pr);color:#fff}.btn.pri:hover{background:var(--prh)}
.btn.sec{background:#fff;color:var(--pr);border:1px solid var(--prb)}.btn.sec:hover{border-color:var(--pr)}
.btn.soft{background:var(--prs);color:var(--pr)}.btn.soft:hover{background:#E2E5FF}
.btn.ghost{color:var(--mu)}.btn.ghost:hover{background:var(--sfm)}
.btn.sm{height:36px;padding:0 14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.success{color:#15803D;background:#E6F7EC;border-color:#BDE5CB}
.warning{color:#B45309;background:#FFF4E3;border-color:#F8D8A4}
.danger{color:#C81E1E;background:#FDECEC;border-color:#F6C4C4}
.info{color:#4338CA;background:#EEF0FF;border-color:#C9CDFB}
.neutral{color:#475069;background:#ECEFF5;border-color:#D9DEEA}
/* "Managed by" badge: Info tone + building-2 (DESIGN_GUIDE §12), same as mockup #13 */
.mgd{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.4;border:1px solid #C9CDFB;background:#EEF0FF;color:#4338CA;max-width:100%}
/* shell */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30;background:linear-gradient(180deg,var(--nv1),var(--nv2));color:var(--nvt);display:flex;flex-direction:column;padding:16px}
.dh{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;padding:4px 8px 0}
.logo .mk{width:32px;height:32px;border-radius:8px;background:var(--pr);display:grid;place-items:center;color:#fff}
.xb{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--nvb);place-items:center;color:var(--nvt)}
.evs{position:relative;margin-top:20px}
.evbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--nvr);border:1px solid var(--nvb);text-align:start;color:var(--nvt)}
.evbtn.open{border-color:var(--nvm)}
.evbtn .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}
.evbtn .sub{font-size:12px;color:var(--nvm);display:block;margin-top:2px;line-height:1.4}
.evbtn .sub .i{display:inline-block;vertical-align:-2px;margin-right:4px}
.evbtn .grow{flex:1;min-width:0}
.evbtn>.i{color:var(--nvm)}
.cov{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,#8B5CF6,#EC4899)}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--nvm)}
.nav a:hover{background:var(--nvr)}
.nav a.on{background:var(--nvr);color:var(--nvt);font-weight:600}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
.lang{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--nvb);background:var(--nvr);font-size:14px;width:100%;color:var(--nvt)}
.lang span{flex:1;text-align:start}
.out{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;font-size:14px;color:var(--nvm);width:100%}
.menu{position:absolute;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:50}
.menu h4{font-size:12px;font-weight:500;color:var(--mu);padding:8px 12px 4px}
.mi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;width:100%;text-align:start;font-size:14px;font-weight:500}
.mi:hover{background:var(--sfm)}.mi.sel{background:var(--prs)}
.mi .tx{flex:1;min-width:0}.mi .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}.mi .sub{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:4px}
.mi .ck{color:var(--pr)}.mi>.i{color:var(--mu)}
.msep{height:1px;background:var(--bd);margin:8px 0}
.evs .menu{left:0;top:calc(100% + 8px);width:100%;min-width:248px}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 32px;position:sticky;top:0;z-index:20}
.ibtn{width:44px;height:44px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--tx)}
.top .mk{display:none;width:40px;height:40px;border-radius:10px;background:var(--pr);place-items:center;color:#fff}
.top .sp{flex:1}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--mu)}
.bell em{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:#C81E1E;color:#fff;font-size:11px;font-weight:600;font-style:normal;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.rolei{width:36px;height:44px;display:grid;place-items:center;color:var(--own)}
.av{width:40px;height:40px;border-radius:50%;background:var(--prs);color:var(--pr);font-size:14px;font-weight:600;display:grid;place-items:center;flex:none}
.who{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}.who .i{color:var(--mu)}
/* page */
.content{padding:24px 32px 40px;width:100%;max-width:1344px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.ph .grow{flex:1;min-width:0}
.ph h1{font-size:32px;line-height:1.2;font-weight:700}
.ph p.d{color:var(--mu);margin-top:4px}
.phm{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:12px}
.hbtns{display:flex;gap:12px;flex:none}
.seg{display:inline-flex;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px}
.seg button{height:36px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mu);display:flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.seg button.on{background:var(--pr);color:#fff;font-weight:600}
.seg button em{font-style:normal;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:#ECEFF5;color:#475069;font-size:12px;font-weight:600;display:grid;place-items:center}
.seg button.on em{background:#fff;color:var(--pr)}
.tabs{margin-top:24px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px;display:flex;align-items:center;gap:16px}
.kpi .grow{flex:1;min-width:0}
.kpi .l{font-size:14px;color:var(--mu)}
.kpi b{display:block;font-size:24px;font-weight:700;line-height:1.3;margin-top:4px}
.kpi small{font-size:12px;color:var(--sb)}
.kic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--prs);color:var(--pr)}
.kic.g{background:#E6F7EC;color:#15803D}.kic.a{background:#FFF4E3;color:#B45309}
.notices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.notice{display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border:1px solid;border-radius:14px;text-align:start;width:100%}
button.notice:hover{border-color:currentColor}
.notice>.i:first-child{margin-top:2px}
.notice .grow{flex:1;min-width:0}
.notice b{display:block;font-weight:600;font-size:16px}
.notice p{font-size:14px;color:var(--mu);margin-top:2px}
.notice>.i:last-child:not(:first-child){align-self:center;color:var(--mu)}
.notice.warning b,.notice.warning>.i:first-child{color:#B45309}
.notice.danger b,.notice.danger>.i:first-child{color:#C81E1E}
.notice.info b,.notice.info>.i:first-child{color:#4338CA}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;margin-top:16px;align-items:start}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px;min-width:0}
.chd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.chd h2{font-size:18px;font-weight:600;line-height:1.3}
.cd{font-size:14px;color:var(--mu);margin-top:12px}
/* the venue note: small, muted, with the building icon (DESIGN_GUIDE §12) */
.vnote{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--mu);margin-top:8px;line-height:1.5}
.vnote .i{color:#4338CA;margin-top:2px}
.mapbox{margin-top:16px;border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:#fff}
.mtool{height:52px;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:0 12px;border-bottom:1px solid var(--bd)}
.mtool .lbl{margin-right:auto;font-size:12px;color:var(--mu);display:flex;align-items:center;gap:12px}
.mtool .lbl span{display:inline-flex;align-items:center;gap:6px}
.mtool .lbl i{width:10px;height:10px;border-radius:3px;border:1.5px solid;display:inline-block}
.zb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mu);position:relative}
.zb:hover{background:var(--sfm);color:var(--tx)}
.tipb{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;font-size:12px;font-weight:400;line-height:1.45;padding:8px 12px;border-radius:10px;white-space:nowrap;box-shadow:var(--shm);opacity:0;pointer-events:none;transition:opacity .15s;z-index:6}
.zb .tipb{bottom:auto;top:calc(100% + 6px)}
.zb:hover .tipb,.zb:focus-visible .tipb,.ib:hover .tipb,.ib:focus-visible .tipb{opacity:1}
.mview{height:600px;background:var(--sfm);position:relative}
.mview svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;cursor:grab}
.mview svg.panning{cursor:grabbing}
[data-t]{cursor:pointer}
[data-t]:focus{outline:none}[data-t]:focus-visible .tb{stroke:#4F46E5;stroke-width:3}
.mapbox.fs{position:fixed;inset:16px;z-index:65;margin:0;box-shadow:var(--shm);display:flex;flex-direction:column}
.mapbox.fs .mview{flex:1;height:auto}
.fsbg{display:none;position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:64}
.fsbg.on{display:block}
/* selected table panel */
.pnl h2{font-size:18px;font-weight:600;line-height:1.3}
.pnl p.e{font-size:14px;color:var(--mu);margin-top:12px}
.pfig{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;background:var(--sfm);border:1px solid var(--bd);border-radius:10px}
.pfig div{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.pfig div+div{border-left:1px solid var(--bd)}
.pfig span{font-size:12px;color:var(--sb)}
.pfig b{font-size:16px;font-weight:600}
.pfig b.red{color:#C81E1E}
.ph3{font-size:14px;font-weight:600;margin-top:20px;display:flex;align-items:center;justify-content:space-between}
.ph3 span{font-weight:400;color:var(--mu);font-size:12px}
.glist{margin-top:8px;display:flex;flex-direction:column}
.gl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.gl:last-child{border-bottom:0}
.gl .grow{flex:1;min-width:0}
.gl b{display:block;font-size:14px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);flex-wrap:wrap;margin-top:2px}
.gl .av{width:32px;height:32px;font-size:12px}
.gl .new{color:#15803D;font-weight:600}
.ib{width:44px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;border:1px solid var(--bd);color:var(--mu);background:#fff;position:relative}
.ib:hover{border-color:var(--bds);color:var(--tx)}
.ib.sm{width:36px;height:36px}
.ib .tipb{left:auto;right:0;transform:none}
.pacts{margin-top:16px;display:flex}
.pacts .btn{flex:1}
.pwarn{display:flex;gap:8px;margin-top:16px;padding:12px;border-radius:10px;border:1px solid #F6C4C4;background:#FDECEC;font-size:13px;line-height:1.45;color:var(--tx)}
.pwarn .i{color:#C81E1E;margin-top:1px}
.empty1{font-size:14px;color:var(--mu);padding:12px 0}
/* tables tab */
.tools{display:flex;gap:12px;margin-top:16px}
.field{height:44px;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;color:var(--sb)}
.srch{flex:1}
.srch input{border:0;outline:0;font-size:14px;color:var(--tx);flex:1;min-width:0;background:none;height:100%}
.srch input::placeholder{color:var(--sb)}
.srch:focus-within{border-color:var(--pr);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.dd{position:relative}
.sel{height:44px;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;font-size:14px;text-align:start;white-space:nowrap}
.sel:hover{border-color:var(--bds)}.sel[aria-expanded=true]{border-color:var(--pr)}
.sel .i{color:var(--mu)}
.lst{position:absolute;right:0;min-width:180px;top:calc(100% + 4px);background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:8}
.opt{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 12px;border-radius:10px;font-size:14px;text-align:start}
.opt span{flex:1}.opt:hover{background:var(--sfm)}.opt.sel1{background:var(--prs)}.opt.sel1 .i{color:var(--pr)}
.tcard{margin-top:16px;border:1px solid var(--bd);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--sfm);color:var(--mu);font-weight:500;text-align:center;padding:12px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--bd);vertical-align:middle;text-align:center}
tbody tr{cursor:pointer}tbody tr:hover td{background:#FBFBFE}
tr:last-child td{border-bottom:0}
td.s,th.s{text-align:start}
td.a{text-align:end;white-space:nowrap;padding-right:16px}
th:first-child,td:first-child{padding-left:16px}
tr.on td{background:#F7F7FF}
td.red{color:#C81E1E;font-weight:600}
.shp{display:inline-flex;align-items:center;gap:8px}.shp .i{color:var(--pr)}
.pg{display:flex;align-items:center;gap:16px;margin-top:16px;font-size:14px;color:var(--mu)}
.pg .sp{flex:1}
.pgn{display:flex;gap:8px}
.pgn button{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);display:grid;place-items:center;font-size:14px;color:var(--tx);background:#fff}
.pgn button.on{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:600}
.pgn button:disabled{opacity:.4;cursor:default}
.tcards{display:none}
.nores{padding:40px 20px;text-align:center;color:var(--mu);font-size:14px}
/* dialogs */
.ov{position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:70;display:none;align-items:center;justify-content:center;padding:24px}
.ov.open{display:flex}
.dlg{width:640px;max-width:100%;max-height:calc(100vh - 48px);background:#fff;border-radius:14px;box-shadow:var(--shm);display:flex;flex-direction:column}
.dlg:focus{outline:none}
.dhd{display:flex;align-items:flex-start;gap:16px;padding:20px 24px 16px;border-bottom:1px solid var(--bd)}
.dhd .grow{flex:1;min-width:0}
.dhd h2{font-size:18px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dhd p{font-size:14px;color:var(--mu);margin-top:4px}
.dx{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mu);margin:-4px -8px 0 0;flex:none}
.dx:hover{background:var(--sfm)}
.dbody{padding:20px 24px 24px;display:flex;flex-direction:column;gap:20px;flex:1;overflow-y:auto;min-height:0}
.dfoot{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid var(--bd);background:#fff;border-radius:0 0 14px 14px}
.dfoot .sum{margin-right:auto;font-size:14px;color:var(--mu)}
.meter{padding:12px 16px;background:var(--sfm);border:1px solid var(--bd);border-radius:10px;font-size:14px}
.meter .row{display:flex;justify-content:space-between;gap:12px;color:var(--mu)}
.meter .row b{color:var(--tx);font-weight:600}
.meter .bar{height:8px;border-radius:999px;background:#ECEFF5;margin-top:8px;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:999px;background:var(--pr)}
.meter.over{background:#FDECEC;border-color:#F6C4C4}
.meter.over .bar i{background:#C81E1E}
.meter.over .row b{color:#C81E1E}
.meter p{font-size:12px;color:var(--tx);margin-top:8px;display:flex;gap:6px}
.meter p .i{color:#C81E1E;margin-top:1px}
.dsec h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.dsec h3 em{font-style:normal;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:#ECEFF5;color:#475069;font-size:12px;font-weight:600;display:grid;place-items:center}
.dsec .glist{border:1px solid var(--bd);border-radius:10px;padding:0 12px;margin-top:8px}
.dsec .glist.scroll{max-height:280px;overflow-y:auto}
.dtools{display:flex;gap:12px;margin-top:8px;align-items:center}
.dtools .seg{flex:none}
.dtools .seg button{height:32px;padding:0 12px;font-size:13px}
.pick{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 12px 44px}
.pick button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--prb);color:var(--pr);background:#fff;font-size:13px;font-weight:600}
.pick button:hover{border-color:var(--pr);background:var(--prs)}
.pick button small{font-weight:400;color:var(--mu);margin-left:4px}
.pick p{font-size:12px;color:var(--mu);width:100%}
.gl.open{border-bottom:0}
/* mockup state switcher (not part of the product) */
.mock{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:60;display:flex;align-items:center;gap:8px;background:#fff;border:1px dashed var(--bds);border-radius:14px;box-shadow:var(--shm);padding:6px 6px 6px 14px;font-size:12px;color:var(--mu)}
.mock .seg{border:0;padding:0}.mock .seg button{height:32px;padding:0 12px;font-size:12px}
.mock .hx{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--mu)}

function tableSvg(t,sel){
 const a=asg(t),over=a>t.cap;
 const tst=over?'#C81E1E':sel?'#4F46E5':'#A5B4FC',fill=sel?'#EEF0FF':over?'#FDECEC':'#fff',sw=sel||over?2.5:1.5;let g='',ch='',k=0;
 const chair=(x,y,rot)=>{const taken=k++<a;const f=over?'#FDECEC':taken?'#A5B4FC':'#fff',s=over?'#C81E1E':taken?'#4F46E5':'#CFD4E2';
  return `<rect x="${(x-6).toFixed(1)}" y="${(y-6).toFixed(1)}" width="12" height="12" rx="3" fill="${f}" stroke="${s}" stroke-width="1.5"${rot!=null?` transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"`:''}/>`};
 let bx=0,by=0;
 if(t.shape==='round'){const r=Math.max(18,t.cap*2.6),R=r+11;for(let i=0;i<t.cap;i++){const an=i/t.cap*2*Math.PI-Math.PI/2;ch+=chair(Math.cos(an)*R,Math.sin(an)*R,an*180/Math.PI)}g=`<circle class="tb" r="${r}" fill="${fill}" stroke="${tst}" stroke-width="${sw}"/>`;bx=R*.75;by=-R*.75}
 else if(t.shape==='square'){const s=44,c=[0,0,0,0];for(let i=0;i<t.cap;i++)c[i%4]++;
  for(let j=0;j<c[0];j++)ch+=chair(-s/2+s*(j+.5)/c[0],-s/2-10);for(let j=0;j<c[2];j++)ch+=chair(s/2+10,-s/2+s*(j+.5)/c[2]);
  for(let j=0;j<c[1];j++)ch+=chair(-s/2+s*(j+.5)/c[1],s/2+10);for(let j=0;j<c[3];j++)ch+=chair(-s/2-10,-s/2+s*(j+.5)/c[3]);
  g=`<rect class="tb" x="-22" y="-22" width="44" height="44" rx="4" fill="${fill}" stroke="${tst}" stroke-width="${sw}"/>`;bx=30;by=-30}
 else{const top=Math.ceil(t.cap/2),bot=t.cap-top,w=Math.max(40,top*20);for(let j=0;j<top;j++)ch+=chair(-w/2+w*(j+.5)/top,-24);for(let j=0;j<bot;j++)ch+=chair(-w/2+w*(j+.5)/bot,24);
  g=`<rect class="tb" x="${-w/2}" y="-14" width="${w}" height="28" rx="4" fill="${fill}" stroke="${tst}" stroke-width="${sw}"/>`;bx=w/2+6;by=-30}
 const warn=over?`<g transform="translate(${bx} ${by})"><circle r="9" fill="#C81E1E" stroke="#fff" stroke-width="2"/><text y="4" text-anchor="middle" font-size="12" font-weight="700" font-family="Inter,sans-serif" fill="#fff">!</text></g>`:'';
 return `<g data-t="${t.id}" transform="translate(${t.x} ${t.y})" role="button" tabindex="0" aria-label="Table ${t.num}, ${SHAPES[t.shape]}, ${a} of ${t.cap} seats taken${over?', over capacity':''}">${ch}${g}<text y="5" text-anchor="middle" font-size="14" font-weight="700" font-family="Inter,sans-serif" fill="${over?'#C81E1E':'#0F1433'}" pointer-events="none">${t.num}</text>${warn}</g>`}
function objSvg(o){const [bg,bd,tx]=o.c,vert=o.h>o.w*1.6;
 return `<g transform="translate(${o.x} ${o.y})" aria-hidden="true"><rect width="${o.w}" height="${o.h}" rx="6" fill="${bg}" stroke="${bd}" stroke-width="1.5"/><text x="${o.w/2}" y="${o.h/2+4}" text-anchor="middle" font-size="${o.h<24?11:13}" font-weight="600" font-family="Inter,sans-serif" fill="${tx}"${vert?` transform="rotate(-90 ${o.w/2} ${o.h/2})"`:''}>${o.n}</text></g>`}

function svgPt(svg,cx,cy){const r=svg.getBoundingClientRect(),v=S.view,s=Math.max(v.w/r.width,v.h/r.height);const ox=(r.width*s-v.w)/2,oy=(r.height*s-v.h)/2;return {x:v.x-ox+(cx-r.left)*s,y:v.y-oy+(cy-r.top)*s}}
function setView(v){const f=fitView();v.w=Math.min(Math.max(v.w,240),f.w*1.6);v.h=v.w*f.h/f.w;S.view=v;const svg=$('plan');if(svg)svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`)}
function zoom(f,cx,cy){const v=S.view;if(cx==null){cx=v.x+v.w/2;cy=v.y+v.h/2}const k=Math.min(Math.max(v.w*f,240),fitView().w*1.6)/v.w;setView({x:cx-(cx-v.x)*k,y:cy-(cy-v.y)*k,w:v.w*k,h:v.h*k})}
function pickTable(id){if(isPhone()){openManage(id);return}S.sel=id;setHash('table-'+id);render();const n=document.querySelector(`[data-t="${id}"]`);if(n&&S.tab==='arr')n.focus({preventScroll:true})}
function bindPlan(){const svg=$('plan');if(!svg)return;
 svg.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{svg.setPointerCapture(e.pointerId)}catch(_){}
  if(pts.size===2){const [a,b]=[...pts.values()];ptr={pinch:true,d:Math.hypot(a.x-b.x,a.y-b.y)};return}
  const g=e.target.closest('[data-t]');ptr={t:g?+g.dataset.t:null,sx:e.clientX,sy:e.clientY,v:{...S.view},moved:false}});
 svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!ptr)return;
  if(ptr.pinch&&pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);const c=svgPt(svg,(a.x+b.x)/2,(a.y+b.y)/2);zoom(ptr.d/d,c.x,c.y);ptr.d=d;return}
  if(Math.hypot(e.clientX-ptr.sx,e.clientY-ptr.sy)>4)ptr.moved=true;if(!ptr.moved||ptr.pinch)return;
  svg.classList.add('panning');const r=svg.getBoundingClientRect(),s=Math.max(ptr.v.w/r.width,ptr.v.h/r.height);setView({...ptr.v,x:ptr.v.x-(e.clientX-ptr.sx)*s,y:ptr.v.y-(e.clientY-ptr.sy)*s})});
 const end=e=>{pts.delete(e.pointerId);svg.classList.remove('panning');if(!ptr)return;const p=ptr;if(pts.size===0)ptr=null;else return;if(p.pinch||p.moved)return;
  if(p.t)pickTable(p.t);else if(S.sel){S.sel=null;setHash('arrangement');render()}};
 svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
 svg.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey&&!S.fs)return;e.preventDefault();const p=svgPt(svg,e.clientX,e.clientY);zoom(e.deltaY>0?1.12:1/1.12,p.x,p.y)},{passive:false});
 svg.addEventListener('keydown',e=>{const g=e.target.closest('[data-t]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pickTable(+g.dataset.t)}});
}

/* ---------- dialogs: Manage Guests (per table) and Unseated guests ---------- */
const D={kind:null,id:null,set:null,q:'',flt:'ok',pick:null,ret:null};
function dGuests(){return GUESTS.filter(g=>D.set.has(g.id))}
function manageHtml(){const t=TABLES.find(x=>x.id===D.id),at=dGuests(),a=at.reduce((s,g)=>s+g.size,0),v=t.cap-a,over=v<0;
 const orig=new Set(seated(t).map(g=>g.id));const added=at.filter(g=>!orig.has(g.id)).length,removed=[...orig].filter(id=>!D.set.has(id)).length;
 const pool=GUESTS.filter(g=>!D.set.has(g.id)&&(!g.table||g.table===t.id)&&(D.flt==='all'||g.status==='ok')&&(!D.q||g.name.toLowerCase().includes(D.q.toLowerCase())));
 const poolAll=GUESTS.filter(g=>!D.set.has(g.id)&&(!g.table||g.table===t.id));
 const nOk=poolAll.filter(g=>g.status==='ok').length;
 return `<div class="dhd"><div class="grow"><h2 id="dlg-t">Manage Guests: Table ${t.num}</h2><p>${SHAPES[t.shape]} · ${t.cap} seats. Add guest parties to this table or remove them.</p></div><button class="dx" data-d="x" aria-label="Close">${I('x')}</button></div>
 <div class="dbody">
  <div class="meter${over?' over':''}" role="status"><div class="row"><span>Seats taken</span><b>${a} of ${t.cap}${over?` · ${-v} over`:` · ${v} free`}</b></div><div class="bar"><i style="width:${Math.min(100,a/t.cap*100)}%"></i></div>
   ${over?`<p>${I('alert',14)}<span>This table ${added||removed?'will have':'has'} ${pl(-v,'attendee')} more than seats. You can still save, but the table will show as over capacity.</span></p>`:''}</div>
  <div class="dsec"><h3>At This Table <em>${at.length}</em></h3>
   ${at.length?`<div class="glist">${at.map(g=>`<div class="gl"><span class="av">${g.ini}</span><div class="grow"><b>${esc(g.name)}</b><small>${pl(g.size,'attendee')} · ${esc(g.group)} ${stBadge(g)}${orig.has(g.id)?'':' <span class="new">· Added</span>'}</small></div><button class="btn ghost sm" data-d="rm" data-g="${g.id}" aria-label="Remove ${esc(g.name)}">${I('userx',16)}Remove</button></div>`).join('')}</div>`:`<p class="empty1">No guests at this table yet. Add guests from the list below.</p>`}</div>
  <div class="dsec"><h3>Add Guests <em>${poolAll.length}</em></h3>
   <div class="dtools"><label class="field srch">${I('search',18)}<input id="dq" placeholder="Search guests by name..." value="${esc(D.q)}" aria-label="Search guests without a table"></label>
    <div class="seg" role="tablist" aria-label="Filter guests"><button role="tab" aria-selected="${D.flt==='ok'}" class="${D.flt==='ok'?'on':''}" data-d="flt" data-v="ok">Confirmed <em>${nOk}</em></button><button role="tab" aria-selected="${D.flt==='all'}" class="${D.flt==='all'?'on':''}" data-d="flt" data-v="all">All Without Table <em>${poolAll.length}</em></button></div></div>
   ${pool.length?`<div class="glist scroll">${pool.map(g=>`<div class="gl"><span class="av">${g.ini}</span><div class="grow"><b>${esc(g.name)}</b><small>${pl(g.size,'attendee')} · ${esc(g.group)} ${stBadge(g)}</small></div><button class="btn soft sm" data-d="add" data-g="${g.id}" aria-label="Add ${esc(g.name)} to Table ${t.num}">${I('plus',16)}Add</button></div>`).join('')}</div>`
   :`<p class="empty1">${D.q?'No guests match this name.':D.flt==='ok'?'Every confirmed guest has a table. Select "All Without Table" to seat guests who haven\'t answered yet.':'Every guest has a table.'}</p>`}</div>
 </div>
 <div class="dfoot"><span class="sum">${added||removed?[added?`${added} to add`:'',removed?`${removed} to remove`:''].filter(Boolean).join(' · '):'No changes yet'}</span><button class="btn ghost" data-d="x">Cancel</button><button class="btn pri" data-d="save" ${added||removed?'':'disabled'}>${I('save',18)}Save Seating</button></div>`}
function unseatedHtml(){const un=unseatedOk(),ua=un.reduce((s,g)=>s+g.size,0);
 return `<div class="dhd"><div class="grow"><h2 id="dlg-t">Confirmed Attendees Without a Table</h2><p>${ua} attendees in ${pl(un.length,'guest party','guest parties')}. Choose a table for each one.</p></div><button class="dx" data-d="x" aria-label="Close">${I('x')}</button></div>
 <div class="dbody">${un.length?`<div class="dsec"><div class="glist">${un.map(g=>{const open=D.pick===g.id;const fits=TABLES.filter(t=>t.cap-asg(t)>=g.size);
  return `<div class="gl${open?' open':''}"><span class="av">${g.ini}</span><div class="grow"><b>${esc(g.name)}</b><small>${pl(g.size,'attendee')} · ${esc(g.group)}</small></div><button class="btn ${open?'ghost':'soft'} sm" data-d="pick" data-g="${g.id}" aria-expanded="${open}">${open?'Close':`${I('armchair',16)}Seat`}</button></div>
  ${open?`<div class="pick" role="group" aria-label="Tables with room for ${esc(g.name)}">${fits.length?`<p>Tables with ${pl(g.size,'free seat')} or more:</p>${fits.map(t=>`<button data-d="seatat" data-g="${g.id}" data-t="${t.id}">Table ${t.num}<small>${t.cap-asg(t)} free</small></button>`).join('')}`:`<p>No table has ${g.size} free seats. Open a table and seat them there anyway, or free up seats first.</p>`}</div>`:''}`}).join('')}</div></div>`
 :`<div class="empty1" style="text-align:center;padding:32px 0">${I('checkc',32)}<p style="margin-top:8px">Every confirmed attendee has a table.</p></div>`}</div>
 <div class="dfoot"><button class="btn pri" data-d="x">Done</button></div>`}
function drawDlg(){const keep=document.activeElement&&document.activeElement.id==='dq';$('dlg').innerHTML=D.kind==='manage'?manageHtml():unseatedHtml();
 if(keep){const i=$('dq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
function openDlg(){D.ret=document.activeElement;$('ov').classList.add('open');document.body.style.overflow='hidden';drawDlg();setTimeout(()=>$('dlg').focus(),0)}
function openManage(id){Object.assign(D,{kind:'manage',id,set:new Set(seated(TABLES.find(t=>t.id===id)).map(g=>g.id)),q:'',flt:'ok'});setHash('manage-'+id);openDlg()}
function openUnseated(){Object.assign(D,{kind:'unseated',pick:null});setHash('unseated');openDlg()}
function closeDlg(){$('ov').classList.remove('open');document.body.style.overflow='';D.kind=null;setHash(S.sel?'table-'+S.sel:S.tab==='arr'?'arrangement':'tables');syncMock();if(D.ret&&document.contains(D.ret))D.ret.focus()}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov'){closeDlg();return}
 const b=e.target.closest('[data-d]');if(!b)return;const d=b.dataset.d,g=b.dataset.g?+b.dataset.g:null;
 if(d==='x'){closeDlg();return}
 if(d==='rm'){D.set.delete(g);drawDlg();return}
 if(d==='add'){D.set.add(g);drawDlg();return}
 if(d==='flt'){D.flt=b.dataset.v;drawDlg();return}
 if(d==='save'){const t=TABLES.find(x=>x.id===D.id);let add=0,rem=0;
  GUESTS.forEach(x=>{if(x.table===t.id&&!D.set.has(x.id)){x.table=null;rem++}else if(D.set.has(x.id)&&x.table!==t.id){x.table=t.id;add++}});
  if(!isPhone())S.sel=t.id;closeDlg();render();toast(`Table ${t.num} seating was saved${add||rem?': '+[add?pl(add,'guest party','guest parties')+' added':'',rem?rem+' removed':''].filter(Boolean).join(', '):''}.`);return}
 if(d==='pick'){D.pick=D.pick===g?null:g;drawDlg();return}
 if(d==='seatat'){const x=GUESTS.find(y=>y.id===g),t=TABLES.find(y=>y.id===+b.dataset.t);x.table=t.id;D.pick=null;drawDlg();render();toast(`${x.name} ${x.size===1?'was':'were'} seated at Table ${t.num}.`);return}
});
$('ov').addEventListener('input',e=>{if(e.target.id==='dq'){D.q=e.target.value;drawDlg()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('ov').classList.contains('open')){closeDlg();return}if(S.fs){S.fs=false;render();return}if(S.shapeOpen||S.evOpen){S.shapeOpen=S.evOpen=false;render();return}if($('app').classList.contains('drawer'))setDrawer(false)}
 if(e.key==='Tab'&&$('ov').classList.contains('open')){const f=[...$('dlg').querySelectorAll('button:not([disabled]),input')];if(!f.length)return;const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&(document.activeElement===a||document.activeElement===$('dlg'))){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});

/* ---------- page events ---------- */
function setDrawer(o){$('app').classList.toggle('drawer',o)}
$('burger').onclick=()=>setDrawer(true);$('close').onclick=()=>setDrawer(false);$('scrim').onclick=()=>setDrawer(false);
$('who').onclick=()=>toast("The account menu isn't part of this mockup.");
$('bell').onclick=()=>toast('2 notifications: Grand Garden Hall updated the event time.');
$('mhide').onclick=()=>{$('mock').classList.add('hidden');$('app').classList.remove('withmock')};
$('mseg').onclick=e=>{const b=e.target.closest('[data-mock]');if(b)go(b.dataset.mock)};
document.addEventListener('click',e=>{
 const t=e.target;
 if(S.shapeOpen&&!t.closest('.dd')){S.shapeOpen=false;render()}
 if(S.evOpen&&!t.closest('.evs')){S.evOpen=false;renderEv()}
 const s=t.closest('[data-soon]');if(s){e.preventDefault();toast(`${s.dataset.soon} isn't part of this mockup.`);return}
 const tab=t.closest('[data-tab]');if(tab){S.tab=tab.dataset.tab;S.fs=false;setHash(S.sel?'table-'+S.sel:S.tab==='arr'?'arrangement':'tables');render();return}
 const z=t.closest('[data-z]');if(z){const k=z.dataset.z;if(k==='in')zoom(1/1.25);if(k==='out')zoom(1.25);if(k==='fit')setView(fitView());if(k==='fs'){S.fs=!S.fs;render()}return}
 const pg=t.closest('[data-pg]');if(pg&&!pg.disabled){S.page=+pg.dataset.pg;render();return}
 const sh=t.closest('[data-shape]');if(sh){S.shape=sh.dataset.shape;S.shapeOpen=false;S.page=1;render();return}
 const a=t.closest('[data-a]');
 if(!a){const row=t.closest('[data-row]');if(row)pickTable(+row.dataset.row);return}
 const k=a.dataset.a;e.preventDefault();
 if(k==='evmenu'){S.evOpen=!S.evOpen;renderEv();return}
 if(k==='back'){toast("My Events isn't part of this mockup. See mockup #13.");return}
 if(k==='export'){toast('Tables exported: seating list for 24 tables (Excel).');return}
 if(k==='shapemenu'){S.shapeOpen=!S.shapeOpen;render();return}
 if(k==='manage'){openManage(+a.dataset.id);return}
 if(k==='unseated'){openUnseated();return}
 if(k==='gotable'){const id=+a.dataset.id;if(isPhone()){openManage(id);return}S.tab='arr';pickTable(id);return}
 if(k==='unseat'){const g=GUESTS.find(x=>x.id===+a.dataset.g),tn=TABLES.find(x=>x.id===g.table).num;g.table=null;render();toast(`${g.name} ${g.size===1?'was':'were'} removed from Table ${tn}.`);return}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.page=1;render()}});
let lastPhone=isPhone();addEventListener('resize',()=>{const p=isPhone();if(p!==lastPhone){lastPhone=p;render()}if(!isCompact())setDrawer(false)});

function go(h){if($('ov').classList.contains('open')){$('ov').classList.remove('open');document.body.style.overflow='';D.kind=null}
 S.fs=false;S.sel=null;let m;
 if(h==='tables'){S.tab='tbl'}
 else if((m=h.match(/^table-(\d+)$/))){S.tab='arr';S.sel=+m[1];if(isPhone()){setHash(h);render();openManage(+m[1]);return}}
 else if((m=h.match(/^manage-(\d+)$/))){S.tab=isPhone()?'tbl':'arr';setHash(h);render();openManage(+m[1]);return}
 else if(h==='unseated'){setHash(h);render();openUnseated();return}
 else{S.tab='arr';h='arrangement'}
 setHash(h);render()}
const h0=readHash();go(h0||(isPhone()?'tables':'arrangement'));
}
</script>
</body></html>
