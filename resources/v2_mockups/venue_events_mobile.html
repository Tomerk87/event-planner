<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venue My Events phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: the existing Event Planner product, no new styling
   IDEA: a faithful product screen for screenshotting
   PICTURE: the screen itself
   COLOUR and TYPE: DESIGN_GUIDE.md tokens, Inter
   LAYOUT: fixed-width frames, one per state */
:root{color-scheme:light;--bg:#F6F7FB;--sf:#fff;--sfm:#F8F9FC;--bd:#E5E8F0;--bds:#CFD4E2;--tx:#0F1433;--mu:#5B6480;--sb:#626B85;--pr:#4F46E5;--prh:#4338CA;--prs:#EEF0FF;--prb:#C9CDFB;--nv1:#0F1535;--nv2:#151C47;--nvr:#1B2350;--nvb:#262E5C;--nvt:#F1F3FB;--nvm:#B4BBD6;--sh:0 1px 2px rgb(15 20 51/6%);--shm:0 8px 24px rgb(15 20 51/12%);--shb:0 -4px 16px rgb(15 20 51/8%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--tx);background:#DCDFE8;overflow-x:auto}
ul{list-style:none}a{text-decoration:none;color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.i{flex:none;display:block}
.state{padding:24px 16px 8px;font-size:14px;color:var(--mu);font-weight:500}
.state b{color:var(--tx)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--pr);color:#fff}
.btn.sec{background:#fff;color:var(--pr);border:1px solid var(--prb)}
.btn.sm{height:36px;padding:0 14px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.success{color:#15803D;background:#E6F7EC;border-color:#BDE5CB}
.warning{color:#B45309;background:#FFF4E3;border-color:#F8D8A4}
.info{color:#4338CA;background:#EEF0FF;border-color:#C9CDFB}
.neutral{color:#475069;background:#ECEFF5;border-color:#D9DEEA}
/* sidebar */
.side{background:linear-gradient(180deg,var(--nv1),var(--nv2));color:var(--nvt);display:flex;flex-direction:column;padding:16px}
.logo{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;padding:4px 8px 0}
.logo .mk{width:32px;height:32px;border-radius:8px;background:var(--pr);display:grid;place-items:center;color:#fff}
.ws{position:relative;margin-top:20px}
.wsbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--nvr);border:1px solid var(--nvb);text-align:start;color:var(--nvt)}
.wsbtn.open{border-color:var(--nvm)}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.tile.v{background:linear-gradient(135deg,#6366F1,#4F46E5)}
.tile.p{background:var(--prs);color:var(--pr)}
.wsbtn .nm{font-size:14px;font-weight:600;line-height:1.3}
.wsbtn .sub{font-size:12px;color:var(--nvm)}
.wsbtn .grow{flex:1}
.wsbtn .i:last-child{color:var(--nvm)}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--nvm);text-decoration:none}
.nav a.on{background:var(--nvr);color:var(--nvt);font-weight:600}
.navlbl{font-size:12px;color:var(--nvm);padding:20px 12px 4px}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.lang{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--nvb);background:var(--nvr);font-size:14px}
.lang span{flex:1}
.out{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;font-size:14px;color:var(--nvm)}
/* switcher menu */
.menu{position:absolute;left:0;top:calc(100% + 8px);width:280px;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:5}
.menu h4{font-size:12px;font-weight:500;color:var(--mu);padding:8px 12px 4px}
.mi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;width:100%;text-align:start}
.mi.sel{background:var(--prs)}
.mi .tx{flex:1}
.mi .nm{font-size:14px;font-weight:600;line-height:1.3}
.mi .sub{font-size:12px;color:var(--mu)}
.mi .ck{color:var(--pr)}
.menu .note{border-top:1px solid var(--bd);margin:8px 4px 0;padding:12px 8px 4px;font-size:12px;color:var(--sb)}
/* top bar */
.top{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px}
.ibtn{width:44px;height:44px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--tx)}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--mu)}
.bell em{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:#C81E1E;color:#fff;font-size:11px;font-weight:600;font-style:normal;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.av{width:40px;height:40px;border-radius:50%;background:var(--prs);color:var(--pr);font-size:14px;font-weight:600;display:grid;place-items:center;flex:none}
/* tabs */
.seg{display:flex;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px}
.seg button{height:36px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mu);display:flex;align-items:center;gap:8px;justify-content:center}
.seg button.on{background:var(--pr);color:#fff;font-weight:600}
.cnt{min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--neutral-soft,#ECEFF5);color:#475069;font-size:12px;font-weight:600;display:grid;place-items:center}
.on .cnt{background:#fff;color:var(--pr)}
.field{height:44px;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;color:var(--sb)}
.field.dd{color:var(--tx);font-weight:500}
.field.dd .i{color:var(--mu)}
.field.dd span{flex:1}
.vt{display:flex;border:1px solid var(--bd);border-radius:10px;background:#fff;padding:4px;gap:4px}
.vt button{width:36px;height:34px;border-radius:6px;display:grid;place-items:center;color:var(--mu)}
.vt .on{background:var(--prs);color:var(--pr)}
/* card bits */
.meta{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mu)}
.meta li{display:flex;align-items:center;gap:8px}
.meta .i{color:var(--sb)}
.await{color:#B45309;font-weight:500}
.prog .pl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.bar{height:6px;border-radius:999px;background:var(--bd);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pr);border-radius:999px}
.hint{font-size:12px;color:var(--sb);line-height:1.5}
.dots{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--tx);box-shadow:var(--sh)}
</style></head><body>
<style>
.row{display:flex;gap:40px;align-items:flex-start;padding:0 16px 40px}
.col{width:390px;flex:none}
.col .state{padding-left:0}
.ph{width:390px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 2px 12px rgb(15 20 51/10%)}
.ph.fix{height:844px}
.top{padding:0 16px;gap:12px}
.top .mk{width:40px;height:40px;border-radius:10px;background:var(--pr);display:grid;place-items:center;color:#fff}
.top .sp{flex:1}
.top .bell{margin-right:-4px}
.ct{padding:24px 16px 32px}
.ct h1{font-size:28px;line-height:1.2;font-weight:700}
.ct>p{color:var(--mu);margin-top:4px}
.seg{margin-top:20px}
.seg button{flex:1 1 0;padding:0 6px;gap:6px;white-space:nowrap}
.tb{display:flex;gap:8px;margin-top:12px}
.tb .dd{flex:1;padding:0 12px}
.sbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--prb);background:#fff;color:var(--pr);display:grid;place-items:center;flex:none}
.vt button{width:34px}
.full{width:100%;margin-top:16px}
.cards{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:16px;display:flex;gap:16px}
.cov{width:96px;flex:none;border-radius:10px;position:relative;display:grid;place-items:center;color:#fff;min-height:150px}
.cov .dots{position:absolute;top:8px;right:8px;width:28px;height:28px}
.inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.ttl{display:flex;gap:8px;align-items:flex-start}
.ttl h3{flex:1;font-size:16px;font-weight:600;line-height:1.3}
.ttl .i{color:var(--mu);margin-top:1px}
.inf .badge{align-self:flex-start}
.meta{gap:4px}
.inf .btn{align-self:flex-start;height:36px;padding:0 14px}
.ov{position:absolute;inset:0;background:rgb(15 20 51/55%)}
.drw{position:absolute;top:0;left:0;bottom:0;width:320px;box-shadow:var(--shm)}
.dh{display:flex;align-items:center;justify-content:space-between}
.dh .logo{padding:0 4px}
.xb{width:44px;height:44px;border-radius:10px;border:1px solid var(--nvb);display:grid;place-items:center;color:var(--nvt)}
.drw .menu{width:100%}
.drw .ws{margin-top:16px}
</style>
<div id="app"></div>

logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',

alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
hist:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>',
glass:'<path d="M5.116 4.104A1 1 0 0 1 6.11 3h11.78a1 1 0 0 1 .994 1.105L17.19 20.21A2 2 0 0 1 15.2 22H8.8a2 2 0 0 1-2-1.79z"/><path d="M6 12a5 5 0 0 1 6 0 5 5 0 0 0 6 0"/>',
cake:'<path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3M12 8v3M17 8v3"/><path d="M7 4h.01M12 4h.01M17 4h.01"/>',
brief:'<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/>'
};
const I=(n,s=20)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const COVERS={a:'linear-gradient(135deg,#8B5CF6,#EC4899)',b:'linear-gradient(135deg,#10B981,#3B82F6)',c:'linear-gradient(135deg,#0EA5E9,#6366F1)'};
const ST={
 await:{t:'Awaiting client',c:'warning',i:'clock'},
 sent:{t:'Invitation sent',c:'info',i:'mail'},
 expired:{t:'Invitation expired',c:'warning',i:'alert'},
 joined:{t:'Client joined',c:'success',i:'ccheck'},
 past:{t:'Past',c:'neutral',i:'hist'}};
const EVENTS=[
 {n:"Dana & Yossi's Wedding",d:'Dec 17, 2026',t:'19:30',sp:'Main Hall',cl:'Dana Levi',max:350,st:'joined',conf:212,cov:'b',ic:'glass'},
 {n:'Cohen Bar Mitzvah',d:'Jan 8, 2027',t:'18:00',sp:'Garden',cl:'Rachel Cohen',max:180,st:'sent',sent:'Nov 24',cov:'c',ic:'cake'},
 {n:"Noa & Amit's Wedding",d:'Feb 11, 2027',t:'19:00',sp:'Main Hall',cl:null,max:400,st:'await',cov:'a',ic:'glass'},
 {n:'Peretz Engagement Party',d:'Jan 28, 2027',t:'20:30',sp:'Garden',cl:'Yael Peretz',max:150,st:'expired',exp:'Nov 20',cov:'b',ic:'glass'},
 {n:'Brightline Year-End Party',d:'Mar 4, 2027',t:'20:00',sp:'Garden',cl:'Tal Mizrahi',max:220,st:'joined',conf:96,cov:'c',ic:'brief'},
 {n:"Shira & Ben's Wedding",d:'Oct 22, 2026',t:'19:00',sp:'Main Hall',cl:'Shira Katz',max:300,st:'past',conf:268,cov:'a',ic:'glass'},
 {n:"Miriam's 60th Birthday",d:'Sep 10, 2026',t:'12:30',sp:'Garden',cl:'Miriam Levi',max:120,st:'past',conf:104,cov:'b',ic:'cake'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 if(e.conf!=null){const p=Math.round(e.conf/e.max*100);return `<div class="prog"><div class="pl"><span>${e.conf} confirmed</span><span>${e.max} capacity</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}

{
const card=e=>`<article class="card"><div class="cov" style="background:${COVERS[e.cov]}"><button class="dots" aria-label="More actions">${I('dots',16)}</button>${I(e.ic,36)}</div>

const top=`<header class="top"><button class="ibtn" aria-label="Menu">${I('menu')}</button><span class="mk">${I('logo',20)}</span><span class="sp"></span><span class="bell" aria-label="3 notifications">${I('bell')}<em>3</em></span><span class="av">AG</span></header>`;
const page=`${top}<div class="ct"><h1>My Events</h1><p>Create events in your spaces and share each one with your client.</p>
<div class="seg" role="tablist"><button class="on">All Events <span class="cnt">7</span></button><button>Upcoming <span class="cnt">5</span></button><button>Past <span class="cnt">2</span></button></div>
<div class="tb"><div class="field dd" role="button" aria-label="Filter by space">${I('pin',18)}<span>All spaces</span>${I('down',18)}</div><button class="sbtn" aria-label="Search events">${I('search',20)}</button><div class="vt"><button aria-label="Grid view">${I('grid',18)}</button><button class="on" aria-label="List view">${I('list',18)}</button></div></div>
