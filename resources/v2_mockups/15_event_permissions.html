<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permissions (mockup #15)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mockup #15, venue_event_permissions + client_event_permissions: the event Permissions page, split by side.
   One file: "View as" (mockup controls at the bottom) switches between the venue owner, the client lead and a client editor.
   Venue view reuses mockup #10. Client shell and "Managed by" badge reuse mockups #13/#14. Tokens: DESIGN_GUIDE.md / tokens.css. */
:root{color-scheme:light;--bg:#F6F7FB;--sf:#fff;--sfm:#F8F9FC;--bd:#E5E8F0;--bds:#CFD4E2;--tx:#0F1433;--mu:#5B6480;--sb:#626B85;--pr:#4F46E5;--prh:#4338CA;--prs:#EEF0FF;--prb:#C9CDFB;--nv1:#0F1535;--nv2:#151C47;--nvr:#1B2350;--nvb:#262E5C;--nvt:#F1F3FB;--nvm:#B4BBD6;--own:#D97706;--sh:0 1px 2px rgb(15 20 51/6%);--shm:0 8px 24px rgb(15 20 51/12%);--shb:0 -4px 16px rgb(15 20 51/8%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
ul{list-style:none}a{text-decoration:none;color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.i{flex:none;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--pr);color:#fff}.btn.pri:hover{background:var(--prh)}
.btn.sec{background:#fff;color:var(--pr);border:1px solid var(--prb)}.btn.sec:hover{border-color:var(--pr)}
.btn.soft{background:var(--prs);color:var(--pr)}
.btn.ghost{color:var(--mu)}.btn.ghost:hover{background:var(--sfm)}
.btn.dan{background:#C81E1E;color:#fff}.btn.dan:hover{background:#A51616}
.btn.sm{height:36px;padding:0 14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.icb.dan{background:#FDECEC;color:#C81E1E;border:1px solid #F6C4C4}.icb.dan:hover{border-color:#C81E1E}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.badge.lg{height:28px;padding:0 12px;gap:6px}
.success{color:#15803D;background:#E6F7EC;border-color:#BDE5CB}
.warning{color:#B45309;background:#FFF4E3;border-color:#F8D8A4}
.info{color:#4338CA;background:#EEF0FF;border-color:#C9CDFB}
.neutral{color:#475069;background:#ECEFF5;border-color:#D9DEEA}
.badge.owner .i{color:var(--own)}
/* shell */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30;background:linear-gradient(180deg,var(--nv1),var(--nv2));color:var(--nvt);display:flex;flex-direction:column;padding:16px}
.app.collapsed .side{display:none}
.dh{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;padding:4px 8px 0}
.logo .mk{width:32px;height:32px;border-radius:8px;background:var(--pr);display:grid;place-items:center;color:#fff}
.xb{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--nvb);place-items:center;color:var(--nvt)}
.evs{position:relative;margin-top:20px}
.evbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--nvr);border:1px solid var(--nvb);text-align:start;color:var(--nvt)}
.evbtn.open{border-color:var(--nvm)}
.cov{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;font-size:13px;font-weight:700}
.cov.a{background:linear-gradient(135deg,#8B5CF6,#EC4899)}.cov.b{background:linear-gradient(135deg,#10B981,#3B82F6)}
.evbtn .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}
.evbtn .sub{font-size:12px;color:var(--nvm)}
.evbtn .grow{flex:1;min-width:0}
.evbtn>.i{color:var(--nvm)}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--nvm)}
.nav a:hover{background:var(--nvr)}
.nav a.on{background:var(--nvr);color:var(--nvt);font-weight:600}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
.lang{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--nvb);background:var(--nvr);font-size:14px;width:100%;color:var(--nvt)}
.lang span{flex:1;text-align:start}
.out{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;font-size:14px;color:var(--nvm)}
.menu{position:absolute;left:0;top:calc(100% + 8px);width:100%;min-width:232px;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:5}
.menu h4{font-size:12px;font-weight:500;color:var(--mu);padding:8px 12px 4px}
.mi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;width:100%;text-align:start}
.mi.sel{background:var(--prs)}
.mi .tx{flex:1;min-width:0}.mi .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}.mi .sub{font-size:12px;color:var(--mu)}
.mi .ck{color:var(--pr)}
.mi:hover{background:var(--sfm)}.mi.sel:hover{background:var(--prs)}
.msep{height:1px;background:var(--bd);margin:8px 0}
.mlink{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--pr);width:100%}
.mlink:hover{background:var(--sfm)}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 32px;position:sticky;top:0;z-index:10}
.ibtn{width:44px;height:44px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--tx)}
.top .mk{display:none;width:40px;height:40px;border-radius:10px;background:var(--pr);place-items:center;color:#fff}
.top .sp{flex:1}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--mu)}
.bell em{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:#C81E1E;color:#fff;font-size:11px;font-weight:600;font-style:normal;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.rolei{width:36px;height:44px;display:grid;place-items:center;color:var(--own)}
.av{width:40px;height:40px;border-radius:50%;background:var(--prs);color:var(--pr);font-size:14px;font-weight:600;display:grid;place-items:center;flex:none}
.av.sm{width:32px;height:32px;font-size:12px}
.av.lg{width:48px;height:48px;font-size:16px}
.av.nacc{background:#ECEFF5;color:#475069}
.who{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}.who .i{color:var(--mu)}
/* page */
.content{padding:24px 32px 40px;width:100%;max-width:1344px;display:flex;flex-direction:column;gap:24px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.ph h1{font-size:32px;line-height:1.2;font-weight:700}
.ph p{color:var(--mu);margin-top:4px}
.note{display:flex;gap:12px;padding:16px 20px;border-radius:14px;border:1px solid}
.note.info{background:#EEF0FF;border-color:#C9CDFB}.note.info>.i{color:#4338CA}
.note.warning{background:#FFF4E3;border-color:#F8D8A4}.note.warning>.i{color:#B45309}
.note.neutral{background:#ECEFF5;border-color:#D9DEEA}.note.neutral>.i{color:#475069}
.note>.i{margin-top:2px}
.note b{display:block;font-size:14px;font-weight:600}
.note.info b{color:#4338CA}.note.warning b{color:#B45309}.note.neutral b{color:#475069}
.note p{font-size:14px;color:var(--tx);margin-top:4px}
.note.info p{color:var(--mu)}
.note p strong{font-weight:600}
.note.sm{padding:12px 16px;border-radius:10px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px}
.chd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.chd .grow{display:flex;gap:12px;align-items:flex-start;min-width:0}
.sic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.sic.c{background:var(--prs);color:var(--pr)}.sic.v{background:#ECEFF5;color:#475069}
.chd h2{font-size:18px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chd p{font-size:14px;color:var(--mu);margin-top:4px}
.chd .right{display:flex;align-items:center;gap:12px;flex:none}
.ro{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
/* client card */
.cbody{margin-top:20px;display:flex;flex-direction:column;gap:16px}
.person{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.person .pl{display:flex;align-items:center;gap:16px;min-width:0}
.person h3{font-size:16px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.person .em{font-size:14px;color:var(--mu);overflow-wrap:anywhere}
.person .pa{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:16px 20px;border-radius:10px;background:var(--sfm);border:1px solid var(--bd)}
.facts div>span{display:block;font-size:12px;color:var(--mu)}
.facts div>b{display:block;font-size:14px;font-weight:600;margin-top:2px}
.facts div>b.wk{color:#B45309}
.can{display:flex;gap:8px 24px;flex-wrap:wrap;font-size:14px;color:var(--mu)}
.can li{display:flex;gap:8px;align-items:flex-start}
.can .y .i{color:#15803D;margin-top:2px}.can .n .i{color:var(--sb);margin-top:2px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:24px 16px 8px}
.empty .ic{width:56px;height:56px;border-radius:50%;background:#FFF4E3;color:#B45309;display:grid;place-items:center}
.empty h3{font-size:16px;font-weight:600}
.empty p{font-size:14px;color:var(--mu);max-width:520px}
.empty.sm{padding:8px 16px}
.empty.sm .ic{background:#ECEFF5;color:#475069;width:48px;height:48px}
.muted-line{display:flex;gap:8px;font-size:14px;color:var(--mu)}
.muted-line .i{color:var(--sb);margin-top:2px}
/* tables */
.tbl{margin-top:16px;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{white-space:nowrap;background:var(--sfm);font-weight:500;color:var(--mu);text-align:center;height:46px;padding:0 16px;border-bottom:1px solid var(--bd)}
th.s{text-align:start}
td{height:60px;padding:8px 16px;border-bottom:1px solid var(--bd)}
tr:last-child td{border-bottom:0}
td.c{text-align:center;white-space:nowrap}
.nmc{display:flex;align-items:center;gap:12px;font-weight:500}
.nmc .na{color:var(--mu);font-weight:400}
.you{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:#ECEFF5;color:#475069;font-size:12px;font-weight:600}
.mut{color:var(--mu)}
.mcards{display:none}
.mc{border:1px solid var(--bd);border-radius:14px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:12px}
.mtop{display:flex;gap:12px;align-items:flex-start}
.mtop .grow{flex:1;min-width:0}
.mtop h3{font-size:16px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.nrow .badge{margin-top:1px}
.mtop .em{font-size:14px;color:var(--mu);overflow-wrap:anywhere}
.mfig{display:flex;gap:16px;font-size:14px;color:var(--mu);flex-wrap:wrap}
.mfig b{color:var(--tx);font-weight:600}
/* dialogs */
.ov{position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
.ov.open{display:flex}
.dlg{width:512px;max-width:100%;max-height:calc(100vh - 48px);background:#fff;border-radius:14px;box-shadow:var(--shm);display:flex;flex-direction:column;overflow:hidden}
.dlg:focus{outline:none}
.dhd{display:flex;align-items:flex-start;gap:16px;padding:20px 24px 16px;border-bottom:1px solid var(--bd)}
.dhd .grow{flex:1;min-width:0}
.dhd h2{font-size:18px;font-weight:600;line-height:1.3}
.dhd p{font-size:14px;color:var(--mu);margin-top:4px}
.dhd .icb{color:var(--mu);margin:-6px -8px 0 0}
.dbody{padding:20px 24px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;flex:1;font-size:14px}
.dbody>p{color:var(--mu)}.dbody>p strong{color:var(--tx);font-weight:600}
.dft{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid var(--bd)}
.lbl{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
.icn{position:relative}.icn .i{position:absolute;left:14px;top:13px;color:var(--sb);pointer-events:none}
.inp{display:block;height:44px;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff;padding:0 16px 0 42px;font:inherit;font-size:14px;color:var(--tx)}
.inp::placeholder{color:var(--sb)}.inp:hover{border-color:var(--bds)}
.inp:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.help{font-size:12px;color:var(--mu);margin-top:8px;line-height:1.5}
.err .inp{border-color:#C81E1E}.err .help{color:#C81E1E}
.pts{display:flex;flex-direction:column;gap:8px;color:var(--mu)}
.pts li{display:flex;gap:8px}.pts .i{color:var(--sb);margin-top:2px}.pts .y .i{color:#15803D}
.pts strong{color:var(--tx);font-weight:600}
.box{padding:16px;border-radius:10px;background:var(--sfm);border:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.box h4{font-size:14px;font-weight:600}
/* mockup state switcher (not part of the product) */
.mock{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;display:flex;align-items:center;gap:8px;background:#fff;border:1px dashed var(--bds);border-radius:14px;box-shadow:var(--shm);padding:6px 6px 6px 14px;font-size:12px;color:var(--mu)}
.seg{display:flex;background:#fff;border-radius:14px;gap:4px}
.seg button{height:32px;padding:0 12px;border-radius:10px;font-size:12px;font-weight:500;color:var(--mu)}
.seg button.on{background:var(--pr);color:#fff;font-weight:600}
.mock .hx{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--mu)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--tx);color:#fff;font-size:14px;padding:12px 16px;border-radius:10px;box-shadow:var(--shm);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:70;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:none}
.app.withmock .toast{bottom:80px}
.app.withmock .content{padding-bottom:96px}
.hidden{display:none!important}
/* compact: drawer */
@media (max-width:1023px){
 .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(320px,85vw);transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shm)}
 .app.collapsed .side{display:flex}
 .app.drawer .side{transform:none}
 .scrim{display:block;position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
 .app.drawer .scrim{opacity:1;pointer-events:auto}
 .xb,.top .mk{display:grid}
 .top{padding:0 16px;gap:12px}
 .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* phone */
@media (max-width:767px){
 .who .nm,.who .i{display:none}
 .content{padding:24px 16px 40px;gap:20px}
 .ph h1{font-size:28px}
 .note{padding:16px}
 .card{padding:16px}
 .chd{flex-direction:column;gap:12px}
 .chd .right{width:100%;justify-content:space-between}
 .chd .right .btn{flex:1}
 .person{flex-direction:column;align-items:stretch}
 .person .pa{gap:12px}
 .person .pa .btn{height:44px;flex:1 1 auto}
 .person .pa .icb{width:44px;height:44px}
 .person .pa .btn.wide{order:3;flex-basis:100%}
 .facts{grid-template-columns:1fr 1fr;padding:16px}
 .can{flex-direction:column}
 .empty .btn{width:100%}
 .card.list{background:none;border:0;box-shadow:none;padding:0}
 .card.list .tbl{display:none}
 .card.list .mcards{display:flex;flex-direction:column;gap:12px;margin-top:16px}
 .card.list .chd .right .btn{flex:none}
 .ov{padding:0;align-items:stretch}
 .ov.sheet{align-items:flex-end}
 .dlg{width:100%;max-height:none;height:100%;border-radius:0}
 .ov.sheet .dlg{height:auto;max-height:90vh;border-radius:14px 14px 0 0}
 .dhd{padding:16px;align-items:center}
 .dbody{padding:20px 16px 24px}
 .dft{padding:12px 16px;box-shadow:var(--shb);border-top:0}
 .dft .btn{flex:1}
 .toast{left:16px;right:16px;bottom:16px}
 .app.withmock .toast{bottom:72px}
 .mock{left:8px;right:8px;transform:none;justify-content:space-between;padding:6px}
 .mock>span{display:none}
 .seg button{padding:0 8px}
 .app.dlgopen .mock{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- added for mockup #15 ---------- */
.danger{color:#C81E1E;background:#FDECEC;border-color:#F6C4C4}
/* "Managed by" badge, from mockups #13/#14 */
.mgd{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.4;border:1px solid #C9CDFB;background:#EEF0FF;color:#4338CA;text-align:start;max-width:100%}
button.mgd:hover{border-color:#4338CA}
.mgd .i{flex:none}
.evbtn .sub{display:block;margin-top:2px;line-height:1.4}
.evbtn .sub .i{display:inline-block;vertical-align:-2px;margin-right:4px}
.cov.g1{background:linear-gradient(135deg,#8B5CF6,#EC4899)}.cov.g2{background:linear-gradient(135deg,#10B981,#3B82F6)}.cov.g3{background:linear-gradient(135deg,#0EA5E9,#6366F1)}
.mi .sub .i{display:inline-block;vertical-align:-2px;margin-right:4px}
.rolei.ed{color:var(--pr)}
.whob{position:relative}
.whob .menu{left:auto;right:0;width:260px;min-width:0}
.ume{padding:8px 12px 4px}.ume b{display:block;font-size:14px}.ume span{font-size:12px;color:var(--mu)}
.phm{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:12px}
.phm .ctx{font-size:14px;color:var(--mu);display:flex;align-items:center;gap:6px}
.phm .ctx .i{color:var(--sb)}
/* KPI row, as on today's Permissions page */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.kpi .l{font-size:14px;color:var(--mu)}
.kpi .n{font-size:24px;font-weight:700;line-height:1.2;margin-top:2px}
.kpi .u{font-size:12px;color:var(--sb)}
.kic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.t-pr{background:#EEF0FF;color:#4F46E5}.t-wa{background:#FFF4E3;color:#D97706}.t-ne{background:#ECEFF5;color:#475069}
/* search + role filter */
.tools{display:flex;gap:12px;margin-top:16px}
.tools .icn{flex:1;min-width:0}
.ddw{position:relative;flex:none}
.ddb{height:44px;border:1px solid var(--bd);border-radius:10px;padding:0 12px 0 16px;display:flex;align-items:center;gap:8px;font-size:14px;background:#fff;white-space:nowrap}
.ddb:hover{border-color:var(--bds)}

   <div class="pa">${ex?'':`<button class="btn sec sm" data-a="resend">${I('resend',18)}Resend</button>`}<button class="btn sec sm${ex?'':' wide'}" data-a="different">${I('swap',18)}Invite a Different Client</button><button class="icb dan" data-a="revoke" aria-label="Revoke invitation" title="Revoke invitation">${I('ban',18)}</button></div></div>

const clientCard=()=>{const c=S.c;

const RF=[['all','All Roles'],['Lead','Client Lead'],['Editor','Editor'],['Viewer','Viewer']];

const filtered=()=>{const q=S.q.trim().toLowerCase();
 return CTEAM.filter(m=>(S.rf==='all'||m.r===S.rf)&&(!q||(m.n||'').toLowerCase().includes(q)||m.e.includes(q)))};
const rowActs=m=>{
 if(m.e===ME[S.view].e)return youP;
 if(!canManage()||m.r==='Lead')return '';
 const who=m.pending?m.e:m.n;
 return `<span class="acts"><button class="btn sec sm" data-a="role" data-id="${m.id}">${I('pencil',18)}Change Role</button><button class="icb dan" data-a="remove" data-id="${m.id}" aria-label="${m.pending?'Cancel invitation to':'Remove'} ${esc(who)}" title="${m.pending?'Cancel invitation':'Remove from your team'}">${I('trash',18)}</button></span>`};
const teamRows=()=>{const rows=filtered(),meE=ME[S.view].e;
 const none=`<div class="nores">No one matches “${esc(S.q)}”${S.rf!=='all'?' in this role':''}.</div>`;
 const tb=rows.map(m=>`<tr><td><div class="nmc"><span class="av sm${m.pending?' nacc':''}">${m.pending?m.e[0].toUpperCase():initials(m.n)}</span>${m.pending?`<span class="na">No account yet</span>${pend}`:esc(m.n)}</div></td><td dir="ltr" style="text-align:left">${esc(m.e)}</td><td class="c">${cRole(m.r)}</td><td class="c">${m.pending?`<span class="mut">Invited ${m.since}</span>`:m.since}</td><td class="act">${rowActs(m)}</td></tr>`).join('');
 const cards=rows.map(m=>{const acts=m.e!==meE&&canManage()&&m.r!=='Lead';
  return `<article class="mc"><div class="mtop"><span class="av${m.pending?' nacc':''}">${m.pending?m.e[0].toUpperCase():initials(m.n)}</span><div class="grow"><div class="nrow"><h3>${m.pending?'No account yet '+pend:esc(m.n)+(m.e===meE?' '+youP:'')}</h3>${cRole(m.r)}</div><div class="em" dir="ltr">${esc(m.e)}</div></div></div><div class="mfig"><span>${m.pending?'Invited':'Member since'} <b>${m.since}</b></span></div>
  ${acts?`<div class="mact"><button class="btn sec" data-a="role" data-id="${m.id}">${I('pencil',18)}Change Role</button><button class="icb dan" data-a="remove" data-id="${m.id}" aria-label="${m.pending?'Cancel invitation to '+esc(m.e):'Remove '+esc(m.n)}">${I('trash',18)}</button></div>`:''}</article>`}).join('');
 return `<div class="tbl">${rows.length?`<table><thead><tr><th class="s" style="width:28%">Name</th><th class="s">Email</th><th style="width:180px">Role</th><th style="width:180px">Member Since</th><th><span class="hidden">Actions</span></th></tr></thead><tbody>${tb}</tbody></table>`:none}</div><div class="mcards">${rows.length?cards:none}</div>`};
const rfDD=()=>{const open=S.menu==='rf',cur=RF.find(r=>r[0]===S.rf);
 return `<button class="ddb" id="rfb" aria-haspopup="listbox" aria-expanded="${open}" aria-label="Filter by role: ${cur[1]}">${cur[1]}${I('down',18)}</button>
 ${open?`<div class="menu" role="listbox" aria-label="Filter by role">${RF.map(r=>`<button class="mi${r[0]===S.rf?' sel':''}" role="option" aria-selected="${r[0]===S.rf}" data-rf="${r[0]}"><span class="tx">${r[1]}</span>${r[0]===S.rf?`<span class="ck">${I('check',18)}</span>`:''}</button>`).join('')}</div>`:''}`};
const kpis=()=>{const n=r=>CTEAM.filter(m=>m.r===r).length;
 const k=(l,v,u,ic,t)=>`<div class="kpi"><div><div class="l">${l}</div><div class="n">${v}</div><div class="u">${u}</div></div><span class="kic ${t}">${I(ic,22)}</span></div>`;

const yourTeam=()=>{const L=lead();
 return `<section class="card list" aria-labelledby="h-yteam"><div class="chd"><div class="grow"><span class="sic c">${I('heart',20)}</span><div><h2 id="h-yteam">Your Team <span class="side-tag">· Client side</span></h2><p>${canManage()?'The people helping you plan. You decide who joins and what they can do.':`People ${esc(first(L.n))} invited to help plan. Only ${esc(L.n)}, the client lead, can invite people or change roles.`}</p></div></div>${canManage()?'':`<div class="right"><span class="badge neutral ro">${I('lock',12)}View only</span></div>`}</div>
 <div class="tools"><div class="icn">${I('search',18)}<input class="inp" id="q" type="search" placeholder="Search by name or email…" value="${esc(S.q)}" aria-label="Search your team"></div><div class="ddw" id="rfw">${rfDD()}</div></div>
 <div id="trows" style="margin-top:0">${teamRows()}</div></section>`};
const venueTeamClientSide=()=>`<section class="card list" aria-labelledby="h-vteam"><div class="chd"><div class="grow"><span class="sic v">${I('bld',20)}</span><div><h2 id="h-vteam">${VENUE.name} Team <span class="side-tag">· Venue side</span></h2><p>The venue's people who can open this event. They are managed by ${VENUE.name}, not by you.</p></div></div><div class="right"><span class="badge neutral ro">${I('lock',12)}View only</span></div></div>

const clientMain=()=>`<div class="ph"><div><h1>Permissions</h1><p>Manage who can help you plan this event and what they can do.</p>

 ${open?`<div class="menu" role="listbox" aria-label="Client status"><h4>Client status (mockup)</h4>${STATES.map(([k,l])=>`<button class="mi${k===S.c.st?' sel':''}" role="option" aria-selected="${k===S.c.st}" data-st="${k}"><span class="tx">${l}</span>${k===S.c.st?`<span class="ck">${I('check',16)}</span>`:''}</button>`).join('')}</div>`:''}`};

/* ---------- dialogs ---------- */
let lastFocus=null;
const hd=(t,p)=>`<div class="dhd"><div class="grow"><h2 id="dtitle">${t}</h2>${p?`<p>${p}</p>`:''}</div><button class="icb" data-a="close" aria-label="Close">${I('x')}</button></div>`;
const openDlg=(type,id)=>{S.dlg={type,id:+id||null,err:'',role:'Editor'};if(type==='role')S.dlg.role=CTEAM.find(m=>m.id===S.dlg.id).r;
 lastFocus=document.activeElement;S.menu=null;drawDlg();
 $('ov').classList.add('open');$('ov').classList.toggle('sheet',['resend','revoke','remove'].includes(type));$('app').classList.add('dlgopen');
 setTimeout(()=>{const f=$('dlg').querySelector('input[type=email],input:checked')||$('dlg');f.focus()},0)};
const closeDlg=()=>{S.dlg=null;$('ov').classList.remove('open');$('app').classList.remove('dlgopen');if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus()};
const roleRadios=(sel,name)=>`<fieldset class="radios"><legend>Role</legend>${['Editor','Viewer'].map(r=>`<label class="rad"><input type="radio" name="${name}" value="${r}"${sel===r?' checked':''}><span class="t"><b>${cRole(r)}</b><span class="d">${ROLE_TXT[r]}</span></span></label>`).join('')}</fieldset>`;
const drawDlg=()=>{const d=S.dlg,c=S.c;let h='';
 /* venue side: client invitation dialogs (mockup #10) */
 if(d.type==='invite'||d.type==='different'){const v=$('em')?$('em').value:'',dif=d.type==='different';
  h=hd(dif?'Invite a Different Client':'Invite Client',`They'll get an email from ${VENUE.name} with a link to join ${esc(EV.n)}.`)+`<div class="dbody">
  ${dif?`<div class="note warning sm">${I('alertc',18)}<div><b>The current invitation stops working</b><p>The link sent to <strong dir="ltr">${esc(c.email)}</strong> is cancelled as soon as you send this one.</p></div></div>`:''}
  <div class="${d.err?'err':''}"><label class="lbl" for="em">Client Email</label><div class="icn">${I('mail',18)}<input class="inp" id="em" type="email" inputmode="email" placeholder="name@example.com" value="${esc(v)}" autocomplete="off" aria-describedby="emh"${d.err?' aria-invalid="true"':''}></div><p class="help" id="emh">${d.err||'Use the email they sign in with, or will sign up with. Only this address can accept.'}</p></div>
  <div class="box"><h4>What the client can do</h4>${canList}</div>
  <p class="help" style="margin:0">The link works once and expires after 7 days. The email is sent in the event's language (English).</p></div>
  <div class="dft"><button class="btn ghost" data-a="close">Cancel</button><button class="btn pri" data-a="send">${I('send',18)}Send Invitation</button></div>`}
 if(d.type==='resend'){const ex=c.st==='expired';
  h=hd('Resend the invitation?')+`<div class="dbody"><p>We'll email a new link to <strong dir="ltr">${esc(c.email)}</strong>.${ex?'':' The link sent on '+c.sent+' stops working.'}</p>
  <ul class="pts"><li>${I('clock',16)}<span>The new link expires on <strong>Dec 4, 2026</strong> (7 days).</span></li><li>${I('mail',16)}<span>It's the same email as before, sent in English.</span></li></ul></div>
  <div class="dft"><button class="btn ghost" data-a="close">Cancel</button><button class="btn pri" data-a="doresend">${I('resend',18)}Resend Invitation</button></div>`}
 if(d.type==='revoke'){

 /* client side: team dialogs */
 if(d.type==='minvite'){const v=$('em')?$('em').value:'';
  h=hd('Invite to Your Team',`They'll get an email with a link to help plan ${esc(EV.n)}.`)+`<div class="dbody">
  <div class="${d.err?'err':''}"><label class="lbl" for="em">Email</label><div class="icn">${I('mail',18)}<input class="inp" id="em" type="email" inputmode="email" placeholder="name@example.com" value="${esc(v)}" autocomplete="off" aria-describedby="emh"${d.err?' aria-invalid="true"':''}></div><p class="help" id="emh">${d.err||'They can sign in or create an account with this email.'}</p></div>
  ${roleRadios(d.role,'nr')}
  <p class="muted-line" style="margin:0">${I('bld',16)}<span>Your team works on the client side only. They can't change the date, room or tables, which stay with ${VENUE.name}.</span></p></div>
  <div class="dft"><button class="btn ghost" data-a="close">Cancel</button><button class="btn pri" data-a="msend">${I('send',18)}Send Invitation</button></div>`}
 if(d.type==='role'){const m=CTEAM.find(x=>x.id===d.id);
  h=hd('Change Role',m.pending?`The invitation to ${esc(m.e)} hasn't been accepted yet. The new role applies when they join.`:'')+`<div class="dbody">
  <div class="dmember"><span class="av sm${m.pending?' nacc':''}">${m.pending?m.e[0].toUpperCase():initials(m.n)}</span><div><b>${m.pending?'No account yet':esc(m.n)}</b><span dir="ltr">${esc(m.e)}</span></div></div>
  ${roleRadios(d.role,'cr')}
  <p class="help" style="margin:0">Only one person can be the client lead. To hand the lead to someone else, contact Event Planner support.</p></div>
  <div class="dft"><button class="btn ghost" data-a="close">Cancel</button><button class="btn pri" data-a="dorole"${d.role===m.r?' disabled':''}>Save Role</button></div>`}
 if(d.type==='remove'){const m=CTEAM.find(x=>x.id===d.id);
  h=m.pending?hd('Cancel the invitation?')+`<div class="dbody"><p>The link sent to <strong dir="ltr">${esc(m.e)}</strong> stops working right away.</p>
   <ul class="pts"><li>${I('userplus',16)}<span>You can invite them again at any time.</span></li></ul></div>
   <div class="dft"><button class="btn ghost" data-a="close">Keep</button><button class="btn dan" data-a="doremove">${I('ban',18)}Cancel Invitation</button></div>`
  :hd(`Remove ${esc(m.n)}?`)+`<div class="dbody"><p><strong>${esc(m.n)}</strong> loses access to ${esc(EV.n)} right away.</p>
   <ul class="pts"><li>${I('check',16)}<span>Guests, messages and seating they changed stay as they are.</span></li><li>${I('userplus',16)}<span>You can invite them again at any time.</span></li></ul></div>
   <div class="dft"><button class="btn ghost" data-a="close">Cancel</button><button class="btn dan" data-a="doremove">${I('trash',18)}Remove</button></div>`}
 $('dlg').innerHTML=h};

const setDrawer=o=>{$('app').classList.toggle('drawer',o);if(!o&&S.menu==='evs'){S.menu=null;renderSide()}};
const SOON={Dashboard:'Opens the event Dashboard.',Guests:'Opens Guests.',RSVP:'Opens RSVP.',Messages:'Opens Messages.','Event Layout':'Opens the Event Layout.','Event Settings':'Opens Event Settings.',team:'Opens the venue Team page (mockup #7).',back:'Goes back to My Events.',other:'Switching events isn\'t part of this mockup.',lang:'Language: English, עברית, Português.',profile:'Profile isn\'t part of this mockup.',logout:'Log out isn\'t part of this mockup.',mailv:'Opens your email app.',callv:'Opens your phone app.'};
const closeMenus=()=>{if(!S.menu)return;const m=S.menu;S.menu=null;if(m==='evs')renderSide();else if(m==='who')renderTop();else if(m==='rf')$('rfw').innerHTML=rfDD();else renderMock()};
const toggleMenu=(k,fn)=>{const o=S.menu===k;closeMenus();S.menu=o?null:k;fn()};
const valEmail=v=>!v?'Enter an email address.':!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?'Enter a valid email, like name@example.com.':'';

document.addEventListener('click',ev=>{const t=ev.target.closest('button,a,[data-a]');
 if(ev.target===$('ov')){closeDlg();return}
 if(ev.target===$('scrim')){setDrawer(false);return}
 if(S.menu&&!(t&&(t.closest('.menu')||['evb','who','rfb','mstb'].includes(t.id))))closeMenus();
 if(!t||t.disabled)return;
 if(t.tagName==='A')ev.preventDefault();
 const d=t.dataset,c=S.c;
 if(t.id==='evb'){toggleMenu('evs',renderSide);return}
 if(t.id==='who'){toggleMenu('who',renderTop);return}
 if(t.id==='rfb'){toggleMenu('rf',()=>$('rfw').innerHTML=rfDD());return}
 if(t.id==='mstb'){toggleMenu('mst',renderMock);return}
 if(d.rf){S.rf=d.rf;S.menu=null;$('rfw').innerHTML=rfDD();$('trows').innerHTML=teamRows();$('rfb').focus();return}
 if(d.st){S.menu=null;S.c={...BASE[d.st]};setHash(null,'','#venue'+(d.st==='joined'?'':'-'+d.st));render();return}
 if(d.view){setView(d.view);return}
 if(d.soon){closeMenus();toast(SOON[d.soon]||'Drawn in its own mockup.');return}
 if(t.id==='burger'){if(matchMedia('(max-width:1023px)').matches)setDrawer(true);else $('app').classList.toggle('collapsed');return}
 if(t.id==='close'){setDrawer(false);return}
 if(t.id==='mhide'){$('app').classList.remove('withmock');$('mock').classList.add('hidden');return}
 if(t.id==='mgdbtn'){S.pop=true;renderPop();return}
 switch(d.a){
  case 'closepop':S.pop=false;renderPop();$('mgdbtn')?.focus();return;
  case 'invite':case 'different':case 'resend':case 'revoke':case 'minvite':case 'role':case 'remove':openDlg(d.a,d.id);return;
  case 'close':closeDlg();return;
  case 'email':toast(`Opens your email app, addressed to ${c.email}.`);return;
  case 'send':{const v=$('em').value.trim().toLowerCase();
   const err=valEmail(v)||((S.dlg.type==='different'&&v===c.email)?'This is the current invitation. Use Resend instead.':VTEAM.some(m=>m.e===v)?'This person is on your venue team. Invite the client\'s own email.':'');
   if(err){S.dlg.err=err;drawDlg();$('em').focus();return}
   S.c={st:'sent',email:v,sent:TODAY,by:'Avi Golan',exp:'Dec 4, 2026',times:1};closeDlg();render();toast(`Invitation sent to ${v}.`);return}
  case 'doresend':S.c={st:'sent',email:c.email,sent:TODAY,by:'Avi Golan',exp:'Dec 4, 2026',times:(c.times||1)+1};closeDlg();render();toast(`A new invitation link was sent to ${c.email}.`);return;
  case 'dorevoke':{const e=c.email;S.c={...BASE.await};closeDlg();render();toast(`The invitation to ${e} was revoked.`);return}
  case 'msend':{const v=$('em').value.trim().toLowerCase();
   const err=valEmail(v)||(CTEAM.some(m=>m.e===v)?'This person is already on your team.':VTEAM.some(m=>m.e===v)?`This person is on the ${VENUE.name} team. They already open the event from the venue side.`:'');
   if(err){S.dlg.err=err;drawDlg();$('em').focus();return}
   const r=S.dlg.role;CTEAM.push({id:nextId++,e:v,r,pending:1,since:TODAY});closeDlg();S.q='';S.rf='all';renderMain();toast(`Invitation sent to ${v} as ${r==='Editor'?'an Editor':'a Viewer'}.`);return}
  case 'dorole':{const m=CTEAM.find(x=>x.id===S.dlg.id);m.r=S.dlg.role;closeDlg();renderMain();toast(`${m.pending?m.e:m.n} is now ${m.r==='Editor'?'an Editor':'a Viewer'}.`);return}
  case 'doremove':{const m=CTEAM.find(x=>x.id===S.dlg.id);CTEAM=CTEAM.filter(x=>x!==m);closeDlg();renderMain();toast(m.pending?`The invitation to ${m.e} was cancelled.`:`${m.n} was removed from your team.`);return}
 }
});
/* role radios keep their value across redraws (validation errors) */
document.addEventListener('change',e=>{if(e.target.name==='nr'||e.target.name==='cr'){S.dlg.role=e.target.value;if(e.target.name==='cr'){const m=CTEAM.find(x=>x.id===S.dlg.id);$('dlg').querySelector('[data-a="dorole"]').disabled=S.dlg.role===m.r}}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('trows').innerHTML=teamRows()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(S.dlg)closeDlg();else if(S.pop){S.pop=false;renderPop();$('mgdbtn')?.focus()}else if(S.menu)closeMenus();else setDrawer(false)}
 if(e.key==='Enter'&&S.dlg&&e.target.id==='em'){e.preventDefault();$('dlg').querySelector('.dft .btn.pri').click()}
 if(e.key==='Tab'&&S.dlg){const f=[...$('dlg').querySelectorAll('button:not([disabled]),input')];if(!f.length)return;const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
/* deep links: #venue, #venue-sent (any client status), #lead, #editor */
const fromHash=()=>{const h=location.hash.slice(1);
 if(h==='lead'||h==='editor'){S.view=h;S.c={...BASE.joined}}
 else{S.view='venue';const st=h.split('-')[1];S.c={...BASE[BASE[st]?st:'joined']}}
 S.menu=null;S.pop=false;renderPop();render()};
window.addEventListener('hashchange',fromHash);
fromHash();
}
</script>
</body></html>
