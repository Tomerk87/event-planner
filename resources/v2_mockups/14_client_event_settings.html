function dd(id,label,opts,val,help){
 // opts: [value, main, sub, tag]
 const cur=opts.find(o=>o[0]===val);
 return `<div class="fld" id="f-${id}"><span class="lb" id="l-${id}"><span class="lbl">${label}<span class="req" aria-hidden="true">*</span><span class="dirty-dot" title="Changed"></span></span></span>
  <div class="dd" id="dd-${id}">${ddInner(id,opts,cur)}</div>
  <span class="help">${help}</span></div>`;
}
function ddInner(id,opts,cur){
 const open=S.menu==='dd-'+id;
 return `<button type="button" class="ddb" data-dd="${id}" aria-haspopup="listbox" aria-expanded="${open}" aria-labelledby="l-${id}"><span class="v"><span class="flag">${cur[3]}</span>${esc(cur[1])}</span>${I('down',18)}</button>`+
 (open?`<div class="menu ddm" role="listbox" aria-labelledby="l-${id}">${opts.map(o=>`<button type="button" class="mi ${o[0]===cur[0]?'sel':''}" role="option" aria-selected="${o[0]===cur[0]}" data-opt="${id}:${o[0]}"><span class="flag">${o[3]}</span><span class="tx"><span class="nm">${esc(o[1])}</span>${o[2]?`<span class="sub">${esc(o[2])}</span>`:''}</span>${o[0]===cur[0]?I('check',18,'ck'):''}</button>`).join('')}</div>`:'');
}
const langOpts=()=>LANGS.map(l=>[l[0],l[1],l[2],l[3]]);
const ctyOpts=()=>COUNTRIES.map(c=>[c[0],c[1],'Country code '+c[2],c[0]]);

function renderPage(){
 const c=COVERS[F.cover];
 $('content').innerHTML=`
 <div class="ph"><div><h1>Event Settings</h1><p>Update your event information and defaults.</p></div>
  <div class="acts"><button class="btn ghost hidden" id="discard">Discard</button><button class="btn pri" id="save" disabled>${I('save',18)}Save Changes</button></div></div>
 <div class="grid2">
  <div class="col">
   <section class="card" aria-labelledby="vd-h">
    <div class="chd"><div><h2 id="vd-h">Venue Details</h2><p>The date, place and size of your event.</p></div>${mgdBadge('button','id="mgdbtn" aria-haspopup="dialog"')}</div>
    <div class="vnote" role="note">${I('bld',20)}<div class="grow"><b>Maintained by ${esc(VENUE.name)}. Contact them to change it.</b>
     <p>These details are set by the venue for everyone planning this event.</p>
     <div class="cts"><a href="#" data-toast="Opens your email app.">${I('mail',16)}${VENUE.email}</a><a href="#" data-toast="Opens your phone app.">${I('phone',16)}${VENUE.phone}</a></div></div></div>
    <dl class="vd">
     <div class="r"><dt>${I('calclock',18)}Date and Time</dt><dd>${EV.day}, ${EV.date} · ${EV.time}<small>Time zone: ${EV.tz} · Israel</small></dd></div>
     <div class="r"><dt>${I('bld',18)}Space</dt><dd>${esc(VENUE.space)}<small>${esc(VENUE.name)} · ${EV.tables} tables</small></dd></div>
     <div class="r"><dt>${I('pin',18)}Address</dt><dd>${esc(VENUE.address)}<br><a href="#" class="lnk" data-toast="Opens Google Maps in a new tab.">${I('ext',14)}Open in Google Maps</a><small>Shown to guests on the RSVP page, with links to Google Maps and Waze.</small></dd></div>
     <div class="r"><dt>${I('users',18)}Maximum Attendees</dt><dd>${EV.max} people<small>${EV.conf} attendees have confirmed so far.</small></dd></div>
     <div class="r"><dt>${I('checkc',18)}Event Status</dt><dd><span class="badge lg success">${I('checkc',14)}Upcoming</span><small>Your event is active and visible to guests.</small></dd></div>
    </dl>
   </section>

   <section class="card" aria-labelledby="ys-h">
    <div class="chd"><div><h2 id="ys-h">Your Settings</h2><p>You can change these at any time.</p></div></div>
    <div class="form">
     <div class="fld" id="f-name"><label for="in-name"><span class="lbl">Event Name<span class="req" aria-hidden="true">*</span><span class="dirty-dot" title="Changed"></span></span><span class="cnt" id="cnt-name">${F.name.length}/80</span></label>
      <input class="inp" id="in-name" maxlength="80" value="${esc(F.name)}" aria-describedby="h-name" required>
      <span class="help" id="h-name">Shown to guests on the RSVP page and in your messages.</span></div>
     <div class="fld" id="f-cover"><span class="lb"><span class="lbl">Event Photo<span class="dirty-dot" title="Changed"></span></span></span>
      <div class="photo"><span class="pcov ${c[0]}" id="pcov">${I(c[1],36)}</span><div><button class="btn sec sm" id="upload">${I('image',18)}Upload Photo</button><p class="help">JPG or PNG, up to 5 MB. Without a photo the event keeps its generated cover.</p></div></div></div>
     ${dd('lang','RSVP Page Language',langOpts(),F.lang,'The language guests see first on the RSVP page. They can switch it there.')}
     <div class="sub-h"><h3>Guests</h3><p>How many people a guest can confirm.</p></div>
     <div class="fld" id="f-pg"><label for="in-pg"><span class="lbl">Maximum Attendees per Guest<span class="req" aria-hidden="true">*</span><span class="dirty-dot" title="Changed"></span></span></label>
      <input class="inp" id="in-pg" type="number" inputmode="numeric" min="1" max="10" value="${esc(F.perGuest)}" aria-describedby="h-pg" required>
      <span class="help" id="h-pg">The most people a guest can confirm for one invitation. Allowed range: 1 – 10.</span></div>
     ${dd('cty','Phone Number Country',ctyOpts(),F.country,'Phone numbers typed without a country code are read as numbers from this country.')}
     <div class="rnote info">${I('info',20)}<div class="grow"><b>Expected Attendees is for your planning</b><p>New guests start with this number as their Expected Attendees, which you can change for each guest. It does not limit what a guest confirms; this maximum does. Lowering it keeps answers already given.</p></div></div>
    </div>
   </section>
  </div>

  <div class="col">
   <section class="card"><div class="chd"><div><h2>RSVP Settings</h2><p>When guests can respond.</p></div></div>
    <div class="rnote info">${I('info',20)}<div class="grow"><b>RSVP remains open until the event start time.</b><p>Guests can submit and update their RSVP at any time until ${EV.date}, ${EV.time} (${EV.tz}). If ${esc(VENUE.name)} moves the date, this follows it.</p></div></div>
   </section>
   <section class="card"><div class="chd"><div><h2>Capacity Summary</h2><p>Current event capacity and attendance overview.</p></div></div>
    <div class="ckpis">
     <div class="kpi"><div><div class="l">Maximum Attendees</div><div class="n">${EV.max}</div><div class="u">people</div></div><span class="kic t-pr">${I('users',22)}</span></div>
     <div class="kpi"><div><div class="l">Confirmed Attendees</div><div class="n">${EV.conf}</div><div class="u">people</div></div><span class="kic t-ok">${I('userck',22)}</span></div>
     <div class="kpi"><div><div class="l">Seating Capacity</div><div class="n">${EV.seats}</div><div class="u">chairs</div></div><span class="kic t-wa">${I('sofa',22)}</span></div>
     <div class="kpi"><div><div class="l">Unassigned Confirmed Attendees</div><div class="n">${EV.unassigned}</div><div class="u">people</div></div><span class="kic t-da">${I('userx',22)}</span></div>
    </div>
    <button class="rnote info link" data-page="Event Layout">${I('chair',20)}<span class="grow"><b>Confirmed attendees without a table</b><p>${EV.unassigned} confirmed attendees are not seated yet. There are ${EV.seats} chairs for ${EV.conf} confirmed attendees.</p></span>${I('right',18)}</button>
    <p class="capnote">${I('bld',14)}<span>The maximum attendees and the tables are set by ${esc(VENUE.name)}.</span></p>
   </section>
   <section class="card rules"><div class="chd"><div><h2>Event Rules</h2><p>Important information about event changes and limitations.</p></div></div>
    <div class="rnote warning">${I('alert',20)}<div class="grow"><b>Past events become read-only</b><p>After the event start time (${EV.date}, ${EV.time}), this event will be locked and become read-only. You will still be able to view all data, but you won't be able to make changes to guests, seating, or settings.</p>
     <button class="btn sec sm rbtn" data-toast="Event Rules opens the existing rules dialog.">${I('file',18)}View Event Rules</button></div></div>
   </section>
  </div>
 </div>`;
 $('bbar').innerHTML=`<button class="btn sec" id="discard2" disabled>Discard</button><button class="btn pri" id="save2" disabled>${I('save',18)}Save Changes</button>`;
 syncDirty();
}

/* ---------- form state ---------- */
function pgError(){const v=F.perGuest.trim();if(v==='')return 'Enter a number from 1 to 10.';const n=Number(v);if(!Number.isInteger(n)||n<1||n>10)return 'Enter a whole number from 1 to 10.';return ''}
function nameError(){return F.name.trim()===''?'Enter an event name.':''}
const KEYS=[['name','f-name'],['cover','f-cover'],['lang','f-lang'],['perGuest','f-pg'],['country','f-cty']];
function changes(){return KEYS.filter(([k])=>String(F[k])!==String(SAVED[k])).length}
function setErr(fid,hid,msg,def){const f=$(fid),h=$(hid);if(!f)return;f.classList.toggle('err',!!msg);h.textContent=msg||def;const i=f.querySelector('input');if(i)i.setAttribute('aria-invalid',msg?'true':'false')}
function syncDirty(){
 const n=changes(),bad=!!(pgError()||nameError());
 KEYS.forEach(([k,fid])=>$(fid)?.classList.toggle('changed',String(F[k])!==String(SAVED[k])));
 setErr('f-pg','h-pg',pgError(),'The most people a guest can confirm for one invitation. Allowed range: 1 – 10.');
 setErr('f-name','h-name',nameError(),'Shown to guests on the RSVP page and in your messages.');
 ['save','save2'].forEach(id=>{const b=$(id);if(b){b.disabled=n===0||bad;b.innerHTML=I('save',18)+(n?`Save Changes (${n})`:'Save Changes')}});
 const d=$('discard');if(d)d.classList.toggle('hidden',n===0);
 const d2=$('discard2');if(d2)d2.disabled=n===0;
}
function save(){
 if(pgError()||nameError()){toast('Fix the highlighted fields before saving.');return}
 F.perGuest=String(Number(F.perGuest));Object.assign(SAVED,F);
 S.menu=null;renderSide();renderPage();toast('Your settings were saved.');
}
function discard(){F={...SAVED};S.menu=null;renderPage();toast('Changes discarded.')}
function rerenderDD(id){
 const opts=id==='lang'?langOpts():ctyOpts(),val=id==='lang'?F.lang:F.country;
 $('dd-'+id).innerHTML=ddInner(id,opts,opts.find(o=>o[0]===val));
}

/* ---------- venue popover (from mockup #13) ---------- */
function renderPop(){
 const v=VENUE;
 $('popwrap').innerHTML=S.pop?`<div class="popscrim" data-act="closepop"></div>
 <div class="pop center" role="dialog" aria-modal="true" aria-labelledby="poph">
  <div class="phd"><span class="sic">${I('bld',20)}</span><div class="grow"><b id="poph">Managed by ${esc(v.name)}</b><span>${esc(v.space)} · ${esc(v.address)}</span></div><button class="xbtn" data-act="closepop" aria-label="Close" id="popx">${I('x',18)}</button></div>
  <p style="color:var(--mu)">You were invited to plan this event by ${esc(v.name)}. Here is who takes care of what.</p>
  <div class="split">
   <div><h5>You manage</h5><ul class="y"><li>${I('check',14)}Guests and import</li><li>${I('check',14)}RSVP page</li><li>${I('check',14)}WhatsApp messages</li><li>${I('check',14)}Seating guests at tables</li><li>${I('check',14)}Your team</li></ul></div>
   <div><h5>${esc(v.name)} manages</h5><ul class="v"><li>${I('bld',14)}Date and time</li><li>${I('bld',14)}Space and address</li><li>${I('bld',14)}Maximum attendees</li><li>${I('bld',14)}The room and tables</li></ul></div>
  </div>
  <div><h5 style="font-size:12px;font-weight:600;color:var(--mu);margin-bottom:6px">Need a change? Contact the venue</h5>
  <ul class="ct"><li>${I('mail',16)}<a href="#" data-toast="Opens your email app.">${v.email}</a></li><li>${I('phone',16)}<a href="#" data-toast="Opens your phone app.">${v.phone}</a></li></ul></div>
 </div>`:'';
 if(S.pop)$('popx').focus();
}

/* ---------- events ---------- */
function closeMenus(){if(!S.menu)return;const m=S.menu;S.menu=null;if(m.startsWith('dd-'))rerenderDD(m.slice(3));else{renderSide();renderTop()}}
document.addEventListener('click',ev=>{
 const t=ev.target.closest('button,a,[data-act]');
 const inMenu=ev.target.closest('.menu');
 if(!t){closeMenus();return}
 const d=t.dataset;
 if(t.id==='burger'){$('app').classList.add('drawer');return}
 if(t.id==='close'){$('app').classList.remove('drawer');return}
 if(t.id==='bell'){toast('Notifications use the existing bell.');return}
 if(t.id==='evbtn'){const o=S.menu==='evs';closeMenus();S.menu=o?null:'evs';renderSide();return}
 if(t.id==='who'){const o=S.menu==='who';closeMenus();S.menu=o?null:'who';renderTop();return}
 if(d.dd){const id='dd-'+d.dd,o=S.menu===id;closeMenus();S.menu=o?null:id;rerenderDD(d.dd);if(!o)$('dd-'+d.dd).querySelector('.mi.sel')?.focus();return}
 if(d.opt){const [id,val]=d.opt.split(':');if(id==='lang')F.lang=val;else F.country=val;S.menu=null;rerenderDD(id);syncDirty();$('dd-'+id).querySelector('.ddb').focus();return}
 if(t.id==='mgdbtn'){closeMenus();S.pop=true;renderPop();return}
 if(d.act==='closepop'){S.pop=false;renderPop();$('mgdbtn')?.focus();return}
 if(t.id==='upload'){F.cover=(F.cover+1)%COVERS.length;const c=COVERS[F.cover];const p=$('pcov');p.className='pcov '+c[0];p.innerHTML=I(c[1],36);syncDirty();toast('Photo chosen (simulated). Save to apply it.');return}
 if(t.id==='save'||t.id==='save2'){save();return}
 if(t.id==='discard'||t.id==='discard2'){discard();return}
 if(d.close){closeMenus();return}
 if(d.here){ev.preventDefault();closeMenus();$('app').classList.remove('drawer');return}
 if(d.page){ev.preventDefault();closeMenus();$('app').classList.remove('drawer');toast(changes()?`You have unsaved changes. Save or discard them before leaving. (${d.page} isn't part of this mockup.)`:`${d.page} isn't part of this mockup.`);return}
 if(d.toast){ev.preventDefault();closeMenus();toast(d.toast);return}
 if(S.menu&&!inMenu)closeMenus();
});
document.addEventListener('input',ev=>{
 const t=ev.target;
 if(t.id==='in-name'){F.name=t.value;$('cnt-name').textContent=t.value.length+'/80';syncDirty()}
 if(t.id==='in-pg'){F.perGuest=t.value;syncDirty()}
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'){if(S.pop){S.pop=false;renderPop();$('mgdbtn')?.focus();return}if(S.menu){const m=S.menu;closeMenus();if(m.startsWith('dd-'))$(m)?.querySelector('.ddb')?.focus();return}$('app').classList.remove('drawer')}
 if((ev.key==='ArrowDown'||ev.key==='ArrowUp')&&ev.target.closest('.ddm')){ev.preventDefault();const items=[...ev.target.closest('.ddm').querySelectorAll('.mi')];let i=items.indexOf(ev.target)+(ev.key==='ArrowDown'?1:-1);items[(i+items.length)%items.length].focus()}
 if(ev.key==='Enter'&&ev.target.tagName==='INPUT'){ev.preventDefault();if(!$('save').disabled)save()}
});
$('scrim').addEventListener('click',()=>$('app').classList.remove('drawer'));
renderSide();renderTop();renderPage();
}
</script>
</body></html>
