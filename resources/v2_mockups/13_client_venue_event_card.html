<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client: Managed by venue (mockup #13)</title>
<style>
/* Mockup #13, client_venue_event_card: the client's Personal "My Events" with a venue event marked "Managed by Grand Garden Hall",
   and the same badge inside the event (Dashboard header + event selector).
   Tokens: DESIGN_GUIDE.md / tokens.css. Layout: sidebar at 1024px+, drawer below, phone layout below 768px.
   Routes: #events (My Events) and #dashboard (inside Dana & Yossi's Wedding). */
:root{color-scheme:light;--bg:#F6F7FB;--sf:#fff;--sfm:#F8F9FC;--bd:#E5E8F0;--bds:#CFD4E2;--tx:#0F1433;--mu:#5B6480;--sb:#626B85;--pr:#4F46E5;--prh:#4338CA;--prs:#EEF0FF;--prb:#C9CDFB;--nv1:#0F1535;--nv2:#151C47;--nvr:#1B2350;--nvb:#262E5C;--nvt:#F1F3FB;--nvm:#B4BBD6;--own:#D97706;--sh:0 1px 2px rgb(15 20 51/6%);--shm:0 8px 24px rgb(15 20 51/12%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 Inter,system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Hebrew',Arial,sans-serif;color:var(--tx);background:var(--bg)}
ul{list-style:none}a{text-decoration:none;color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.i{flex:none;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--pr);color:#fff}.btn.pri:hover{background:var(--prh)}
.btn.sec{background:#fff;color:var(--pr);border:1px solid var(--prb)}.btn.sec:hover{border-color:var(--pr)}
.btn.soft{background:var(--prs);color:var(--pr)}
.btn.sm{height:36px;padding:0 14px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.badge.lg{height:28px;padding:0 12px;gap:6px}
.success{color:#15803D;background:#E6F7EC;border-color:#BDE5CB}
.warning{color:#B45309;background:#FFF4E3;border-color:#F8D8A4}
.danger{color:#C81E1E;background:#FDECEC;border-color:#F6C4C4}
.info{color:#4338CA;background:#EEF0FF;border-color:#C9CDFB}
.neutral{color:#475069;background:#ECEFF5;border-color:#D9DEEA}
/* "Managed by" badge: Info tone + building-2 (DESIGN_GUIDE §12). Wraps instead of overflowing for long venue names / PT text. */
.mgd{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.4;border:1px solid #C9CDFB;background:#EEF0FF;color:#4338CA;text-align:start;max-width:100%}
button.mgd:hover{border-color:#4338CA}
.mgd .i{flex:none}
/* shell */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30;background:linear-gradient(180deg,var(--nv1),var(--nv2));color:var(--nvt);display:flex;flex-direction:column;padding:16px}
.dh{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;padding:4px 8px 0}
.logo .mk{width:32px;height:32px;border-radius:8px;background:var(--pr);display:grid;place-items:center;color:#fff}
.xb{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--nvb);place-items:center;color:var(--nvt)}
.evs{position:relative;margin-top:20px}
.evbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--nvr);border:1px solid var(--nvb);text-align:start;color:var(--nvt)}
.evbtn.open{border-color:var(--nvm)}
.evbtn .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}
.evbtn .sub{font-size:12px;color:var(--nvm);display:block;margin-top:2px;line-height:1.4}
.evbtn .sub .i{display:inline-block;vertical-align:-2px;margin-right:4px}
.evbtn .grow{flex:1;min-width:0}
.evbtn>.i{color:var(--nvm)}
.cov{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.g1{background:linear-gradient(135deg,#8B5CF6,#EC4899)}.g2{background:linear-gradient(135deg,#10B981,#3B82F6)}.g3{background:linear-gradient(135deg,#0EA5E9,#6366F1)}.g4{background:linear-gradient(135deg,#F59E0B,#EC4899)}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--nvm)}
.nav a:hover{background:var(--nvr)}
.nav a.on{background:var(--nvr);color:var(--nvt);font-weight:600}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
.lang{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--nvb);background:var(--nvr);font-size:14px;width:100%;color:var(--nvt)}
.lang span{flex:1;text-align:start}
.out{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;font-size:14px;color:var(--nvm);width:100%}
.out:hover{color:var(--nvt)}
/* dropdown menus (product list design) */
.menu{position:absolute;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:50}
.menu h4{font-size:12px;font-weight:500;color:var(--mu);padding:8px 12px 4px}
.mi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;width:100%;text-align:start;font-size:14px;font-weight:500}
.mi:hover{background:var(--sfm)}
.mi.sel{background:var(--prs)}
.mi .tx{flex:1;min-width:0}.mi .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}.mi .sub{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:4px}
.mi .ck{color:var(--pr)}
.mi>.i{color:var(--mu)}
.msep{height:1px;background:var(--bd);margin:8px 0}
.mnote{display:flex;gap:8px;padding:8px 12px 4px;font-size:12px;color:var(--mu);line-height:1.5}
.mnote .i{color:#4338CA;margin-top:2px}
.evs .menu{left:0;top:calc(100% + 8px);width:100%;min-width:248px}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 32px;position:sticky;top:0;z-index:20}
.ibtn{width:44px;height:44px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--tx)}
.ibtn.on{background:var(--prs);color:var(--pr);border-color:var(--prb)}
.top .mk{display:none;width:40px;height:40px;border-radius:10px;background:var(--pr);place-items:center;color:#fff}
.top .sp{flex:1}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--mu)}
.bell em{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:#C81E1E;color:#fff;font-size:11px;font-weight:600;font-style:normal;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.rolei{width:36px;height:44px;display:grid;place-items:center;color:var(--own)}
.av{width:40px;height:40px;border-radius:50%;background:var(--prs);color:var(--pr);font-size:14px;font-weight:600;display:grid;place-items:center;flex:none}
.whob{position:relative}
.who{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}.who .i{color:var(--mu)}
.whob .menu{right:0;top:calc(100% + 8px);width:260px}
.ume{padding:8px 12px 4px}.ume b{display:block;font-size:14px}.ume span{font-size:12px;color:var(--mu)}
/* page */
.content{padding:24px 32px 40px;width:100%;max-width:1344px;display:flex;flex-direction:column;gap:24px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.ph h1{font-size:32px;line-height:1.2;font-weight:700}
.ph p{color:var(--mu);margin-top:4px}
.phm{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:12px;position:relative}
.phm .ctx{font-size:14px;color:var(--mu);display:flex;align-items:center;gap:6px}
.phm .ctx .i{color:var(--sb)}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px}
.chd h2{font-size:18px;font-weight:600;line-height:1.3}
.chd p{font-size:14px;color:var(--mu);margin-top:4px}
.chd{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
/* My Events toolbar */
.tb{display:flex;align-items:center;gap:16px;justify-content:space-between}
.tabs{display:flex;gap:4px;padding:4px;background:#fff;border:1px solid var(--bd);border-radius:14px}
.tabs button{height:36px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mu);display:flex;align-items:center;gap:8px}
.tabs button em{font-style:normal;min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:#ECEFF5;color:#475069;font-size:12px;font-weight:600;display:grid;place-items:center}
.tabs button.on{background:var(--pr);color:#fff;font-weight:600}
.tabs button.on em{background:#fff;color:var(--pr)}
.tbr{display:flex;align-items:center;gap:12px}
.srch{position:relative;width:352px}
.srch .i{position:absolute;left:14px;top:13px;color:var(--sb);pointer-events:none}
.srch input{display:block;height:44px;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff;padding:0 16px 0 42px;font-size:14px;color:var(--tx)}
.srch input::placeholder{color:var(--sb)}
.srch input:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.sbtn{display:none}
.vt{display:flex;gap:4px;padding:4px;background:#fff;border:1px solid var(--bd);border-radius:10px}
.vt button{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;color:var(--mu)}
.vt button.on{background:var(--prs);color:var(--pr)}
.mcta{display:none}
/* event cards */
.evgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:stretch}
.ec{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);overflow:visible;display:flex;flex-direction:column;position:relative}
.ec.venue{border-color:var(--prb)}
.ecov{height:152px;border-radius:13px 13px 0 0;position:relative;display:grid;place-items:center;color:#fff;flex:none}
.stp{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:#E6F7EC;color:#15803D;font-size:12px;font-weight:600}
.stp::before{content:"";width:7px;height:7px;border-radius:50%;background:#15803D}
.stp.past{background:#ECEFF5;color:#475069}.stp.past::before{background:#475069}
.dots{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;background:#fff;color:var(--tx);display:grid;place-items:center}
.ec .menu{right:12px;top:52px;width:280px}
.ebody{padding:20px;display:flex;flex-direction:column;gap:12px;flex:1}
.ebody h3{font-size:18px;font-weight:600;line-height:1.3}
.meta{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mu)}
.meta li{display:flex;align-items:center;gap:8px}
.meta li .i{color:var(--sb)}
.meta .crown{color:var(--own)}
.prog{margin-top:auto;padding-top:4px}
.prog .row{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.bar{height:6px;border-radius:999px;background:#ECEFF5;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);border-radius:999px}
.ebody .btn{align-self:flex-start;margin-top:4px}
.chev{display:none}
/* list view */
.evgrid.list{grid-template-columns:1fr;gap:16px}
.evgrid.list .ec{flex-direction:row;padding:20px;gap:20px;align-items:stretch}
.evgrid.list .ecov{width:200px;height:auto;min-height:180px;border-radius:10px}
.evgrid.list .stp{top:auto;bottom:12px}
.evgrid.list .ebody{padding:0}
.evgrid.list .ec .menu{left:20px;right:auto;top:60px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 16px}
.empty .ic{width:56px;height:56px;border-radius:50%;background:var(--prs);color:var(--pr);display:grid;place-items:center}
.empty p{font-size:14px;color:var(--mu)}
/* venue popover */
.pop{position:absolute;left:0;top:calc(100% + 8px);width:400px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:20px;z-index:40;display:flex;flex-direction:column;gap:16px;font-size:14px}
.pop .phd{display:flex;gap:12px;align-items:flex-start}
.pop .phd .grow{flex:1;min-width:0}
.pop .phd b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.pop .phd span{color:var(--mu);font-size:14px}
.sic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--prs);color:var(--pr)}
.xbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mu);margin:-6px -8px 0 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split div{padding:12px;border-radius:10px;background:var(--sfm);border:1px solid var(--bd)}
.split h5{font-size:12px;font-weight:600;color:var(--mu);margin-bottom:6px}
.split li{display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:1.4;padding:2px 0}
.split li .i{margin-top:1px}
.split .y .i{color:#15803D}.split .v .i{color:#4338CA}
.ct{display:flex;flex-direction:column;gap:6px;color:var(--mu)}
.ct li{display:flex;gap:8px;align-items:center}.ct .i{color:var(--sb)}
.ct a{color:var(--pr);font-weight:500;direction:ltr}
/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:134px}
.kpi .l{font-size:14px;color:var(--mu);line-height:1.5}
.kpi .n{font-size:24px;font-weight:700;line-height:1.2;margin-top:2px}
.kpi .u{font-size:12px;color:var(--sb)}
.kic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.t-pr{background:#EEF0FF;color:#4F46E5}.t-ok{background:#E6F7EC;color:#15803D}.t-wa{background:#FFF4E3;color:#B45309}.t-da{background:#FDECEC;color:#C81E1E}.t-ne{background:#ECEFF5;color:#475069}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ncard{display:flex;gap:12px;align-items:flex-start;padding:20px;border-radius:14px;border:1px solid;text-align:start;width:100%}
.ncard .grow{flex:1;min-width:0}
.ncard b{display:block;font-size:14px;font-weight:600}
.ncard p{font-size:14px;color:var(--mu);margin-top:4px}
.ncard>.i:last-child{align-self:center;color:var(--mu)}
.ncard.warning b,.ncard.warning>.i:first-child{color:#B45309}
.ncard.danger b,.ncard.danger>.i:first-child{color:#C81E1E}
.ncard.info b,.ncard.info>.i:first-child{color:#4338CA}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rsvp{display:flex;align-items:center;gap:28px;margin-top:20px}
.donut{width:152px;height:152px;border-radius:50%;flex:none;display:grid;place-items:center}
.donut div{width:100px;height:100px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut b{font-size:24px;font-weight:700;line-height:1.2}.donut span{font-size:14px;color:var(--mu)}
.leg{flex:1;font-size:14px}
.leg li{display:grid;grid-template-columns:1fr 48px 48px;align-items:center;height:38px;border-bottom:1px solid var(--bd)}
.leg li:last-child{border-bottom:0}
.leg .k{display:flex;align-items:center;gap:8px;font-weight:500}
.leg .k i{width:10px;height:10px;border-radius:50%}
.leg .c{text-align:end;font-weight:600}.leg .p{text-align:end;color:var(--mu)}
.cap{margin-top:20px;display:flex;flex-direction:column;gap:24px;font-size:14px}
.cap .row{display:flex;justify-content:space-between;color:var(--mu)}
.cap .tr{position:relative;height:12px;border-radius:999px;background:#ECEFF5;margin-top:8px}
.cap .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.cap .tr::after{content:"";position:absolute;right:0;top:-6px;bottom:-6px;border-right:2px dashed var(--mu)}
.cap small{font-size:12px;color:var(--mu)}
.act{margin-top:12px}
.act li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.act li:last-child{border-bottom:0}
.act .grow{flex:1;min-width:0}
.act b{display:block;font-size:14px;font-weight:600}.act span{font-size:14px;color:var(--mu)}
.act time{font-size:12px;color:var(--mu);white-space:nowrap}
.aic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.qa button{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--bd);border-radius:14px;text-align:start}
.qa button:hover{border-color:var(--bds)}
.qa .grow{flex:1;min-width:0}
.qa b{display:block;font-size:14px;font-weight:600}.qa .grow span{font-size:12px;color:var(--mu);line-height:1.5;display:block}
.qa button>.i:last-child{color:var(--mu)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--tx);color:#fff;font-size:14px;padding:12px 16px;border-radius:10px;box-shadow:var(--shm);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:70;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:none}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1279px){.evgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* compact: drawer */
@media (max-width:1023px){
 .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(320px,85vw);transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shm)}
 .app.drawer .side{transform:none}
 .scrim{display:block;position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
 .app.drawer .scrim{opacity:1;pointer-events:auto}
 .xb,.top .mk{display:grid}
 .top{padding:0 16px;gap:12px}
 .notes{grid-template-columns:1fr}
 .two{grid-template-columns:1fr}
}
/* phone */
@media (max-width:767px){
 .who .nm,.who .i{display:none}
 .content{padding:24px 16px 40px;gap:20px}
 .ph{flex-direction:column;gap:16px}
 .ph h1{font-size:28px}
 .ph .act-r{width:100%}.ph .act-r .btn{width:100%}
 .card{padding:16px}
 .tb{flex-direction:column;align-items:stretch;gap:16px}
 .tabs button{flex:1;justify-content:center;padding:0 8px}
 .tbr{justify-content:flex-end}
 .srch{display:none;width:100%}
 .tbr.searching .srch{display:block}
 .tbr.searching .vt,.tbr.searching .sbtn{display:none}
 .sbtn{display:grid;color:var(--pr);border-color:var(--prb)}
 .ph .cta{display:none}
 .mcta{display:flex;width:100%}
 .evgrid,.evgrid.list{grid-template-columns:1fr;gap:16px}
 .evgrid.list .ec{padding:16px;gap:16px}
 .evgrid.list .ecov{width:116px;min-height:0}
 .evgrid.list .ecov>svg{width:36px;height:36px}
 .evgrid.list .stp{left:8px;right:8px;bottom:8px;justify-content:center;padding:0 6px}
 .evgrid.list .dots{right:8px;top:8px}
 .evgrid.list .ebody .btn{display:none}
 .evgrid.list .ebody{gap:8px}
 .evgrid.list .ebody h3{font-size:16px;padding-right:24px}
 .evgrid.list .chev{display:block;position:absolute;right:12px;top:18px;color:var(--mu)}
 .evgrid.list .ec .menu{left:16px;right:16px;width:auto;top:56px}
 .evgrid.list .meta{gap:4px}
 .ec .menu{left:12px;right:12px;width:auto}
 .kpis{grid-template-columns:1fr 1fr;gap:12px}

/* ---------- My Events ---------- */
function cardMenu(e){
 if(e.venue) return `<div class="menu" role="menu"><button class="mi" role="menuitem" data-open="${e.id}">${I('arrow',18)}Open Event</button><button class="mi" role="menuitem" data-pop="1">${I('bld',18)}Venue Details</button><div class="msep"></div><div class="mnote">${I('info',14)}<span>Editing details, duplicating and deleting aren't available here. ${esc(e.venue.name)} manages this event.</span></div></div>`;
 return `<div class="menu" role="menu"><button class="mi" role="menuitem" data-act="toast" data-msg="Opening ${esc(e.name)} isn't part of this mockup.">${I('arrow',18)}Open Event</button><button class="mi" role="menuitem" data-act="toast" data-msg="Edit isn't part of this mockup.">${I('pencil',18)}Edit</button><button class="mi" role="menuitem" data-act="toast" data-msg="Duplicate isn't part of this mockup.">${I('copy',18)}Duplicate</button><div class="msep"></div><button class="mi" role="menuitem" style="color:#C81E1E" data-act="toast" data-msg="Delete isn't part of this mockup.">${I('trash',18)}Delete</button></div>`;
}
function card(e){
 const pct=Math.round(e.conf/e.max*100);
 return `<article class="ec ${e.venue?'venue':''}" aria-label="${esc(e.name)}">
  <div class="ecov ${e.g}">${I(e.ic,48)}<span class="stp ${e.past?'past':''}">${e.past?'Past':'Upcoming'}</span><button class="dots" data-menu="c-${e.id}" aria-label="More actions for ${esc(e.name)}" aria-haspopup="menu" aria-expanded="${S.menu==='c-'+e.id}">${I('dots',18)}</button></div>
  ${S.menu==='c-'+e.id?cardMenu(e):''}
  <div class="ebody">
   <h3>${esc(e.name)}</h3>
   ${e.venue?`<div>${mgdBadge(e.venue)}</div>`:''}
   <ul class="meta">
    <li>${I('cal',16)}${e.date}</li>
    <li>${I('clock',16)}${e.time}</li>
    ${e.venue?`<li>${I('pin',16)}${esc(e.venue.space)}, ${esc(e.venue.name)}</li>`:''}
    <li>${I('users',16)}${e.max} maximum attendees</li>
    <li>${I(e.roleIcon,16,e.roleIcon==='crown'?'crown':'')}${e.role}</li>
   </ul>
   <div class="prog"><div class="row"><span>${e.conf} confirmed</span><span>${e.max} capacity</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
   <button class="btn pri" data-open="${e.id}">Open Event ${I('arrow',18)}</button>
  </div>
  <span class="chev">${I('right',20)}</span>
 </article>`;
}
function renderEvents(){
 const up=EVENTS.filter(e=>!e.past).length,past=EVENTS.length-up;
 const lay=S.layout||(isPhone()?'list':'grid');
 let list=ORDER.map(id=>EVENTS.find(e=>e.id===id)).filter(e=>S.tab==='all'||(S.tab==='up'?!e.past:e.past));
 if(S.q) list=list.filter(e=>(e.name+' '+(e.venue?e.venue.name+' '+e.venue.space:'')).toLowerCase().includes(S.q.toLowerCase()));
 $('content').innerHTML=`
 <div class="ph"><div><h1>My Events</h1><p>Manage your events, guests, and RSVPs all in one place.</p></div><button class="btn pri cta" data-act="toast" data-msg="Create Event opens the existing event dialog.">${I('plus',18)}Create Event</button></div>
 <div class="tb">
  <div class="tabs" role="tablist">${[['all','All Events',EVENTS.length],['up','Upcoming',up],['past','Past',past]].map(([k,l,n])=>`<button role="tab" aria-selected="${S.tab===k}" class="${S.tab===k?'on':''}" data-tab="${k}">${l}<em>${n}</em></button>`).join('')}</div>
  <div class="tbr ${S.searching?'searching':''}" id="tbr">
   <label class="srch"><span class="sr">Search events</span>${I('search',18)}<input id="q" type="search" placeholder="Search events..." value="${esc(S.q)}"></label>
   <button class="ibtn sbtn" id="sbtn" aria-label="Search events">${I('search',20)}</button>
   <div class="vt" role="group" aria-label="View"><button class="${lay==='grid'?'on':''}" data-lay="grid" aria-label="Grid view" aria-pressed="${lay==='grid'}">${I('grid',18)}</button><button class="${lay==='list'?'on':''}" data-lay="list" aria-label="List view" aria-pressed="${lay==='list'}">${I('list',18)}</button></div>
  </div>
  <button class="btn pri mcta" data-act="toast" data-msg="Create Event opens the existing event dialog.">${I('plus',18)}Create Event</button>
 </div>
 ${list.length?`<div class="evgrid ${lay==='list'?'list':''}">${list.map(card).join('')}</div>`:`<div class="card empty"><span class="ic">${I('search',24)}</span><p>No events match "${esc(S.q)}".</p><button class="btn sec" data-act="clearq">Clear search</button></div>`}
 ${S.pop?venuePop(true):''}`;
}

/* ---------- venue popover / sheet ---------- */
function venuePop(standalone){
 const v=EVENTS[0].venue;
 return `<div class="popscrim ${standalone?'all':''}" data-act="closepop"></div>
 <div class="pop ${standalone?'center':''}" role="dialog" aria-labelledby="poph">
  <div class="phd"><span class="sic">${I('bld',20)}</span><div class="grow"><b id="poph">Managed by ${esc(v.name)}</b><span>${esc(v.space)} · ${esc(v.address)}</span></div><button class="xbtn" data-act="closepop" aria-label="Close">${I('x',18)}</button></div>
  <p style="color:var(--mu)">You were invited to plan this event by ${esc(v.name)}. Here is who takes care of what.</p>
  <div class="split">
   <div><h5>You manage</h5><ul class="y"><li>${I('check',14)}Guests and import</li><li>${I('check',14)}RSVP page</li><li>${I('check',14)}WhatsApp messages</li><li>${I('check',14)}Seating guests at tables</li><li>${I('check',14)}Your team</li></ul></div>
   <div><h5>${esc(v.name)} manages</h5><ul class="v"><li>${I('bld',14)}Date and time</li><li>${I('bld',14)}Space and address</li><li>${I('bld',14)}Maximum attendees</li><li>${I('bld',14)}The room and tables</li></ul></div>
  </div>
  <div><h5 style="font-size:12px;font-weight:600;color:var(--mu);margin-bottom:6px">Need a change? Contact the venue</h5>
  <ul class="ct"><li>${I('mail',16)}<a href="#" data-act="toast" data-msg="Opens your email app.">events@grandgardenhall.example.com</a></li><li>${I('phone',16)}<a href="#" data-act="toast" data-msg="Opens your phone app.">03-000-0000</a></li></ul></div>
 </div>`;
}

/* ---------- Dashboard ---------- */
function renderDash(){
 const e=EVENTS[0],v=e.venue;
 const K=[['Total Guests',162,'invitations','users','t-pr'],['Invitations Sent',140,'invitations','mail','t-pr'],['Invitations Not Sent',22,'invitations','send','t-ne'],['Awaiting Response',24,'invitations','clock','t-wa'],['RSVP Approved',98,'invitations','cc','t-ok'],
  ['RSVP Not Sure',6,'invitations','help','t-wa'],['RSVP Declined',12,'invitations','x','t-da'],['Confirmed Attendees',264,'people','userck','t-ok'],['Seating Capacity',280,'chairs','chair','t-pr'],['Unassigned Confirmed Attendees',38,'people','userx','t-wa']];
 const R=[['Approved',98,60,'#22C55E'],['Declined',12,7,'#EF4444'],['Not Sure',6,4,'#F59E0B'],['Awaiting Response',24,15,'#94A3B8'],['Not Sent',22,14,'#CBD5E1']];
 let acc=0;const grad=R.map(r=>{const s=acc;acc+=r[2];return `${r[3]} ${s}% ${acc}%`}).join(',');
 $('content').innerHTML=`
 <div class="ph"><div><h1>Dashboard</h1><p>Overview of your event guests and RSVPs.</p>
   <div class="phm" id="phm">${mgdBadge(v,'button',`id="mgdbtn" aria-haspopup="dialog" aria-expanded="${S.pop}"`)}<span class="ctx">${I('pin',16)}${esc(v.space)} · ${esc(v.address)}</span><span class="ctx">${I('cal',16)}${e.date}, ${e.time}</span>${S.pop?venuePop(false):''}</div>
  </div><div class="act-r"><button class="btn sec" data-page="Event Settings">${I('gear',18)}Event Settings</button></div></div>
 <div class="kpis">${K.map(([l,n,u,ic,t])=>`<div class="kpi"><div><div class="l">${l}</div><div class="n">${n}</div><div class="u">${u}</div></div><span class="kic ${t}">${I(ic,22)}</span></div>`).join('')}</div>
 <div class="notes">
  <button class="ncard danger" data-page="Event Layout">${I('users',20)}<span class="grow"><b>Tables over capacity: 1</b><p>Table 9 is over its capacity by 2. Move guests to another table.</p></span>${I('right',18)}</button>
  <button class="ncard info" data-page="Event Layout">${I('chair',20)}<span class="grow"><b>Confirmed attendees without a table</b><p>38 confirmed attendees are not assigned to a table yet.</p></span>${I('right',18)}</button>
  <button class="ncard info" data-act="openpop">${I('bld',20)}<span class="grow"><b>Grand Garden Hall updated the room</b><p>2 tables were added in the Main Hall yesterday. Your seating was not changed.</p></span>${I('right',18)}</button>
 </div>
 <div class="two">
  <section class="card"><div class="chd"><div><h2>RSVP Status</h2><p>Breakdown of guest responses.</p></div></div>
   <div class="rsvp"><div class="donut" style="background:conic-gradient(${grad})" role="img" aria-label="162 guests"><div><b>162</b><span>Guests</span></div></div>
   <ul class="leg">${R.map(r=>`<li><span class="k"><i style="background:${r[3]}"></i>${r[0]}</span><span class="c">${r[1]}</span><span class="p">${r[2]}%</span></li>`).join('')}</ul></div></section>
  <section class="card"><div class="chd"><div><h2>Attendance vs Capacity</h2><p>Confirmed attendees and table seats compared to your event maximum.</p></div></div>
   <div class="cap"><div><div class="row"><span>Confirmed Attendees</span><span>264 / 350</span></div><div class="tr"><i style="width:75%;background:#4F46E5"></i></div></div>
   <div><div class="row"><span>Seating Capacity (Tables)</span><span>280 / 350</span></div><div class="tr"><i style="width:80%;background:#A5B4FC"></i></div></div>
   <small>The dashed line marks the event maximum of 350 attendees, set by ${VENUE}.</small></div></section>
 </div>
 <div class="two">
  <section class="card"><div class="chd"><div><h2>Recent Guest Activity</h2><p>Latest RSVP responses and invitation activity.</p></div><button class="btn sec sm" data-page="Guests">View All</button></div>
   <ul class="act">${[['cc','t-ok','Noa Shapiro','RSVP approved, 2 attending','Today, 13:49'],['help','t-wa','Amit Cohen','RSVP submitted: not sure','Today, 11:41'],['x','t-da','Lior Ben-David','RSVP declined','Today, 10:07'],['cc','t-ok','Tamar Katz','RSVP approved, 4 attending','Today, 03:15'],['cc','t-ok','Eitan Mizrahi','RSVP approved, 2 attending','Today, 00:41']].map(([ic,t,n,s,tm])=>`<li><span class="aic ${t}">${I(ic,16)}</span><span class="grow"><b>${n}</b><span>${s}</span></span><time>${tm}</time></li>`).join('')}</ul></section>
  <section class="card"><div class="chd"><div><h2>Quick Actions</h2><p>Common tasks for your event.</p></div></div>
   <div class="qa">
    <button data-page="Guests"><span class="kic t-pr">${I('users',20)}</span><span class="grow"><b>Manage Guests</b><span>Add, edit or import guests</span></span>${I('right',18)}</button>
    <button data-page="Messages"><span class="kic t-ok">${I('wa',20)}</span><span class="grow"><b>Send WhatsApp Messages</b><span>Open WhatsApp with your template</span></span>${I('right',18)}</button>
    <button data-page="RSVP"><span class="kic t-pr">${I('mail',20)}</span><span class="grow"><b>RSVP Settings</b><span>Copy link and customize messages</span></span>${I('right',18)}</button>
    <button data-page="Event Layout"><span class="kic t-wa">${I('layout',20)}</span><span class="grow"><b>Seat Guests</b><span>Assign guests to the venue's tables</span></span>${I('right',18)}</button>
   </div></section>
 </div>`;
}

/* ---------- render + routing ---------- */
function render(){
 renderSide();renderTop();
 if(S.view==='events')renderEvents();else renderDash();
 document.title=(S.view==='events'?'My Events':'Dashboard')+' · Client: Managed by venue (mockup #13)';
}
let HASH=null;const curHash=()=>HASH!==null?HASH:location.hash;
const go=h=>{try{location.hash=h}catch(e){}if(location.hash===h){HASH=null}else{HASH=h;route()}};
function route(){S.view=curHash()==='#dashboard'?'event':'events';S.menu=null;S.pop=false;$('app').classList.remove('drawer');render();scrollTo(0,0)}
addEventListener('hashchange',route);
/* In a preview, '#…' links resolve against the host page and would reload the frame, so route them in place. */
document.addEventListener('click',ev=>{const a=ev.target.closest('a[href^="#"]');if(!a)return;ev.preventDefault();const h=a.getAttribute('href'),d=a.dataset;if(h.length>1&&!d.page&&!d.act&&!d.open&&!d.go)go(h)},true);
let lastPhone=isPhone();addEventListener('resize',()=>{if(isPhone()!==lastPhone){lastPhone=isPhone();render()}});

document.addEventListener('click',ev=>{
 const t=ev.target.closest('button,a,[data-act]');
 const inMenu=ev.target.closest('.menu,.pop');
 if(!t){if(S.menu||(S.pop&&!inMenu)){S.menu=null;if(!inMenu)S.pop=false;render()}return}
 const d=t.dataset;
 if(t.id==='burger'){$('app').classList.add('drawer');return}
 if(t.id==='close'){$('app').classList.remove('drawer');return}
 if(t.id==='bell'){toast('Notifications use the existing bell.');return}
 if(t.id==='evbtn'){S.menu=S.menu==='evs'?null:'evs';render();return}
 if(t.id==='who'){S.menu=S.menu==='who'?null:'who';render();return}
 if(t.id==='mgdbtn'){S.pop=!S.pop;S.menu=null;render();return}
 if(t.id==='sbtn'){S.searching=true;render();$('q').focus();return}
 if(d.menu){S.menu=S.menu===d.menu?null:d.menu;render();return}
 if(d.tab){S.tab=d.tab;S.menu=null;render();return}
 if(d.lay){S.layout=d.lay;render();return}
 if(d.open){ev.preventDefault();if(d.open==='wed'){go('#dashboard')}else{S.menu=null;render();toast('Opening this event isn\'t part of this mockup.')}return}
 if(d.ev){if(d.ev==='wed'){S.menu=null;render()}else{S.menu=null;render();toast('Switching events isn\'t part of this mockup.')}return}
 if(d.go){go('#'+d.go);return}
 if(d.pop){S.menu=null;S.pop=true;render();return}
 if(d.page){ev.preventDefault();S.menu=null;render();$('app').classList.remove('drawer');toast(d.page+' isn\'t part of this mockup (see #14–#16 for the client\'s Event Settings, Permissions and Event Layout).');return}
 if(d.act==='openpop'){S.pop=true;render();return}
 if(d.act==='closepop'){S.pop=false;render();return}
 if(d.act==='clearq'){S.q='';render();return}
 if(d.act==='logout'){toast('Log out isn\'t part of this mockup.');return}
 if(d.act==='toast'){ev.preventDefault();S.menu=null;render();toast(d.msg);return}
 if(t.tagName==='A'&&t.getAttribute('href')?.startsWith('#')){$('app').classList.remove('drawer');if(S.menu){S.menu=null}return}
 if(S.menu&&!inMenu){S.menu=null;render()}
});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){S.q=ev.target.value;const pos=ev.target.selectionStart;render();const q=$('q');q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(S.menu||S.pop){S.menu=null;S.pop=false;render()}$('app').classList.remove('drawer')}});
$('scrim').addEventListener('click',()=>$('app').classList.remove('drawer'));
route();
}
</script>
</body></html>
