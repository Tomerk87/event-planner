<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venue Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: the existing Event Planner product, no new styling
   IDEA: a faithful product screen for screenshotting (mockup #7, venue_team)
   PICTURE: the screen itself: venue members, roles, invite / change role / remove
   COLOUR and TYPE: DESIGN_GUIDE.md tokens, Inter
   LAYOUT: one responsive page: sidebar at 1024px+, drawer below, phone cards below 768px */
:root{color-scheme:light;--bg:#F6F7FB;--sf:#fff;--sfm:#F8F9FC;--bd:#E5E8F0;--bds:#CFD4E2;--tx:#0F1433;--mu:#5B6480;--sb:#626B85;--pr:#4F46E5;--prh:#4338CA;--prs:#EEF0FF;--prb:#C9CDFB;--nv1:#0F1535;--nv2:#151C47;--nvr:#1B2350;--nvb:#262E5C;--nvt:#F1F3FB;--nvm:#B4BBD6;--own:#D97706;--sh:0 1px 2px rgb(15 20 51/6%);--shm:0 8px 24px rgb(15 20 51/12%);--shb:0 -4px 16px rgb(15 20 51/8%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
ul{list-style:none}a{text-decoration:none;color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.i{flex:none;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--pr);color:#fff}.btn.pri:hover{background:var(--prh)}
.btn.sec{background:#fff;color:var(--pr);border:1px solid var(--prb)}.btn.sec:hover{border-color:var(--pr)}
.btn.soft{background:var(--prs);color:var(--pr)}
.btn.ghost{color:var(--mu)}.btn.ghost:hover{background:var(--sfm)}
.btn.dan{background:#C81E1E;color:#fff}.btn.dan:hover{background:#A51616}
.btn.sm{height:36px;padding:0 14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.icb.dan{background:#FDECEC;color:#C81E1E;border:1px solid #F6C4C4}.icb.dan:hover{border-color:#C81E1E}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.success{color:#15803D;background:#E6F7EC;border-color:#BDE5CB}
.warning{color:#B45309;background:#FFF4E3;border-color:#F8D8A4}
.info{color:#4338CA;background:#EEF0FF;border-color:#C9CDFB}
.neutral{color:#475069;background:#ECEFF5;border-color:#D9DEEA}
.badge.owner .i{color:var(--own)}
/* shell (same as Venue My Spaces) */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30;background:linear-gradient(180deg,var(--nv1),var(--nv2));color:var(--nvt);display:flex;flex-direction:column;padding:16px}
.app.collapsed .side{display:none}
.dh{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;padding:4px 8px 0}
.logo .mk{width:32px;height:32px;border-radius:8px;background:var(--pr);display:grid;place-items:center;color:#fff}
.xb{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--nvb);place-items:center;color:var(--nvt)}
.ws{position:relative;margin-top:20px}
.wsbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--nvr);border:1px solid var(--nvb);text-align:start;color:var(--nvt)}
.wsbtn.open{border-color:var(--nvm)}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.tile.v{background:linear-gradient(135deg,#6366F1,#4F46E5)}
.tile.v2{background:linear-gradient(135deg,#0EA5E9,#6366F1)}
.tile.p{background:var(--prs);color:var(--pr)}
.wsbtn .nm{font-size:14px;font-weight:600;line-height:1.3}
.wsbtn .sub{font-size:12px;color:var(--nvm)}
.wsbtn .grow{flex:1}
.wsbtn .i:last-child{color:var(--nvm)}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--nvm)}
.nav a.on{background:var(--nvr);color:var(--nvt);font-weight:600}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.lang{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--nvb);background:var(--nvr);font-size:14px}
.lang span{flex:1}
.out{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;font-size:14px;color:var(--nvm)}
.menu{position:absolute;left:0;top:calc(100% + 8px);width:100%;min-width:216px;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shm);padding:8px;z-index:5}
.menu h4{font-size:12px;font-weight:500;color:var(--mu);padding:8px 12px 4px}
.mi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;width:100%;text-align:start}
.mi.sel{background:var(--prs)}
.mi .tx{flex:1}.mi .nm{font-size:14px;font-weight:600;line-height:1.3;display:block}.mi .sub{font-size:12px;color:var(--mu)}
.mi .ck{color:var(--pr)}
.opt{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 12px;border-radius:10px;font-size:14px;text-align:start}
.opt span{flex:1}.opt .ck{color:var(--pr)}
.opt.sel{background:var(--prs);font-weight:600}
.opt:hover,.mi:hover{background:var(--sfm)}.mi.sel:hover,.opt.sel:hover{background:var(--prs)}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:16px;padding:0 32px;position:sticky;top:0;z-index:10}
.ibtn{width:44px;height:44px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--tx)}
.top .mk{display:none;width:40px;height:40px;border-radius:10px;background:var(--pr);place-items:center;color:#fff}
.top .sp{flex:1}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--mu)}
.bell em{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:#C81E1E;color:#fff;font-size:11px;font-weight:600;font-style:normal;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.av{width:40px;height:40px;border-radius:50%;background:var(--prs);color:var(--pr);font-size:14px;font-weight:600;display:grid;place-items:center;flex:none}
.av.sm{width:32px;height:32px;font-size:12px}
.who{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}.who .i{color:var(--mu)}
/* page */
.content{padding:24px 32px 40px;width:100%;max-width:1344px;display:flex;flex-direction:column;gap:24px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.ph h1{font-size:32px;line-height:1.2;font-weight:700}
.ph p{color:var(--mu);margin-top:4px}
.cta2{display:none}
.note{display:flex;gap:12px;padding:16px 20px;border-radius:14px;border:1px solid}
.note.info{background:#EEF0FF;border-color:#C9CDFB}
.note .i{color:#4338CA;margin-top:2px}
.note b{display:block;font-size:14px;font-weight:600;color:#4338CA}
.note p{font-size:14px;color:var(--mu);margin-top:4px}
.note p strong{color:var(--tx);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.kpi div>span{font-size:14px;color:var(--mu);display:block}
.kpi b{font-size:24px;font-weight:700;line-height:1.3;display:block;margin-top:4px}
.kpi small{font-size:12px;color:var(--sb);display:block}
.kic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.kic.o{background:#FFF4E3;color:var(--own)}.kic.m{background:var(--prs);color:var(--pr)}.kic.n{background:#ECEFF5;color:#475069}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:20px}
.chd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.chd h2{font-size:18px;font-weight:600;line-height:1.3}
.chd p{font-size:14px;color:var(--mu);margin-top:4px}
.ro{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.tools{display:flex;gap:12px;margin-top:20px}
.field{height:44px;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;color:var(--sb)}
.srch{flex:1}
.srch input{border:0;outline:0;font:inherit;font-size:14px;color:var(--tx);flex:1;min-width:0;background:none;height:100%}
.srch:focus-within{border-color:var(--pr)}
.dd{position:relative}
.ddb{height:44px;min-width:150px;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;font-size:14px;color:var(--tx);width:100%}
.ddb:hover{border-color:var(--bds)}.ddb[aria-expanded="true"]{border-color:var(--pr)}
.ddb .i{color:var(--mu)}
.dd .menu{left:auto;right:0;min-width:200px;width:auto}
/* table */
.tbl{margin-top:16px;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{white-space:nowrap;background:var(--sfm);font-weight:500;color:var(--mu);text-align:center;height:46px;padding:0 16px;border-bottom:1px solid var(--bd)}
td{height:60px;padding:8px 16px;border-bottom:1px solid var(--bd)}
tr:last-child td{border-bottom:0}
td.c{text-align:center;white-space:nowrap}
.nmc{display:flex;align-items:center;gap:12px;font-weight:500}
.nmc .na{color:var(--mu);font-weight:400}
.acts{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.you{display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:10px;background:#ECEFF5;color:#475069;font-size:14px;font-weight:500}
.mut{color:var(--mu)}
.tfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:14px;color:var(--mu)}
.nores{padding:40px 20px;text-align:center;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:12px}
.nores .ic{width:48px;height:48px;border-radius:50%;background:var(--prs);color:var(--pr);display:grid;place-items:center}
/* phone cards */
.mcards{display:none}
.mc{border:1px solid var(--bd);border-radius:14px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:12px}
.mtop{display:flex;gap:12px;align-items:flex-start}
.mtop .grow{flex:1;min-width:0}
.mtop h3{font-size:16px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.nrow .badge{margin-top:1px}
.mtop .em{font-size:14px;color:var(--mu);overflow-wrap:anywhere}
.mfig{display:flex;gap:16px;font-size:14px;color:var(--mu);flex-wrap:wrap}
.mfig b{color:var(--tx);font-weight:600}
.mact{display:flex;justify-content:flex-end;gap:8px}
/* dialogs */
.ov{position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
.ov.open{display:flex}
.dlg{width:512px;max-width:100%;max-height:calc(100vh - 48px);background:#fff;border-radius:14px;box-shadow:var(--shm);display:flex;flex-direction:column;overflow:hidden}
.dlg:focus{outline:none}
.dhd{display:flex;align-items:flex-start;gap:16px;padding:20px 24px 16px;border-bottom:1px solid var(--bd)}
.dhd .grow{flex:1;min-width:0}
.dhd h2{font-size:18px;font-weight:600;line-height:1.3}
.dhd p{font-size:14px;color:var(--mu);margin-top:4px}
.dhd .icb{color:var(--mu);margin:-6px -8px 0 0}
.dbody{padding:20px 24px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;flex:1;font-size:14px}
.dbody>p{color:var(--mu)}.dbody>p strong{color:var(--tx);font-weight:600}
.dft{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid var(--bd)}
.lbl{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
.inp{display:block;height:44px;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff;padding:0 16px;font:inherit;font-size:14px;color:var(--tx)}
.inp::placeholder{color:var(--sb)}.inp:hover{border-color:var(--bds)}
.inp:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pr)}
.help{font-size:12px;color:var(--mu);margin-top:8px;line-height:1.5}
.err .inp{border-color:#C81E1E}.err .help{color:#C81E1E}
.roles{display:flex;flex-direction:column;gap:12px}
.rc{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;text-align:start;width:100%}
.rc:hover{border-color:var(--bds)}
.rc.on{border-color:var(--pr);background:var(--prs)}
.rc .rad{width:20px;height:20px;border-radius:50%;border:2px solid var(--bds);flex:none;margin-top:2px;display:grid;place-items:center;background:#fff}
.rc.on .rad{border-color:var(--pr)}.rc.on .rad::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--pr)}
.rc b{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.rc b .i.o{color:var(--own)}.rc b .i.m{color:var(--pr)}
.rc span.d{display:block;font-size:12px;color:var(--mu);margin-top:2px;line-height:1.5}
.pts{display:flex;flex-direction:column;gap:8px;color:var(--mu)}
.pts li{display:flex;gap:8px}.pts .i{color:var(--sb);margin-top:2px}
.ownwarn{display:flex;gap:8px;padding:12px 16px;border-radius:10px;background:#FFF4E3;border:1px solid #F8D8A4;font-size:14px;color:#B45309}
.ownwarn .i{margin-top:2px}
/* mockup state switcher (not part of the product) */
.mock{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;display:flex;align-items:center;gap:8px;background:#fff;border:1px dashed var(--bds);border-radius:14px;box-shadow:var(--shm);padding:6px 6px 6px 14px;font-size:12px;color:var(--mu)}
.seg{display:flex;background:#fff;border-radius:14px;gap:4px}
.seg button{height:32px;padding:0 12px;border-radius:10px;font-size:12px;font-weight:500;color:var(--mu)}
.seg button.on{background:var(--pr);color:#fff;font-weight:600}
.mock .hx{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--mu)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--tx);color:#fff;font-size:14px;padding:12px 16px;border-radius:10px;box-shadow:var(--shm);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:70;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:none}
.app.withmock .toast{bottom:80px}
.hidden{display:none!important}
/* compact: drawer */
@media (max-width:1023px){
 .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(320px,85vw);transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shm)}
 .app.collapsed .side{display:flex}
 .app.drawer .side{transform:none}
 .scrim{display:block;position:fixed;inset:0;background:rgb(15 20 51/55%);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
 .app.drawer .scrim{opacity:1;pointer-events:auto}
 .xb,.top .mk{display:grid}
 .top{padding:0 16px;gap:12px}
}
/* phone */
@media (max-width:767px){
 .who .nm,.who .i{display:none}
 .content{padding:24px 16px 96px;gap:20px}
 .ph h1{font-size:28px}
 .ph .btn{display:none}
 .cta2{display:flex;width:100%;margin-top:-4px}
 .note{padding:16px}
 .kpis,.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .kpi{padding:16px;align-items:flex-start}
 .kpi.k3{grid-column:1/-1}
 .kic{width:40px;height:40px}
 .card.list{background:none;border:0;box-shadow:none;padding:0}
 .tools{flex-direction:column;gap:12px;margin-top:16px}
 .srch{flex:none}
 .mact .btn.sm{height:44px}.mact .icb{width:44px;height:44px}.mact .you{height:44px}
 .dd .menu{left:0;right:auto;width:100%}
 .tbl{display:none}
 .mcards{display:flex;flex-direction:column;gap:12px;margin-top:16px}
 .tfoot{justify-content:center}
 .ov{padding:0;align-items:stretch}
 .ov.sheet{align-items:flex-end}
 .dlg{width:100%;max-height:none;height:100%;border-radius:0}
 .ov.sheet .dlg{height:auto;max-height:90vh;border-radius:14px 14px 0 0}
 .dhd{padding:16px;align-items:center}
 .dbody{padding:20px 16px 24px}
 .dft{padding:12px 16px;box-shadow:var(--shb);border-top:0}
 .dft .btn{flex:1}
 .toast{left:16px;right:16px;bottom:16px}
 .app.withmock .toast{bottom:72px}
 .mock{left:16px;right:16px;transform:none;justify-content:space-between}
 .mock>span{display:none}
 .app.dlgopen .mock{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app withmock" id="app">
 <aside class="side" id="side" aria-label="Main navigation">
  <div class="dh"><div class="logo"><span class="mk" id="lg"></span>Event Planner</div><button class="xb" id="close" aria-label="Close menu"></button></div>
  <div class="ws" id="ws"></div>
  <nav class="nav" id="nav" aria-label="Venue"></nav>
  <div class="foot" id="foot"></div>
 </aside>
 <div class="scrim" id="scrim"></div>
 <div class="main">
  <header class="top"><button class="ibtn" id="burger" aria-label="Menu"></button><span class="mk" id="lg2"></span><span class="sp"></span><span class="bell" id="bell" aria-label="3 notifications"></span><span class="who" id="who"></span></header>
  <main class="content" id="content"></main>
 </div>
 <div class="ov" id="ov" role="presentation"><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dtitle" tabindex="-1"></div></div>
 <div class="mock" id="mock" aria-label="Mockup state (not part of the product)"><span>Mockup view</span><div class="seg" id="mseg"><button data-mock="grand-garden-hall">Owner view</button><button data-mock="seaside-terrace">Manager view</button></div><button class="hx" id="mhide" aria-label="Hide mockup controls"></button></div>
 <div class="toast" id="toast" role="status"></div>
</div>
<script>
{
const P={
logo:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18m-12 6 2 2 4-4"/>',
cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',
bld:'<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
userplus:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
check:'<path d="M20 6 9 17l-5-5"/>',
updown:'<path d="m7 15 5 5 5-5M7 9l5-5 5 5"/>',
