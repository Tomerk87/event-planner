# Until the certificate for ${DOMAIN} exists: lets Let's Encrypt check the
# domain, and says the site is not ready. The application itself needs HTTPS
# (its session cookie is Secure in production).

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  include /etc/nginx/snippets/acme.conf;

  location / {
    default_type text/plain;
    return 503 "The HTTPS certificate is not issued yet.\n";
  }
}
