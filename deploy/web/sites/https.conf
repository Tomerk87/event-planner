# ${DOMAIN} is filled in by 40-choose-site.sh.

server {
  listen 80;
  listen [::]:80;
  server_name ${DOMAIN} www.${DOMAIN};

  include /etc/nginx/snippets/acme.conf;

  location / {
    return 301 https://${DOMAIN}$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ${DOMAIN} www.${DOMAIN};

  ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:5m;
  ssl_session_timeout 1d;

  if ($host = www.${DOMAIN}) {
    return 301 https://${DOMAIN}$request_uri;
  }

  # Inherited by /api/, which sets no headers of its own; the backend adds
  # its own answer headers (setup-app.ts).
  add_header Strict-Transport-Security "max-age=31536000" always;

  include /etc/nginx/snippets/app.conf;
}
