root /usr/share/nginx/html;

# The API and its stored pictures. The client's address is passed as the only
# X-Forwarded-For entry, so a client cannot add addresses of its own; the
# backend trusts one proxy (TRUST_PROXY_HOPS=1) for its rate limits.
location /api/ {
  proxy_pass http://backend:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Pictures arrive inside the request (up to 5 MB, setup-app.ts).
  client_max_body_size 6m;
}

# Built files carry their content's hash in their name: kept for a year. A
# missing one is a 404, never the page, so an old tab reloads (main.tsx).
location /assets/ {
  include /etc/nginx/snippets/page-headers.conf;
  expires 1y;
  try_files $uri =404;
}

# Every other address is a page of the application (/events/..., /rsvp/...),
# answered with index.html, which is never cached so a deploy is seen at once.
location / {
  include /etc/nginx/snippets/page-headers.conf;
  expires -1;
  try_files $uri /index.html;
}
