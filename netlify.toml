# The demo-only site on Netlify (D102, docs/DEPLOYMENT.md "Demo-only site").
# Only the frontend is built; there are no accounts and no server, so the
# visitor's demo lives entirely in their browser.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"
  VITE_DEMO_ENABLED = "true"
  VITE_ACCOUNTS_ENABLED = "false"
  # The demo's limits (D110). Leave them out for the defaults, or set them
  # here or in Netlify's site settings (Environment variables), for example:
  # VITE_TABLE_MAX_SEATS_DEMO = "30"
  # VITE_EVENTS_MAX_DEMO = "10"
  # VITE_LIFETIME_DAYS_DEMO = "3"
  # README.md "Settings" lists every one.

# A file that no longer exists (a tab from an older version) is a real 404,
# so the page reloads instead of reading HTML as a script.
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

# Every page address (/events/evt-1/guests, /rsvp/...) is the application.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Always the deployed version (D107).
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

# File names in /assets/ change with their content.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
